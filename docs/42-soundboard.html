<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>43 — Handpan Insights Soundboard (Isolation & Composition Lab)</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #131722;
    --panel-2: #191f2e;
    --border: #263046;
    --text: #e6ecf7;
    --muted: #8b98b3;
    --accent: #6ee7b7;
    --c-ding: #f59e0b;
    --c-ghost: #38bdf8;
    --c-perc: #f43f5e;
    --c-melody: #a78bfa;
    --c-chord: #34d399;
    --c-prog: #fb923c;
    --c-mod: #22d3ee;
    --c-ctrl: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(11, 13, 18, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
  }
  .top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand span {
    color: var(--muted);
    font-size: 12px;
  }
  .transport {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  button:hover, select:hover { border-color: #4a5c82; }
  button.primary {
    background: #10b981;
    color: #04130d;
    border-color: #34d399;
    font-weight: 700;
  }
  button.primary.playing {
    background: #ef4444;
    color: #fff;
    border-color: #f87171;
  }
  button.danger { border-color: #7f1d1d; color: #fca5a5; }
  .pill-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 4px 8px;
    border-radius: 7px;
  }
  .pill-group label { color: var(--muted); font-size: 11px; }
  .pill-group input[type="range"] { width: 78px; accent-color: var(--accent); }

  /* Live Playhead & Telemetry */
  .playhead-bar {
    margin-top: 8px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }
  .steps-grid {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    gap: 3px;
  }
  .step-cell {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 2px;
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    position: relative;
  }
  .step-cell.downbeat { border-color: #3b4b6b; color: #cbd5e1; font-weight: 700; }
  .step-cell.pickup { border-bottom: 2px solid rgba(244, 63, 94, 0.45); }
  .step-cell.now {
    background: #1e293b;
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 8px rgba(110, 231, 183, 0.35);
  }
  .step-dots {
    display: flex;
    justify-content: center;
    gap: 2px;
    margin-top: 2px;
    height: 5px;
  }
  .sdot { width: 4px; height: 4px; border-radius: 50%; opacity: 0.2; }
  .sdot.lit { opacity: 1; }

  .telemetry {
    display: flex;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .telemetry b { color: var(--accent); font-weight: 600; }

  /* Active Tray & Arc Bar */
  .tray-bar {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    justify-content: space-between;
  }
  .active-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  .chip button {
    padding: 0 3px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
  }
  .chip button:hover { color: #fff; }

  .arc-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .arc-btn { font-size: 11px; padding: 4px 8px; }
  .arc-btn.active { background: #312e81; border-color: #818cf8; color: #e0e7ff; }

  main {
    padding: 14px 16px 40px;
    display: grid;
    gap: 16px;
  }
  .bank {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .bank-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .bank-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
  }
  .bank-swatch {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    display: inline-block;
  }
  .bank-meta {
    font-size: 11px;
    color: var(--muted);
  }
  .pad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
    gap: 8px;
  }
  .pad {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--pad-color, var(--border));
    border-radius: 8px;
    padding: 8px 9px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.08s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .pad:hover {
    border-color: var(--pad-color, #64748b);
    background: #1e2638;
  }
  .pad.active {
    background: rgba(110, 231, 183, 0.09);
    border-color: var(--pad-color, var(--accent));
    box-shadow: inset 0 0 0 1px var(--pad-color, var(--accent));
  }
  .pad.flash {
    transform: scale(0.99);
  }
  .pad-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px;
  }
  .pad-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    color: var(--pad-color, var(--text));
    font-weight: 700;
  }
  .pad-name {
    font-weight: 600;
    font-size: 12.5px;
    flex: 1;
  }
  .pad-desc {
    font-size: 11px;
    color: var(--muted);
    min-height: 28px;
  }
  .pad-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .pad-tag {
    font-size: 10px;
    color: #94a3b8;
    background: rgba(0,0,0,0.28);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .pad-actions {
    display: flex;
    gap: 4px;
  }
  .mini-btn {
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 4px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    color: #cbd5e1;
  }
  .mini-btn:hover { background: #334155; color: #fff; }
  .mini-btn.solo-on { background: #f59e0b; color: #111; border-color: #fbbf24; font-weight: 700; }

  .mod-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    gap: 8px;
  }
  .mod-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
  }
  .mod-card.on {
    border-color: var(--c-mod);
    background: rgba(34, 211, 238, 0.09);
  }
  .mod-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    font-size: 12px;
  }
  .badge-on {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(34, 211, 238, 0.2);
    color: #67e8f9;
    font-weight: 700;
  }
  .badge-off {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.15);
    color: #94a3b8;
  }
  .mini-vis {
    display: flex;
    gap: 2px;
    height: 6px;
    align-items: flex-end;
  }
  .mini-bar {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border-radius: 1px;
  }
  .pad.active .mini-bar { background: var(--pad-color, var(--accent)); }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="brand">
      <h1>43 — Handpan Insights Soundboard</h1>
      <span>57 Playable Elements · Click to Stack/Compose · SOLO for Isolation</span>
    </div>
    <div class="transport">
      <button id="btn-play" class="primary">▶ Play Clock</button>
      <button id="btn-random">🎲 Random Compatible Stack</button>
      <button id="btn-clear" class="danger">✕ Clear Layers</button>
      <div class="pill-group">
        <label for="sel-scale">Scale</label>
        <select id="sel-scale">
          <option value="E_AMARA">E Amara / Kurd (SPRITES)</option>
          <option value="B_KURD">B Kurd / D Maj (Duet)</option>
          <option value="FS_KURD">F# Kurd / A Maj (Malte)</option>
          <option value="D_KURD">D Kurd (Classic)</option>
        </select>
      </div>
      <div class="pill-group">
        <label for="rng-bpm">BPM</label>
        <input id="rng-bpm" type="range" min="72" max="168" value="105" />
        <span id="out-bpm" style="min-width:28px;text-align:right;font-variant-numeric:tabular-nums;">105</span>
      </div>
      <div class="pill-group">
        <label for="rng-vol">Vol</label>
        <input id="rng-vol" type="range" min="0" max="1" step="0.02" value="0.78" />
      </div>
    </div>
  </div>

  <div class="playhead-bar">
    <div class="steps-grid" id="steps-grid"></div>
    <div class="telemetry">
      <span>Chord: <b id="tel-chord">i</b></span>
      <span>Bar: <b id="tel-bar">1</b></span>
      <span>Stereo: <b id="tel-stereo">25%</b></span>
      <span>Arc: <b id="tel-arc">Groove</b></span>
    </div>
  </div>

  <div class="tray-bar">
    <div class="active-chips" id="active-chips">
      <span style="color:var(--muted);font-size:11px;">No layers active — click any pad or preset below.</span>
    </div>
    <div class="arc-controls">
      <span style="color:var(--muted);font-size:11px;">Emotional Arc:</span>
      <button class="arc-btn active" data-arc="normal">Groove Lock</button>
      <button class="arc-btn" data-arc="hook">⚡ Instant Hook</button>
      <button class="arc-btn" data-arc="climax">🔥 Climax (+3dB / +8va)</button>
      <button class="arc-btn" data-arc="breath">🌬 Breath Dip (-35%)</button>
      <button class="arc-btn" data-arc="outro">🌙 Warm Outro</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
(() => {
  // =========================================================================
  // 1. SCALES & PITCH UTILITIES (Empirically matched to 41-social-media-analysis)
  // =========================================================================
  const NOTE_OFFSET = { C:-9,'C#':-8,Db:-8,D:-7,'D#':-6,Eb:-6,E:-5,F:-4,'F#':-3,Gb:-3,G:-2,'G#':-1,Ab:-1,A:0,'A#':1,Bb:1,B:2 };
  function n2f(note, a4 = 440.5) {
    const m = /^([A-G][#b]?)(\d)$/.exec(note);
    if (!m) return 440;
    const semi = NOTE_OFFSET[m[1]] + (parseInt(m[2], 10) - 4) * 12;
    return a4 * Math.pow(2, semi / 12);
  }

  // Each scale provides: ding (low root), bassPool (low roots for progressions),
  // body (mid 250-700Hz), high (700Hz+ singing melody)
  const SCALES = {
    E_AMARA: {
      name: 'E Amara / Kurd (SPRITES)',
      bpm: 105,
      a4: 440.5,
      // Degrees 0..7 in E minor: E, F#, G, A, B, C, D, E
      notes: ['E3','F#3','G3','A3','B3','C4','D4','E4','F#4','G4','A4','B4','C5','D5','E5'],
      lowRoots: { i:'E3', II:'F#3', III:'G3', iv:'A3', v:'B2', VI:'C3', VII:'D3', I:'E3', IV:'A2', V:'B2', vi:'C3' }
    },
    B_KURD: {
      name: 'B Kurd / D Major (Duet)',
      bpm: 105,
      a4: 441.3,
      notes: ['B2','C#3','D3','E3','F#3','G3','A3','B3','C#4','D4','E4','F#4','G4','A4','B4'],
      lowRoots: { i:'B2', II:'C#3', III:'D3', iv:'E3', v:'F#3', VI:'G3', VII:'A3', I:'D3', IV:'G3', V:'A3', vi:'B2' }
    },
    FS_KURD: {
      name: 'F# Kurd / A Major (Malte)',
      bpm: 101,
      a4: 442.0,
      notes: ['F#3','G#3','A3','B3','C#4','D4','E4','F#4','G#4','A4','B4','C#5','D5','E5','F#5'],
      lowRoots: { i:'F#3', II:'G#3', III:'A3', iv:'B2', v:'C#3', VI:'D3', VII:'E3', I:'A3', IV:'D3', V:'E3', vi:'F#3' }
    },
    D_KURD: {
      name: 'D Kurd (Classic)',
      bpm: 104,
      a4: 440.0,
      notes: ['D3','E3','F3','G3','A3','Bb3','C4','D4','E4','F4','G4','A4','Bb4','C5','D5'],
      lowRoots: { i:'D3', II:'E3', III:'F3', iv:'G3', v:'A2', VI:'Bb2', VII:'C3', I:'D3', IV:'G2', V:'A2', vi:'Bb2' }
    }
  };

  // Degree shift offsets for each chord symbol (relative to scale index)
  const CHORD_OFFSET = { i:0, II:1, III:2, iv:3, v:4, VI:5, VII:6, I:2, IV:5, V:6, vi:0 };

  // =========================================================================
  // 2. WEB AUDIO ENGINE (Handpan 1:2:3 Resonator + Percussive + Stereo Hall)
  // =========================================================================
  let ctx = null;
  let masterGain, masterFilter, dryGain, wetGain, convolver, limiter;

  function ensureAudio() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = parseFloat(document.getElementById('rng-vol').value);

    masterFilter = ctx.createBiquadFilter();
    masterFilter.type = 'lowpass';
    masterFilter.frequency.value = 2400;
    masterFilter.Q.value = 0.7;

    limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -8;
    limiter.knee.value = 12;
    limiter.ratio.value = 6;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.12;

    dryGain = ctx.createGain();
    dryGain.gain.value = 0.78;
    wetGain = ctx.createGain();
    wetGain.gain.value = 0.42;

    convolver = ctx.createConvolver();
    convolver.buffer = makeHallIR(ctx, 2.8, 2.4);

    masterFilter.connect(dryGain);
    masterFilter.connect(convolver);
    convolver.connect(wetGain);
    dryGain.connect(limiter);
    wetGain.connect(limiter);
    limiter.connect(masterGain);
    masterGain.connect(ctx.destination);
    applyAudioModifiers();
  }

  function makeHallIR(audioCtx, duration, decay) {
    const len = Math.floor(audioCtx.sampleRate * duration);
    const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const env = Math.pow(1 - t, decay) * (i < 600 ? i / 600 : 1);
        const white = (Math.random() * 2 - 1);
        lp = lp * 0.65 + white * 0.35; // warm reverb tail
        data[i] = lp * env * 0.5;
      }
    }
    return buf;
  }

  // Synthesize a single handpan strike with 1:2:3 harmonic partials + attack click
  function playPanNote(freq, time, opts = {}) {
    if (!ctx) return;
    const {
      vel = 0.7,
      pan = 0,
      sustainMul = 1.0,
      isDing = false,
      isMuted = false,
      isHarmonic = false,
      isClock = false,
      cutoffOverride = null
    } = opts;

    const arcGain = state.arc === 'climax' ? 1.28 : state.arc === 'breath' ? 0.72 : state.arc === 'outro' ? 0.68 : 1.0;
    const finalVel = Math.min(1.15, Math.max(0.05, vel * arcGain));

    // Stereo width scaling (Mono=0, Solo=0.55, Duet=1.0)
    const widthMul = state.mods.stereoMode === 0 ? 0 : state.mods.stereoMode === 1 ? 0.55 : 1.0;
    const panner = ctx.createStereoPanner();
    panner.pan.setValueAtTime(Math.max(-0.95, Math.min(0.95, pan * widthMul)), time);

    const out = ctx.createGain();
    out.gain.setValueAtTime(finalVel * (isDing ? 0.42 : 0.28), time);

    if (cutoffOverride) {
      const f = ctx.createBiquadFilter();
      f.type = cutoffOverride.type || 'lowpass';
      f.frequency.setValueAtTime(cutoffOverride.freq, time);
      out.connect(f);
      f.connect(panner);
    } else {
      out.connect(panner);
    }
    panner.connect(masterFilter);

    const baseSus = (state.mods.lushSustain ? 1.85 : 0.55) * sustainMul * (isDing ? 1.45 : 1.0) * (isMuted ? 0.16 : 1.0);
    const fifthBoost = state.mods.compoundFifth ? 1.0 : 0.22;

    // Partials: [ratio, amp, decayMul]
    let partials;
    if (isClock) {
      // Dd8JlG2ziyn high chime/clock partial profile
      partials = [
        [1.0, 0.7, 0.35],
        [2.76, 0.45, 0.22],
        [5.4, 0.25, 0.12]
      ];
    } else if (isHarmonic) {
      partials = [
        [1.0, 0.25, 0.8],
        [2.0, 0.45, 0.9],
        [3.0, 0.85 * fifthBoost, 1.05] // Compound 5th (+19st)
      ];
    } else if (isDing) {
      partials = [
        [1.0, 1.0, 1.0],
        [2.0, 0.32, 0.72],
        [3.0, 0.38 * fifthBoost, 0.58],
        [1.003, 0.22, 0.9] // warm beating bloom
      ];
    } else {
      partials = [
        [1.0, 0.92, 1.0],
        [2.0, 0.26, 0.68],
        [3.0, 0.44 * fifthBoost, 0.62], // Strong 3rd partial = glassy halo!
        [1.0025, 0.18, 0.85]
      ];
    }

    partials.forEach(([ratio, amp, dMul]) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq * ratio, time);
      const g = ctx.createGain();
      const atk = isMuted ? 0.002 : (isDing ? 0.008 : 0.005);
      const dec = Math.max(0.06, baseSus * dMul);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.linearRampToValueAtTime(amp, time + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, time + atk + dec);
      osc.connect(g);
      g.connect(out);
      osc.start(time);
      osc.stop(time + atk + dec + 0.05);
    });

    // Subtle skin-on-steel transient click (Demucs drums 3.7kHz signature)
    if (!isClock) {
      const clickDur = 0.018;
      const nBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * clickDur), ctx.sampleRate);
      const d = nBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.28));
      const ns = ctx.createBufferSource();
      ns.buffer = nBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(isMuted ? 1900 : 3700, time);
      bp.Q.value = 2.2;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(finalVel * (isMuted ? 0.18 : 0.07), time);
      ns.connect(bp);
      bp.connect(ng);
      ng.connect(panner);
      ns.start(time);
    }
  }

  // Synthesize percussive handpan hits: tak (rim), click (3.8kHz finger), gu (shell bass), knock
  function playPerc(kind, time, vel = 0.6, pan = 0) {
    if (!ctx) return;
    const widthMul = state.mods.stereoMode === 0 ? 0 : state.mods.stereoMode === 1 ? 0.55 : 1.0;
    const panner = ctx.createStereoPanner();
    panner.pan.setValueAtTime(pan * widthMul, time);
    panner.connect(masterFilter);

    if (kind === 'gu') {

      osc.stop(time + 0.25);
      return;

      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (data.length * 0.24));
    }

    src.buffer = buf;

    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(

    );
    bp.Q.value = kind === 'tak' ? 3.5 : kind === 'knock' ? 5.0 : 2.8;

    const g = ctx.createGain();
    g.gain.setValueAtTime(vel * (kind === 'click' ? 0.22 : 0.34), time);

    bp.connect(g);
    g.connect(panner);
    src.start(time);

    const sc = SCALES[state.scaleId];
    const clamped = Math.max(0, Math.min(sc.notes.length - 1, idx));
    return n2f(sc.notes[clamped], sc.a4) * Math.pow(2, octaveShift);

    const sc = SCALES[state.scaleId];

    return n2f(note, sc.a4) * Math.pow(2, octaveShift);
  }

  function chordDegree(relStep = 0, baseOctaveIdx = 0) {
    const off = CHORD_OFFSET[currentChord()] || 0;

  const PAD_MAP = {};

  // =========================================================================
  // 5. LOOKAHEAD SCHEDULER (16th-note + Triplet-8th Dual Clock)
  // =========================================================================
  let timerId = null;
  let next16Time = 0;
  let nextTriTime = 0;
  let lastVisualStep = -1;

  function effectiveBpm() {
    let b = state.bpm;
    if (state.mods.rubatoBreath) {
      b *= (1 + 0.045 * Math.sin(state.bar * 0.75 + state.step * 0.04));
    }
    if (state.arc === 'climax') b *= 1.03;
    if (state.arc === 'outro') b *= 0.94;
    return b;
  }

  function startClock() {
    ensureAudio();
    if (state.playing) return;
    state.playing = true;
    state.step = 0;
    state.tripletTick = 0;
    const now = ctx.currentTime + 0.05;
    next16Time = now;
    nextTriTime = now;
    timerId = setInterval(scheduler, 25);
    updateTransportUI();
  }

  function stopClock() {
    state.playing = false;
    if (timerId) { clearInterval(timerId); timerId = null; }
    updateTransportUI();
  }

  function scheduler() {
    if (!ctx || !state.playing) return;
    const lookahead = 0.12;
    const bpm = effectiveBpm();
    const secPer16 = 60 / bpm / 4;
    const secPerTri = 60 / bpm / 3; // triplet-8th = 1/3 beat (12 per bar)

    while (next16Time < ctx.currentTime + lookahead) {
      const s = state.step;
      const t = next16Time;
      state.activePads.forEach(id => {
        const p = PAD_MAP[id];
        if (p && p.onStep) p.onStep(s, t);
      });
      // Schedule UI playhead highlight
      const delayMs = Math.max(0, (t - ctx.currentTime) * 1000);
      const barSnap = state.bar;
      const chordSnap = currentChord();
      setTimeout(() => highlightStep(s, barSnap, chordSnap), delayMs);

      next16Time += secPer16;
      state.step = (state.step + 1) % 16;
      if (state.step === 0) state.bar++;
    }

    while (nextTriTime < ctx.currentTime + lookahead) {
      const tri = state.tripletTick;
      const t = nextTriTime;
      state.activePads.forEach(id => {
        const p = PAD_MAP[id];
        if (p && p.onTriplet) p.onTriplet(tri, t);
      });
      nextTriTime += secPerTri;
      state.tripletTick = (state.tripletTick + 1) % 12;
    }
  }

  // =========================================================================
  // 6. UI RENDERING & INTERACTIONS

  function buildPlayhead() {
    const grid = document.getElementById('steps-grid');
    const labels = ['1','e','&','a','2','e','&','a','3','e','&','a','4','e','&','a'];
    const colors = ['var(--c-ding)','var(--c-ghost)','var(--c-perc)','var(--c-melody)'];
    grid.innerHTML = '';
    for (let i = 0; i < 16; i++) {
      const cell = document.createElement('div');
      cell.className = 'step-cell' + (i%4===0?' downbeat':'') + (i%4===3?' pickup':'');
      cell.id = 'step-' + i;
      cell.innerHTML = `<div>${labels[i]}</div><div class="step-dots">${
        colors.map((c, idx) => `<span class="sdot" data-dot="${idx}" style="background:${c}"></span>`).join('')
      }</div>`;
      grid.appendChild(cell);
    }
  }

  function highlightStep(s, bar, chord) {
    if (lastVisualStep >= 0) {
      const prev = document.getElementById('step-' + lastVisualStep);
      if (prev) prev.classList.remove('now');
    }
    const cur = document.getElementById('step-' + s);
    if (cur) cur.classList.add('now');
    lastVisualStep = s;
    document.getElementById('tel-bar').textContent = (bar % 16) + 1;
    document.getElementById('tel-chord').textContent = chord;
  }

  function updateStepDots() {
    for (let i = 0; i < 16; i++) {
      const cell = document.getElementById('step-' + i);
      if (!cell) continue;
      const lit = [false, false, false, false];
      state.activePads.forEach(id => {
        const p = PAD_MAP[id];
        if (p && p.pattern && p.pattern[i] > 0.1 && p.bank.dotIdx !== undefined) {
          lit[p.bank.dotIdx] = true;
        }
      });
      cell.querySelectorAll('.sdot').forEach((d, idx) => d.classList.toggle('lit', lit[idx]));
    }
  }

          state.mods.stereoMode = (state.mods.stereoMode + 1) % 3;
        } else {
          state.mods[m.key] = !state.mods[m.key];
        }
        applyAudioModifiers();
        syncUI();

      grid.appendChild(card);

    return sec;

  function togglePad(id) {
    ensureAudio();
    const pad = PAD_MAP[id];
    if (!pad) return;

    if (pad.isProg) {
      state.activeProg = id;
      state.bar = 0;
      syncUI();
      return;
    }

    if (pad.isPreset) {
      loadPreset(pad.preset);
      return;
    }

    if (state.activePads.has(id)) {
      state.activePads.delete(id);
    } else {
      state.activePads.add(id);
      if (!state.playing) startClock();
    }
    syncUI();
  }

  function soloPad(id) {
    ensureAudio();
    const isAlreadySolo = state.activePads.size === 1 && state.activePads.has(id);
    state.activePads.clear();
    if (!isAlreadySolo) {
      state.activePads.add(id);
      if (!state.playing) startClock();
    }
    syncUI();
  }

  function loadPreset(preset) {
    ensureAudio();
    state.scaleId = preset.scale;
    state.bpm = preset.bpm;
    state.activeProg = preset.prog;
    state.mods.stereoMode = preset.stereo;
    state.activePads = new Set(preset.pads);
    state.bar = 0;
    document.getElementById('sel-scale').value = state.scaleId;
    document.getElementById('rng-bpm').value = state.bpm;
    document.getElementById('out-bpm').textContent = state.bpm;
    applyAudioModifiers();
    if (!state.playing) startClock();
    syncUI();
  }

  function randomCompatibleStack() {
    ensureAudio();
    const pick = arr => arr[Math.floor(Math.random() * arr.length)].id;
    state.activePads = new Set([
      pick(BANKS[0].pads), // Ding
      pick(BANKS[1].pads), // Ghost Bed
      pick(BANKS[2].pads), // Perc
      pick(BANKS[3].pads), // Melody
      pick(BANKS[4].pads)  // Chord
    ]);
    state.activeProg = pick(BANKS[5].pads.slice(0, 4));
    if (!state.playing) startClock();
    syncUI();
  }

  function updateTransportUI() {
    const btn = document.getElementById('btn-play');
    btn.textContent = state.playing ? '■ Stop Clock' : '▶ Play Clock';
    btn.classList.toggle('playing', state.playing);
  }

  function syncUI() {
    // Pads
    Object.keys(PAD_MAP).forEach(id => {
      const el = document.getElementById('pad-' + id);
      if (!el) return;
      const p = PAD_MAP[id];
      const on = p.isProg ? (state.activeProg === id) : state.activePads.has(id);
      el.classList.toggle('active', on);
      const sBtn = el.querySelector('[data-solo]');
      if (sBtn) sBtn.classList.toggle('solo-on', state.activePads.size === 1 && state.activePads.has(id));
    });

    // Modifiers
    const stereoLabels = ['Mono 0%', 'Solo 25%', 'Duet 31%'];
    MODIFIERS.forEach(m => {
      const card = document.getElementById('mod-' + m.key);
      if (!card) return;
      const badge = card.querySelector('.mod-badge');
      if (m.isCycle) {
        const mode = state.mods.stereoMode;
        card.classList.toggle('on', mode > 0);
        badge.className = mode > 0 ? 'mod-badge badge-on' : 'mod-badge badge-off';
        badge.textContent = stereoLabels[mode];
      } else {
        const on = !!state.mods[m.key];
        card.classList.toggle('on', on);
        badge.className = on ? 'mod-badge badge-on' : 'mod-badge badge-off';
        badge.textContent = on ? 'ON' : 'OFF';
      }
    });

    document.getElementById('tel-stereo').textContent = stereoLabels[state.mods.stereoMode];

    // Active chips tray
    const tray = document.getElementById('active-chips');
    if (state.activePads.size === 0) {
      tray.innerHTML = `<span style="color:var(--muted);font-size:11px;">No layers active — click any pad or preset (P1–P4) below.</span>`;
    } else {
      tray.innerHTML = Array.from(state.activePads).map(id => {
        const p = PAD_MAP[id];
        return `<span class="chip" style="border-color:${p.bank.color}"><b style="color:${p.bank.color}">${id}</b> ${p.name}<button data-rm="${id}">✕</button></span>`;
      }).join('');
      tray.querySelectorAll('[data-rm]').forEach(b => {
        b.addEventListener('click', () => { state.activePads.delete(b.getAttribute('data-rm')); syncUI(); });
      });
    }

    updateStepDots();
  }

  // Wire header controls
  document.getElementById('btn-play').addEventListener('click', () => state.playing ? stopClock() : startClock());
  document.getElementById('btn-random').addEventListener('click', randomCompatibleStack);
  document.getElementById('btn-clear').addEventListener('click', () => { state.activePads.clear(); syncUI(); });

  document.getElementById('sel-scale').addEventListener('change', (e) => {
    state.scaleId = e.target.value;
    state.bpm = SCALES[state.scaleId].bpm;
    document.getElementById('rng-bpm').value = state.bpm;
    document.getElementById('out-bpm').textContent = state.bpm;
  });
  document.getElementById('rng-bpm').addEventListener('input', (e) => {
    state.bpm = parseInt(e.target.value, 10);
    document.getElementById('out-bpm').textContent = state.bpm;
  });
  document.getElementById('rng-vol').addEventListener('input', (e) => {
    if (masterGain && ctx) masterGain.gain.setTargetAtTime(parseFloat(e.target.value), ctx.currentTime, 0.03);
  });

  document.querySelectorAll('.arc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.arc = btn.getAttribute('data-arc');
      document.querySelectorAll('.arc-btn').forEach(b => b.classList.toggle('active', b === btn));
      document.getElementById('tel-arc').textContent = btn.textContent.replace(/^[^\w]+/, '');
      applyAudioModifiers();
    });
  });

  // Init
  buildPlayhead();
  renderBanks();
  syncUI();
})();
</script>
</body>
</html>
