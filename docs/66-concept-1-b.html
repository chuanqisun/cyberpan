<style>

<header>
  <span class="hint">66 · 1B · SPACE play · press-drag below NOW = pie (direction=type, distance=intensity) · drag knob = move · wheel = intensity · right-click/⌫ = delete · W / drag piston = build · ←/→ flavor · J / click rows = tap</span>

<script>
// ===================== 66 SHARED CORE (audio · clock · theory) =====================
// E Kurd / Amara 9-tone pan, i–VI–VII–i one-bar harmonic cycle (#41), 16-step bars.
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const hash01 = (a, b = 0, c = 0) => {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;

// lane index 0..8 ; KEYS[i] plays lane i (home row)
const NOTES = [['E3', -17], ['B3', -10], ['C4', -9], ['D4', -7], ['E4', -5], ['F#4', -3], ['G4', -2], ['A4', 0], ['B4', 2]]

const KEYS = 'asdfghjkl';
// one chord per bar; pool = lanes that sound "right" in that bar; bassHz = sub root
const PROG = [
  { sym: 'i', pool: [0, 1, 4, 6, 8], bassHz: semiHz(-29) },
  { sym: 'VI', pool: [2, 4, 6, 8, 1], bassHz: semiHz(-33) },
  { sym: 'VII', pool: [3, 5, 7, 8, 1], bassHz: semiHz(-31) },
  { sym: 'i', pool: [0, 1, 4, 6, 5], bassHz: semiHz(-29) },

// #41 metric weight per 16th: strong downbeats, strong "a" pickups (3,7,11,15), weak "e"

// ----------------------------- AUDIO -----------------------------
const Audio = (() => {
  let ctx = null, master, bus, hpf, lpf, dry, revSend, revOut, noise, riserBP, riserG, ui;

  return {
    ensure, get ctx() { return ctx; }, now: () => (ctx ? ctx.currentTime : 0),
    // handpan strike: lane 0..8, vel 0..1, durSteps controls ring length, octave shifts up 1 octave
    pan(lane, when, vel = .8, durSteps = 4, octave = 0) {
      ensure(); const n = NOTES[lane]; if (!n) return; const t = T(when), v = clamp(vel, .05, 1), f = n.freq * (octave ? 2 : 1);
      const tau = clamp(.25 + durSteps * .22, .3, 2.4) * (lane === 0 ? 1.2 : 1);
      const out = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = n.pan; out.connect(p); p.connect(bus);
      const g = env(t, .004, .26 * v, tau); g.connect(out); osc('sine', f, t, tau, g); osc('sine', f + .7, t, tau, g);
      const h2 = env(t, .02, .12 * v, tau * .6); h2.connect(out); osc('sine', f * 2.001, t, tau * .6, h2);
      const h3 = env(t, .03, .07 * v, tau * .45); h3.connect(out); osc('sine', f * 2.998, t, tau * .45, h3);

    kick(when, v = .8) { ensure(); const t = T(when), g = env(t, .003, .7 * v, .3); g.connect(bus); const o = osc('sine', 130, t, .32, g); o.frequency.exponentialRampToValueAtTime(42, t + .12); },
    hat(when, v = .4, open = false) { ensure(); noiseHit(T(when), 'highpass', open ? 6000 : 7500, .8, .12 * v, open ? .16 : .035); },
    tak(when, v = .6) { ensure(); const t = T(when); noiseHit(t, 'bandpass', 2400, 1.6, .26 * v, .07); const g = env(t, .002, .15 * v, .06); g.connect(bus); osc('triangle', 300, t, .06, g); },
    sub(when, hz, durSec, v = .45) { ensure(); const t = T(when), g = env(t, .015, v, Math.max(.1, durSec)), lp = filt('lowpass', 220, 1); lp.connect(g); g.connect(bus); osc('sine', hz, t, durSec, lp); osc('triangle', hz * 2, t, durSec, lp); },
    impact(when, v = 1) { ensure(); const t = T(when), g = env(t, .004, .8 * v, 1.4); g.connect(master); const o = osc('sine', 120, t, 1.4, g); o.frequency.exponentialRampToValueAtTime(41, t + .1); noiseHit(t, 'lowpass', 3000, .7, .3 * v, 1.6, master); },
    // UI detent click (haptic-ish); pitch 0.5..2
    click(pitch = 1, strong = false) { if (!ctx) return; noiseHit(ctx.currentTime + .001, 'bandpass', 2200 * pitch, 5, strong ? .25 : .12, strong ? .025 : .012, ui); },
    // continuous macro controls (0..1), smoothed
    setRiser(x) { if (!ctx) return; const t = ctx.currentTime; riserG.gain.setTargetAtTime(Math.max(.0001, Math.pow(x, 1.5) * .22), t, .04); riserBP.frequency.setTargetAtTime(300 + x * 4500, t, .04); },
    setHPF(x) { if (!ctx) return; hpf.frequency.setTargetAtTime(20 * Math.pow(70, clamp(x, 0, 1)), ctx.currentTime, .03); hpf.Q.value = .7 + x * 3; },
    setLPF(x) { if (!ctx) return; lpf.frequency.setTargetAtTime(18000 * Math.pow(400 / 18000, clamp(x, 0, 1)), ctx.currentTime, .03); },
    setReverb(x) { if (!ctx) return; revSend.gain.setTargetAtTime(.25 + x * .6, ctx.currentTime, .05); },
    // freeze: dry bus muted, reverb tail hangs
    setFreeze(on) { if (!ctx) return; const t = ctx.currentTime; dry.gain.setTargetAtTime(on ? .0001 : 1, t, on ? .01 : .005); revSend.gain.setTargetAtTime(on ? .0001 : .25, t, .01); revOut.gain.setTargetAtTime(on ? .7 : .5, t, .05); },
  };
})();

// ----------------------------- CLOCK -----------------------------
// Sample-accurate 16th-step scheduler. Clock.onStep(fn(step, when)) is called ~120ms ahead.
// Clock.pos() = fractional current step (for drawing). Clock.later(when, fn) runs fn when audio time arrives.
const Clock = (() => {
  const subs = []; let bpm = 105, playing = false, anchorStep = 0, anchorTime = 0, next = 0, timer = null, pausedAt = 0;
  const stepDur = () => 60 / bpm / 4;

    const ctx = Audio.ctx; if (!playing || !ctx) return;
    const horizon = ctx.currentTime + .12;
    while (anchorTime + (next - anchorStep) * stepDur() < horizon) { const when = anchorTime + (next - anchorStep) * stepDur(); for (const f of subs) f(next, when); next++; }
  }
  return {
    get playing() { return playing; }, get bpm() { return bpm; }, stepDur,
    setBpm(b) { const p = this.pos(); bpm = b; if (playing) { anchorStep = p; anchorTime = Audio.now(); } },
    onStep(f) { subs.push(f); },
    pos() { if (!playing || !Audio.ctx) return pausedAt; return anchorStep + Math.max(0, (Audio.now() - anchorTime) / stepDur()); },
    timeOf(step) { return anchorTime + (step - anchorStep) * stepDur(); },
    start() { Audio.ensure(); if (playing) return; playing = true; anchorStep = pausedAt; anchorTime = Audio.now() + .05; next = Math.ceil(anchorStep); timer = setInterval(tick, 25); tick(); },
    stop() { if (!playing) return; pausedAt = this.pos(); playing = false; clearInterval(timer); },
    toggle() { playing ? this.stop() : this.start(); },
    later(when, fn) { setTimeout(fn, Math.max(0, (when - Audio.now()) * 1000)); },

// ----------------------------- CANVAS HELPERS -----------------------------
function setupCanvas(canvas, onResize) {
  const ctx = canvas.getContext('2d');
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1), r = canvas.getBoundingClientRect(); canvas.width = r.width * d; canvas.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); onResize && onResize(r.width, r.height); };
  addEventListener('resize', fit); fit(); return ctx;
}
const ink = (a) => `rgba(255,255,255,${clamp(a, 0, 1).toFixed(3)})`;
const HOT = '#ff5a1f';
const hot = (a) => `rgba(255,90,31,${clamp(a, 0, 1).toFixed(3)})`;
// ===================== END CORE =====================

/* 66 · Concept 1 · Realtime DJ HUD — variation 1B: VERTICAL WATERFALL.
   Same cue engine as 1A/1C. The NOW line is horizontal at 55% height; the future rises from the bottom,
   the past drifts upward. Energy is a vertical profile on the left (x = energy), cues are knobs on a center
   rail, upcoming notes on the right. When NOW reaches a cue its control appears IN PLACE on the now line:
   DROP = #30-style piston rising from the now line (flavor picked by sliding sideways at the top),
   RHYTHM = 3 pattern rows straddling the now line, macros = one handle on the now line.
   Lineage: #30 drop conductor piston + waterfall, #49 drop flavors, #52 archetype snapping, #62 pie.
   Judge: does controlling right where the music "arrives" beat a separate control panel? */
// ==================== CONCEPT-1 ENGINE (identical in 1A / 1B / 1C; only the UI differs) ====================
Clock.setBpm(120);
const BAR = 16, POST = 64, LOOK = 128;                       // POST = climax steps after a drop
const TYPES = ['RHYTHM', 'DROP', 'LIFT', 'SWEEP', 'KILL', 'BREAK'];
const SHORT = { RHYTHM: 'RHY', DROP: 'DROP', LIFT: 'LIFT', SWEEP: 'SWP', KILL: 'KILL', BREAK: 'BRK' };
const FLAV = ['HALF', 'FULL', 'FAKE'];
// candidate percussion patterns, ordered sparse -> driving (intensity preselects)
const RHY = [
  { name: 'TRESILLO', kick: [0, 6, 12], tak: [3, 9], e: 0 },
  { name: 'BROKEN', kick: [0, 3, 10], tak: [4, 12], e: .04 },
  { name: 'FOUR', kick: [0, 4, 8, 12], tak: [], e: .09 },
];
const S = { cues: [], nextId: 1, rhythm0: 0, hist: [], played: [], pos: 0, holding: false, hover: null, tapT: -1e9, lastTap: -1 };

const snap4 = (s) => Math.round(s / 4) * 4;
const minFuture = () => Math.ceil((S.pos + 2) / 4) * 4;
function addCue(type, step, intensity) {
  const c = { id: S.nextId++, type, step: Math.max(snap4(step), minFuture()), len: type === 'DROP' ? 64 : 32, intensity: clamp(intensity, .05, 1),
    done: false, phase: 'wait', taps: [], locked: null, charge: 0, flavor: 'FULL', manual: false, dropAt: null, freezeAt: null, power: 1, buildStart: 0 };
  S.cues.push(c); S.cues.sort((a, b) => a.step - b.step); return c;
}
const started = (c) => c.phase !== 'wait' || c.step <= S.pos + 1.5;
function moveCue(c, step) { if (started(c)) return; c.step = Math.max(snap4(step), minFuture()); S.cues.sort((a, b) => a.step - b.step); }
function removeCue(c) {
  if (!c) return; if (c.type === 'DROP' && c.phase === 'freeze') Audio.setFreeze(false);
  S.cues = S.cues.filter(x => x !== c); if (S.hover === c) S.hover = null;
}
const setIntensity = (c, v) => { c.intensity = clamp(v, .05, 1); };

// ---------- rhythm candidates: circular snap distance between taps and kick onsets ----------
const cdist = (a, b) => { const d = Math.abs(mod(a - b, BAR)); return Math.min(d, BAR - d); };

  if (!taps.length) return [1 / 3, 1 / 3, 1 / 3];
  const raw = RHY.map(r => {
    let a = 0, b = 0;
    for (const t of taps) a += Math.min(...r.kick.map(o => cdist(t, o)));

}

const preselect = (i) => Math.min(2, Math.floor(i * 3));

function rhythmAt(s, skipId) {
  let r = S.rhythm0;
  for (const c of S.cues) if (c.type === 'RHYTHM' && c.id !== skipId && c.step <= s) r = leadOf(c);
  return r;
}

// ---------- DROP timing (predicted while not yet decided) ----------
function dropTimes(c) {
  if (c.dropAt != null) return { fr: c.freezeAt ?? c.dropAt, dr: c.dropAt };
  if (!c.manual) return { fr: c.freezeAt ?? c.step + c.len - 8, dr: c.step + c.len };
  const nb = Math.ceil((S.pos + 1.5) / 4) * 4;
  if (c.freezeAt != null) return { fr: c.freezeAt, dr: Math.max(c.freezeAt + 4, nb) };

}

// ---------- ENERGY model: base groove + every cue's characteristic shape ----------
function dropE(c, s, base) {
  if (s < c.step) return null;

    return base + .42 * (.4 + .6 * i) * clamp(p, 0, 1);

}

  const m = { LIFT: 0, SWEEP: 0, KILL: 0, BREAK: 0 };
  for (const c of S.cues) {
    if (c.id === skipId || !(c.type in m)) continue;

    const p = rel / c.len, shape = c.type === 'LIFT' ? p : c.type === 'SWEEP' ? 1 - Math.abs(2 * p - 1) : 1;

  e += .4 * m.LIFT - .32 * m.SWEEP - .3 * m.KILL;

// ---------- groove: deterministic per 8-bar phrase, density follows energy ----------
function noteAt(s, E) {
  const bar = Math.floor(s / BAR), i = mod(s, BAR), ch = chordAt(bar), ph = mod(bar, 8);
  if (!(i === 0 || hash01(ph, i, 11) < METRIC[i] * (.3 + .55 * E))) return null;
  const lane = i === 0 ? ch.pool[0] : ch.pool[Math.floor(hash01(ph, i, 3) * ch.pool.length)];
  const acc = i === 0 || (METRIC[i] >= .75 ? hash01(ph, i, 5) > .3 : hash01(ph, i, 5) > .85);
  return { lane, vel: acc ? .55 + .35 * E : .3, acc };

// ---------- DROP state machine (runs in the scheduler) ----------
function fireDrop(c, s, when) {

}

  if (c.phase === 'build') {

    if (c.dropAt != null && s >= c.dropAt) return fireDrop(c, s, when);

Clock.onStep((s, when) => {
  const sd = Clock.stepDur(), i = mod(s, BAR), ch = chordAt(Math.floor(s / BAR));
  for (const c of S.cues) {
    if (c.done || c.type === 'DROP' || s < c.step) continue;
    if (c.phase === 'wait') c.phase = 'live';
    if (s >= c.step + c.len) { if (c.type === 'RHYTHM' && c.locked == null) c.locked = leadOf(c); c.done = true; c.phase = 'done'; }
  }

    if ((k === 0 && fl !== 'FAKE') || (k === 16 && fl === 'FAKE')) { Audio.impact(when, pw); Audio.sub(when, ch.bassHz, sd * 14, .6 * pw); }
    if (fake) { if (k === 0) Audio.kick(when, .5); if (kb === 8) Audio.tak(when, .35); n = n && n.acc && i % 8 === 0 ? { ...n, vel: .3 } : null; }
    else if (half) {

      if (kb === 8) Audio.tak(when, .8); if (kb % 4 === 2) Audio.hat(when, .25);
    } else {
      if (kb % 4 === 0) Audio.kick(when, .95 * pw); if (kb % 4 === 2) Audio.hat(when, .5, true); else if (kb % 2) Audio.hat(when, .2);
      if (kb % 8 === 0 && k) Audio.sub(when, ch.bassHz, sd * 7, .5);
    }
  } else if (!strip) {
    const rc = S.cues.find(c => c.type === 'RHYTHM' && c.phase === 'live');
    if (low && pat.kick.includes(i)) Audio.kick(when, rc ? .55 : .85);
    if (pat.tak.includes(i)) Audio.tak(when, .45);
    if (E > .3 && i % 4 === 2) Audio.hat(when, .3);
    if ((E > .6 || m.LIFT > .4) && i % 2 === 1) Audio.hat(when, .12 + .2 * m.LIFT);
    if (low && i === 0) Audio.sub(when, ch.bassHz, sd * 15, .38);
    if (low && i === 8 && E > .6) Audio.sub(when, ch.bassHz, sd * 7, .3);
  }
  if (n) {
    Audio.pan(n.lane, when, n.vel * (strip ? .8 : 1), n.acc ? 6 : 3);
    if (E > .85 && n.acc && hash01(s, 9) > .5) Audio.pan(n.lane, when, n.vel * .5, 4, 1);
    S.played.push({ s, lane: n.lane, vel: n.vel }); if (S.played.length > 300) S.played.shift();
  }
});

// ---------- live control (shared input semantics) ----------
const liveDrop = () => S.cues.find(c => c.type === 'DROP' && (c.phase === 'build' || c.phase === 'freeze'));
const liveRhythm = () => S.cues.find(c => c.type === 'RHYTHM' && c.phase === 'live');
// the cue whose live control is shown now: pre-drop DROP > RHYTHM > macro > DROP climax
function liveCue() {
  return liveDrop() || liveRhythm() || S.cues.find(c => c.phase === 'live') || S.cues.find(c => c.type === 'DROP' && c.phase === 'post') || null;
}
function holdBuild(on) {
  const d = liveDrop();
  if (on) { if (d) { S.holding = true; d.manual = true; } return; }
  if (S.holding) { S.holding = false; releaseBuild(); }
}
function dragCharge(v) { const d = liveDrop(); if (!d) return; d.manual = true; if (d.phase === 'build') d.charge = clamp(v, 0, 1); }
function releaseBuild() {
  const d = liveDrop(); if (!d || !d.manual || d.dropAt != null) return;
  d.dropAt = Math.ceil((S.pos + 1.5) / 4) * 4;                  // quantized to the next beat
  if (d.phase === 'build') { d.freezeAt = d.dropAt; d.power = Math.max(.3, d.charge); }
}
function setFlavor(f) {
  const d = liveDrop() || S.cues.find(c => c.type === 'DROP' && c.phase === 'wait');
  if (d && FLAV.includes(f)) { if (d.flavor !== f) Audio.click(1.2); d.flavor = f; }
}
const cycleFlavor = (dir) => { const d = liveDrop() || S.cues.find(c => c.type === 'DROP' && c.phase === 'wait'); if (d) setFlavor(FLAV[clamp(FLAV.indexOf(d.flavor) + dir, 0, 2)]); };
function tap() {
  Audio.ensure(); Audio.tak(0, .75); S.tapT = performance.now();
  const c = liveRhythm(); if (!c || c.locked != null) return;
  c.taps.push(mod(S.pos, BAR));
  if (c.taps.length >= 4) { c.locked = argmax(rhyConf(c.taps)); Audio.click(1.6, true); }
}
function togglePlay() {
  Audio.ensure(); Clock.toggle();
  const b = document.getElementById('play'); b.textContent = Clock.playing ? 'STOP' : 'PLAY'; b.classList.toggle('on', Clock.playing);
}
// per-frame: charge integration + continuous macro audio (filters follow what is audible now)
let lastFrame = performance.now();
function engineFrame() {
  const t = performance.now(), dt = Math.min(.1, (t - lastFrame) / 1000); lastFrame = t;
  S.pos = Clock.pos();
  const d = liveDrop();
  if (S.holding && d && d.phase === 'build') d.charge = Math.min(1, d.charge + dt / 4);
  if (!Audio.ctx) return;
  const m = macroAt(Math.floor(S.pos));
  const pre = S.cues.find(c => c.type === 'DROP' && c.phase !== 'wait' && !c.done && S.pos >= c.step && (c.dropAt == null || S.pos < c.dropAt));
  const frozen = pre && pre.freezeAt != null && S.pos >= pre.freezeAt;
  const q = pre && Clock.playing ? pre.charge : 0;
  Audio.setRiser(frozen ? 0 : q);
  Audio.setHPF(Math.max(frozen ? 0 : q * .75, m.KILL * .3));
  Audio.setLPF(clamp(.32 * (1 - m.LIFT) + .55 * m.SWEEP + .3 * m.BREAK, 0, 1));
  if (!frozen) Audio.setReverb(m.BREAK);
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) togglePlay(); }
  else if (e.code === 'KeyW' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) { Audio.ensure(); holdBuild(true); } }
  else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { e.preventDefault(); cycleFlavor(e.code === 'ArrowLeft' ? -1 : 1); }
  else if (e.code === 'KeyJ') { if (!e.repeat) tap(); }
  else if (e.code === 'Backspace' || e.code === 'Delete') { e.preventDefault(); removeCue(S.hover); }
});
addEventListener('keyup', (e) => { if (e.code === 'KeyW' || e.code === 'ArrowUp') holdBuild(false); });

// ---------- pie menu (placement): direction = type, distance = intensity ----------
const PIE_R = 92, PIE_DEAD = 14;
function pieFrom(dx, dy) {
  const d = Math.hypot(dx, dy); if (d < PIE_DEAD) return null;
  const a = mod(Math.atan2(dy, dx) + Math.PI / 2 + Math.PI / 6, Math.PI * 2);
  return { type: TYPES[Math.floor(a / (Math.PI / 3)) % 6], intensity: clamp((d - PIE_DEAD) / (PIE_R - PIE_DEAD), .05, 1) };
}
function drawPie(g, x, y, dx, dy) {
  const sel = pieFrom(dx, dy);
  g.save(); g.lineWidth = 1; g.fillStyle = 'rgba(0,0,0,.75)';
  g.beginPath(); g.arc(x, y, PIE_R, 0, Math.PI * 2); g.fill();
  g.strokeStyle = ink(.25); g.stroke();
  g.beginPath(); g.arc(x, y, PIE_DEAD, 0, Math.PI * 2); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  TYPES.forEach((t, k) => {
    const a0 = -Math.PI / 2 - Math.PI / 6 + k * Math.PI / 3, am = a0 + Math.PI / 6, on = sel && sel.type === t;
    g.strokeStyle = ink(.12); g.beginPath(); g.moveTo(x + Math.cos(a0) * PIE_DEAD, y + Math.sin(a0) * PIE_DEAD); g.lineTo(x + Math.cos(a0) * PIE_R, y + Math.sin(a0) * PIE_R); g.stroke();
    if (on) { g.fillStyle = hot(.18); g.beginPath(); g.moveTo(x, y); g.arc(x, y, PIE_R, a0, a0 + Math.PI / 3); g.closePath(); g.fill(); }
    g.fillStyle = on ? HOT : ink(.55); g.fillText(SHORT[t], x + Math.cos(am) * PIE_R * .72, y + Math.sin(am) * PIE_R * .72);
  });
  if (sel) {
    const ex = x + dx, ey = y + dy, a = Math.atan2(dy, dx);
    g.strokeStyle = HOT; g.fillStyle = HOT; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(ex, ey); g.stroke();
    g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex - 9 * Math.cos(a - .4), ey - 9 * Math.sin(a - .4)); g.lineTo(ex - 9 * Math.cos(a + .4), ey - 9 * Math.sin(a + .4)); g.fill();
    g.fillText(`${sel.type} ${Math.round(sel.intensity * 100)}%`, x, y + PIE_R + 12);
  }
  g.restore();
}
// a demo plan so the track plays itself on first PLAY
function demoPlan() {
  addCue('RHYTHM', 16, .9); addCue('LIFT', 64, .7); addCue('DROP', 112, .9);
  addCue('KILL', 272, .7); addCue('SWEEP', 336, .8); addCue('RHYTHM', 400, .2); addCue('BREAK', 464, .8); addCue('DROP', 512, 1);
  S.cues.find(c => c.step === 512).flavor = 'FAKE';
}
// ==================== END CONCEPT-1 ENGINE ====================


// ==================== 1B UI ====================
const cv = document.getElementById('c');
let W = 0, H = 0, NY = 0, K = 1, RX = 0, EL = 30, EW = 100, NX = 0, PU = 150;
const g = setupCanvas(cv, (w, h) => {
  W = w; H = h; NY = H * .55; K = (H - NY - 8) / 96; RX = W * .5;
  EL = 40; EW = Math.min(220, W * .2); NX = W * .66; PU = Math.min(200, NY - 90);
});
document.getElementById('play').onclick = (e) => { e.target.blur(); togglePlay(); };
const Y = (s) => NY + (s - S.pos) * K;
const stepAt = (y) => S.pos + (y - NY) / K;
const EX = (e) => EL + e * EW;
const laneX = (l) => NX + (l + .5) * (W - NX - 20) / 9;
const rollDiv = (q) => q < .25 ? '1/4' : q < .5 ? '1/8' : q < .75 ? '1/16' : '1/32';
const RW = () => Math.min(360, W * .36);                 // rhythm rows width
const rowY = (k) => NY + (k - 1) * 34;                   // rows straddle the now line
const flavX = (k) => RX + (k - 1) * 90;

function hitCue(x, y) {
  if (Math.abs(x - RX) > 16) return null;
  let best = null, bd = 12;
  for (const c of S.cues) { const d = Math.abs(Y(c.step) - y); if (d < bd) { bd = d; best = c; } }
  return best;
}
// which in-place control (if any) is under the pointer
function liveZone(x, y) {
  const c = liveCue(); if (!c) return null;
  if (c.type === 'DROP' && c.phase !== 'post' && Math.abs(x - RX) < 140 && y > NY - PU - 50 && y < NY + 14) return 'piston';
  if (c.type === 'RHYTHM' && Math.abs(x - RX) < RW() / 2 + 90 && Math.abs(y - NY) < 52) return 'rows';
  if (['LIFT', 'SWEEP', 'KILL', 'BREAK'].includes(c.type) && x > RX + 24 && x < RX + 260 && Math.abs(y - NY) < 16) return 'handle';
  return null;
}

// ---------- pointer ----------
let drag = null;
const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function zoneMove(x, y) {
  if (drag.mode === 'piston') {
    dragCharge((NY - y) / PU);
    if (y < NY - PU * .6) setFlavor(FLAV[x < RX - 45 ? 0 : x > RX + 45 ? 2 : 1]);
  } else if (drag.mode === 'handle') setIntensity(liveCue(), (x - RX - 30) / 220);
}
cv.addEventListener('pointerdown', (e) => {
  Audio.ensure(); const [x, y] = pt(e); cv.setPointerCapture(e.pointerId);
  const c = hitCue(x, y);
  if (c && e.button === 2) { removeCue(c); return; }
  const z = liveZone(x, y);
  if (z === 'rows') { tap(); return; }
  if (z) { drag = { mode: z }; zoneMove(x, y); return; }
  if (c) { drag = { mode: 'move', cue: c, off: Y(c.step) - y }; return; }
  if (y > NY + 16 && e.button === 0) drag = { mode: 'pie', x0: x, y0: y, x, y };
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = pt(e);
  if (!drag) { S.hover = hitCue(x, y); cv.style.cursor = S.hover ? 'ns-resize' : liveZone(x, y) ? 'pointer' : 'default'; return; }
  if (drag.mode === 'move') moveCue(drag.cue, stepAt(y + drag.off));
  else if (drag.mode === 'pie') { drag.x = x; drag.y = y; }
  else zoneMove(x, y);
});
cv.addEventListener('pointerup', () => {
  if (drag && drag.mode === 'pie') { const sel = pieFrom(drag.x - drag.x0, drag.y - drag.y0); if (sel) { addCue(sel.type, stepAt(drag.y0), sel.intensity); Audio.click(1, true); } }
  if (drag && drag.mode === 'piston') releaseBuild();
  drag = null;
});
cv.addEventListener('contextmenu', (e) => { e.preventDefault(); if (S.hover) removeCue(S.hover); });
cv.addEventListener('wheel', (e) => { if (!S.hover) return; e.preventDefault(); setIntensity(S.hover, S.hover.intensity - e.deltaY * .0015); }, { passive: false });

// ---------- drawing ----------
function frame() {
  engineFrame();
  const pos = S.pos, s0 = Math.floor(stepAt(30)), s1 = Math.ceil(stepAt(H)), f0 = Math.ceil(pos);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.font = '11px ui-monospace, Menlo, monospace'; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const live = liveCue();
  // grid
  for (let b = Math.floor(s0 / BAR); b * BAR <= s1; b++) {
    const y = Y(b * BAR); if (y < 40 || b < 0) continue;
    g.fillStyle = ink(b % 4 === 0 ? .18 : .06); g.fillRect(0, y, W, 1);
    g.fillStyle = ink(.35); g.fillText(`${b + 1} ${chordAt(b).sym}`, 4, y - 3);
  }
  // cue regions (band across energy + rail)
  for (const c of S.cues) {
    const y0 = Y(c.step), y1 = Y(cueEnd(c)), on = c === live || c === S.hover;
    g.fillStyle = on ? hot(.08) : ink(c.done ? .02 : .04); g.fillRect(EL, y0, RX + 20 - EL, y1 - y0);
    if (c.type === 'DROP') { g.fillStyle = ink(.02); g.fillRect(EL, y1, EW, POST * K); }
  }
  // energy profile: axis, past (filled), future (line)
  g.fillStyle = ink(.12); g.fillRect(EL, 30, 1, H - 30); g.fillRect(EX(1), 30, 1, H - 30);
  g.fillStyle = ink(.4); g.fillText('ENERGY →', EL + 2, NY + 14);
  g.beginPath(); g.moveTo(EL, Y(Math.max(0, s0)));
  for (let s = Math.max(0, s0); s < f0; s++) g.lineTo(EX(S.hist[s] ?? 0), Y(s));
  g.lineTo(EL, Y(f0 - 1)); g.fillStyle = ink(.18); g.fill();
  const pred = []; for (let s = f0; s <= s1; s++) pred.push(energyAt(s));
  g.beginPath(); pred.forEach((e, k) => g.lineTo(EX(e), Y(f0 + k))); g.strokeStyle = ink(.8); g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1;
  if (S.hover) {
    const c = S.hover, a = Math.max(f0, c.step - 8), b = Math.min(s1, cueEnd(c) + (c.type === 'DROP' ? POST : 16));
    g.beginPath(); for (let s = a; s <= b; s++) g.lineTo(EX(energyAt(s)), Y(s)); for (let s = b; s >= a; s--) g.lineTo(EX(energyAt(s, c.id)), Y(s));
    g.fillStyle = hot(.25); g.fill();
    g.setLineDash([3, 3]); g.beginPath(); for (let s = a; s <= b; s++) g.lineTo(EX(energyAt(s, c.id)), Y(s)); g.strokeStyle = ink(.5); g.stroke(); g.setLineDash([]);
    g.fillStyle = HOT; g.fillText(`${c.type} ${Math.round(c.intensity * 100)}% · dashed = without`, RX + 24, Y(c.step) + 4);
  }
  // notes: future faint, past brighter
  pred.forEach((e, k) => { const n = noteAt(f0 + k, e); if (n) { g.fillStyle = ink(.08 + .25 * n.vel); g.fillRect(laneX(n.lane) - 6, Y(f0 + k), 12, Math.max(2, K * .7)); } });
  for (const p of S.played) { const y = Y(p.s); if (y > 30 && p.s < f0) { g.fillStyle = ink(.2 + .5 * p.vel); g.fillRect(laneX(p.lane) - 6, y, 12, Math.max(2, K * .7)); } }
  g.textAlign = 'center'; g.fillStyle = ink(.3); for (let l = 0; l < 9; l++) g.fillText(NOTES[l].name, laneX(l), H - 4);
  // rail + cue knobs
  g.fillStyle = ink(.12); g.fillRect(RX, 30, 1, H - 30);
  for (const c of S.cues) {
    const y = Y(c.step); if (y < 20 || y > H + 20) continue;
    const on = c === live, hv = c === S.hover, al = c.done ? .3 : 1;
    g.fillStyle = ink(.3 * al); g.fillRect(RX - 1, y, 3, Math.max(0, Y(cueEnd(c)) - y));
    g.fillStyle = '#000'; g.beginPath(); g.arc(RX, y, 10, 0, Math.PI * 2); g.fill();
    g.strokeStyle = ink((hv ? .9 : .45) * al); g.stroke();
    g.strokeStyle = on || hv ? HOT : ink(.85 * al); g.lineWidth = 3;
    g.beginPath(); g.arc(RX, y, 14, -Math.PI / 2, -Math.PI / 2 + c.intensity * Math.PI * 2); g.stroke(); g.lineWidth = 1;
    const sub = c.type === 'DROP' ? c.flavor : c.type === 'RHYTHM' ? RHY[leadOf(c)].name : '';
    g.textAlign = 'right'; g.fillStyle = on ? HOT : ink(.8 * al); g.fillText(`${SHORT[c.type]} ${sub}`, RX - 20, y + 4);
  }
  // now line
  g.fillStyle = ink(.7); g.fillRect(0, NY, W, 1);
  g.textAlign = 'left'; g.fillText('NOW', W - 34, NY - 4);
  g.fillText(`${Math.round(energyAt(Math.floor(pos)) * 100)}%`, EX(energyAt(Math.floor(pos))) + 6, NY - 4);
  if (live) drawLive(live);
  if (drag && drag.mode === 'pie') drawPie(g, drag.x0, drag.y0, drag.x - drag.x0, drag.y - drag.y0);
  requestAnimationFrame(frame);
}

function drawLive(c) {
  g.textAlign = 'left';
  if (c.type === 'RHYTHM') return liveRhythmRows(c);
  if (c.type === 'DROP') return livePiston(c);
  // macro: one handle on the now line
  const x0 = RX + 30, w = 220, hx = x0 + c.intensity * w;
  g.fillStyle = ink(.25); g.fillRect(x0, NY - 1, w, 3);
  g.fillStyle = HOT; g.fillRect(hx - 4, NY - 12, 8, 24);
  g.fillText(`${c.type} ${Math.round(c.intensity * 100)}% · drag to override`, x0, NY - 18);
}

function liveRhythmRows(c) {
  const conf = c.taps.length ? rhyConf(c.taps) : RHY.map((_, k) => k === preselect(c.intensity) ? .6 : .2);
  const lead = leadOf(c), w = RW(), x0 = RX - w / 2, cw = w / 16, ph = mod(S.pos, BAR), fl = performance.now() - S.tapT < 120;
  g.fillStyle = fl ? hot(.25) : '#000'; g.fillRect(x0 - 96, NY - 52, w + 104, 104);
  g.strokeStyle = fl ? HOT : ink(.25); g.strokeRect(x0 - 95.5, NY - 51.5, w + 103, 103);
  RHY.forEach((r, k) => {
    const y = rowY(k), isLead = k === lead, a = c.locked != null ? (isLead ? 1 : .15) : .2 + .8 * conf[k];
    g.fillStyle = isLead ? HOT : ink(a); g.fillText(`${r.name.slice(0, 5)} ${Math.round(conf[k] * 100)}%`, x0 - 90, y + 4);
    for (let i = 0; i < BAR; i++) {
      const kick = r.kick.includes(i), tk = r.tak.includes(i);
      g.fillStyle = kick ? (isLead ? hot(a) : ink(a)) : tk ? ink(a * .4) : ink(.06);
      const hh = kick ? 20 : tk ? 10 : 3; g.fillRect(x0 + i * cw + 1, y - hh / 2, cw - 2, hh);
    }
  });
  for (const t of c.taps) { g.fillStyle = HOT; g.fillRect(x0 + t * cw, NY - 50, 2, 100); }
  g.fillStyle = ink(.8); g.fillRect(x0 + ph * cw, NY - 50, 1, 100);
  g.fillStyle = c.locked != null ? HOT : ink(.6);
  g.fillText(c.locked != null ? `LOCKED → ${RHY[c.locked].name}` : `RHYTHM · ${c.taps.length}/4 taps · J or click here`, x0 - 90, NY - 58);
}

function livePiston(c) {
  const q = c.phase === 'post' ? 0 : c.charge, top = NY - PU, hy = NY - q * PU, act = S.holding || (drag && drag.mode === 'piston');
  g.fillStyle = '#000'; g.fillRect(RX - 140, top - 50, 280, PU + 62);
  // rail ticks for the roll divisions
  [[.25, '1/8'], [.5, '1/16'], [.75, '1/32']].forEach(([t, l]) => { g.fillStyle = ink(.3); g.fillRect(RX - 10, NY - t * PU, 20, 1); g.textAlign = 'left'; g.fillText(l, RX + 14, NY - t * PU + 4); });
  g.strokeStyle = ink(.35); g.strokeRect(RX - 14.5, top + .5, 29, PU);
  g.fillStyle = c.phase === 'freeze' ? HOT : ink(.08); g.fillRect(RX - 14, top + 1, 28, 12);
  g.fillStyle = act ? hot(.55) : ink(.3); g.fillRect(RX - 14, hy, 28, NY - hy);
  g.fillStyle = ink(.95); g.fillRect(RX - 22, hy - 1, 44, 3);
  // flavor targets across the top: slide sideways while up there
  FLAV.forEach((f, k) => {
    const on = c.flavor === f, x = flavX(k);
    g.textAlign = 'center'; g.strokeStyle = on ? HOT : ink(.2); g.strokeRect(x - 36.5, top - 42.5, 73, 22);
    g.fillStyle = on ? HOT : ink(.5); g.fillText(f, x, top - 28);
  });
  let st;
  if (c.phase === 'build') st = `${c.manual ? 'MANUAL' : 'AUTO'} BUILD ${Math.round(q * 100)}% · roll ${rollDiv(q)}${c.dropAt != null ? ' · drop armed' : ''}`;
  else if (c.phase === 'freeze') st = `FREEZE · beat ${Math.floor((S.pos - c.freezeAt) / 4) + 1} · ${c.manual ? (c.dropAt != null ? 'drop armed' : 'release = drop') : 'auto drop at cue end'}`;
  else st = `DROP ${c.flavor} · bar ${Math.min(4, Math.floor((S.pos - c.dropAt) / BAR) + 1)}/4`;
  g.textAlign = 'right'; g.fillStyle = c.phase === 'post' ? HOT : ink(.75); g.fillText(st, RX - 22, hy - 6);
  g.textAlign = 'left'; g.fillStyle = ink(.35); g.fillText('hold W / drag up · ←/→ or slide at top', RX + 44, NY - 6);
}
requestAnimationFrame(frame);
demoPlan();
</script>
