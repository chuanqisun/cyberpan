<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>54 — Play It Into Existence (Guided Suggestions)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font: 11px/1 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  header {
    position: fixed; top: 12px; left: 16px; right: 16px; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none;
  }
  .grp { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .hint { color: rgba(255,255,255,0.34); letter-spacing: 0.05em; font-size: 10px; overflow: hidden; text-overflow: ellipsis; }
  .hint b { color: rgba(255,255,255,0.72); font-weight: 500; }
  button {
    pointer-events: auto; appearance: none; background: #000; color: rgba(255,255,255,0.68);
    border: 1px solid rgba(255,255,255,0.20); font: inherit; font-size: 10px; letter-spacing: 0.09em;
    height: 22px; padding: 0 9px; border-radius: 2px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; transition: border-color 140ms, color 140ms;
  }
  button:hover, button.on { border-color: rgba(255,255,255,0.78); color: #fff; }
  button .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.34); }
  button.on .dot { background: #ff5a1f; box-shadow: 0 0 6px #ff5a1f; }
  @media (max-width: 860px) { .hint { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header>
  <span class="hint"><b>54</b> · PLAY INTO EXISTENCE · hollow rings = <b>SILENT SUGGESTION GUIDE</b> · strike <b>1–9 / click NOW</b> as rings close to crystallize them into the live song · <b>TAB</b> next idea · <b>SPACE</b> play</span>
  <div class="grp">
    <button id="nextBtn" type="button">TRY: a-PICKUP LIFT [TAB]</button>
    <button id="clearBtn" type="button">RESET</button>
    <button id="playBtn" type="button"><span class="dot"></span><span id="playLbl">PLAY</span></button>
  </div>
</header>
<script type="module">
'use strict';
// ============================================================================
// 54 — PLAY IT INTO EXISTENCE (1 CORE INTERACTION)
//   - A warm minimal foundation plays (Ding + whisper ghost pulse)
//   - System proposes curated musical ideas ("a-Pickup Lift", "Yearning 5th",
//     "Tresillo Bass Answer", "3:2 Cascade", "Open 5th Dyad") as SILENT
//     approaching target rings with closing timing halos at NOW
//   - Nothing in the guide makes sound until YOU strike it!
//   - Every guided note you strike on time IGNITES and CRYSTALLIZES permanently
//     into the live looping track; skipped notes evaporate silently; improvised
//     off-guide notes ALSO crystallize cleanly!
// ============================================================================

const A4 = 440.5, semiHz = (st) => A4 * Math.pow(2, st / 12);
const NOTES = [
  ['E3','^1', semiHz(-17)], ['B3','^5', semiHz(-10)], ['C4','^b6', semiHz(-9)],
  ['D4','^b7', semiHz(-7)], ['E4','^1', semiHz(-5)],  ['F#4','^2', semiHz(-3)],
  ['G4','^b3', semiHz(-2)], ['A4','^4', semiHz(0)],   ['B4','^5', semiHz(2)],
].map(([name, deg, hz], idx) => ({ name, deg, hz, idx, pan: ((idx / 8) - 0.5) * 0.56 }));

const PROG = [
  { sym: 'i',   dingHz: semiHz(-17), pool: [0, 1, 4, 6, 8] },
  { sym: 'VI',  dingHz: semiHz(-21), pool: [2, 4, 6, 8, 1] },
  { sym: 'VII', dingHz: semiHz(-19), pool: [3, 5, 7, 8, 1] },
  { sym: 'i',   dingHz: semiHz(-17), pool: [0, 1, 4, 6, 5] },
];

// Curated #41/#42 musical phrases the system suggests for the user to play into existence!
const SUGGESTIONS = [
  { name: 'a-PICKUP LIFT',   notes: [{ pos: 3, lane: 4 }, { pos: 6, lane: 6 }, { pos: 11, lane: 8 }, { pos: 14, lane: 6 }] },
  { name: 'YEARNING 5TH',    notes: [{ pos: 0, lane: 4 }, { pos: 6, lane: 7 }, { pos: 11, lane: 8 }, { pos: 14, lane: 7 }] },
  { name: 'TRESILLO ANSWER', notes: [{ pos: 0, lane: 1 }, { pos: 6, lane: 4 }, { pos: 12, lane: 6 }] },
  { name: '3:2 CASCADE',     notes: [{ pos: 0, lane: 8 }, { pos: 3, lane: 6 }, { pos: 6, lane: 4 }, { pos: 9, lane: 2 }, { pos: 12, lane: 4 }] },
  { name: 'HIGH BLOOM',      notes: [{ pos: 4, lane: 6 }, { pos: 7, lane: 7 }, { pos: 10, lane: 8 }, { pos: 15, lane: 6 }] },
];

const BPM = 98, TATUM = 60 / BPM / 4, LOOKAHEAD = 0.10, FUTURE_STEPS = 24;
const HIT_WINDOW_STEPS = 1.15; // generous ergonomic human timing window (~±175ms)!
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const mod16 = (s) => ((Math.round(s) % 16) + 16) % 16;
const mixInk = (heat, alpha) => {
  const h = clamp(heat, 0, 1), a = clamp(alpha, 0, 1);
  return h <= 0.005 ? `rgba(255,255,255,${a.toFixed(3)})`
    : `rgba(255,${Math.round(lerp(255, 90, h))},${Math.round(lerp(255, 31, h))},${clamp(lerp(a, Math.max(a, 0.95), h), 0, 1).toFixed(3)})`;
};

// ==================== 1. WARM HANDPAN AUDIO ====================
let actx = null, masterLP = null, clickBuf = null;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const sr = actx.sampleRate;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -9; comp.ratio.value = 5; comp.release.value = 0.14; comp.connect(actx.destination);
    const master = actx.createGain(); master.gain.value = 0.84; master.connect(comp);
    masterLP = actx.createBiquadFilter(); masterLP.type = 'lowpass'; masterLP.frequency.value = 2380; masterLP.Q.value = 0.65;
    const dry = actx.createGain(); dry.gain.value = 0.80;
    const wet = actx.createGain(); wet.gain.value = 0.44;
    const irLen = Math.floor(sr * 2.4), ir = actx.createBuffer(2, irLen, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let lp = 0;
      for (let i = 0; i < irLen; i++) { lp = lp * 0.66 + (Math.random() * 2 - 1) * 0.34; d[i] = lp * Math.pow(1 - i / irLen, 2.5) * 0.50; }
    }
    const conv = actx.createConvolver(); conv.buffer = ir;
    masterLP.connect(dry); dry.connect(master);
    masterLP.connect(conv); conv.connect(wet); wet.connect(master);
    clickBuf = actx.createBuffer(1, Math.floor(sr * 0.020), sr);
    const cd = clickBuf.getChannelData(0); for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (cd.length * 0.26));
  }
  if (actx.state === 'suspended') actx.resume();
}

function playPan(idx, when, vel = 0.8, dur = 3, opts = {}) {
  ensureAudio();
  const n = NOTES[idx]; if (!n) return;
  const { isGhost = false, dingHz = null } = opts, isDing = idx === 0;
  const freq = (isDing && dingHz) ? dingHz : n.hz;
  const t0 = Math.max(actx.currentTime + 0.002, when), v = clamp(vel, 0.12, 1.05);
  const sus = clamp(0.45 + dur * 0.32, 0.45, 2.50) * (isDing ? 1.40 : 1.0) * (isGhost ? 0.65 : 1.0);
  const out = actx.createGain(); out.gain.setValueAtTime(v * (isDing ? 0.42 : 0.30), t0);
  const pan = actx.createStereoPanner(); pan.pan.setValueAtTime(isDing ? -0.04 : n.pan, t0);
  out.connect(pan); pan.connect(masterLP);
  for (const [r, amp, dm] of [[1, 0.94, 1], [1.003, 0.18, 0.86], [2, 0.26, 0.70], [3, 0.46, 0.66]]) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * r, t0);
    const atk = r === 3 ? 0.020 : 0.005, dec = Math.max(0.08, sus * dm);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(amp, t0 + atk); g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + atk + dec + 0.04);
  }
}

// ==================== 2. SUGGESTION GUIDE + CRYSTALLIZED REALITY MODEL ====================
const state = {
  playing: false, playheadStep: 0, anchorStep: 0, anchorAudioTime: 0, nextSchedStep: 0,
  sugIdx: 0,
  // Realized notes that the user ACTUALLY played into existence! Map of `pos:lane` -> { pos, lane, born }
  realized: new Map(),
  // Tracks which notes of the CURRENT suggestion the user has captured so far
  capturedInSug: new Set(),
  pastNotes: [], sparks: [], toast: '', toastPerf: -9999,
  lociGlow: new Float32Array(9), lociHeat: new Float32Array(9),
};
const getCurrentStep = () => (!state.playing || !actx) ? state.playheadStep : state.anchorStep + Math.max(0, (actx.currentTime - state.anchorAudioTime) / TATUM);
const chordAtBar = (b) => PROG[((b % PROG.length) + PROG.length) % PROG.length];

const nextBtn = document.getElementById('nextBtn');
function selectSuggestion(idx, announce = false) {
  state.sugIdx = ((idx % SUGGESTIONS.length) + SUGGESTIONS.length) % SUGGESTIONS.length;
  state.capturedInSug.clear();
  nextBtn.textContent = `TRY: ${SUGGESTIONS[state.sugIdx].name} [TAB]`;
  if (announce) { state.toast = `NEXT IDEA → ${SUGGESTIONS[state.sugIdx].name}`; state.toastPerf = performance.now(); }
}

// ==================== 3. SCHEDULER (ONLY PLAYS FOUNDATION + USER-REALIZED NOTES!) ====================
let schedTimer = null;
function schedulerTick() {
  if (!state.playing || !actx) return;
  const horizon = state.anchorStep + (actx.currentTime + LOOKAHEAD - state.anchorAudioTime) / TATUM;

  while (state.nextSchedStep <= horizon) {
    const step = state.nextSchedStep++, pos = mod16(step), bar = Math.floor(step / 16), ch = chordAtBar(bar);
    const tBase = Math.max(actx.currentTime + 0.003, state.anchorAudioTime + (step - state.anchorStep) * TATUM);
    const jitter = (Math.random() * 2 - 1) * 0.005;

    // 1. Minimal steady pulse foundation (Ding on 0, 8 + quiet ghost breath so user has clear tempo groove!)
    if (pos === 0 || pos === 8) {
      playPan(0, tBase + jitter, pos === 0 ? 0.86 : 0.62, 4, { dingHz: ch.dingHz });
      visAt(tBase, () => { state.lociGlow[0] = Math.max(state.lociGlow[0], 0.82); state.pastNotes.push({ step, lane: 0, realized: false, isGhost: false }); });
    } else if (pos % 4 === 2 || pos % 4 === 3) {
      const gLane = ch.pool[(pos + bar) % ch.pool.length];
      playPan(gLane, tBase + jitter + 0.003, pos % 4 === 3 ? 0.28 : 0.18, 1, { isGhost: true });
      visAt(tBase, () => { state.lociGlow[gLane] = Math.max(state.lociGlow[gLane], 0.28); });
    }

    // 2. ALL NOTES THAT THE USER PLAYED INTO EXISTENCE! (Never plays unplayed guide suggestions!)
    for (const r of state.realized.values()) {
      if (r.pos !== pos) continue;
      // Don't double-trigger a note the user literally just struck on this very beat
      if (performance.now() - r.born < 220) continue;
      playPan(r.lane, tBase + jitter - 0.004, 0.88, 3, { dingHz: ch.dingHz });
      visAt(tBase, () => {
        state.lociGlow[r.lane] = 1;
        state.pastNotes.push({ step, lane: r.lane, realized: true, isGhost: false });
      });
    }
  }
  if (state.pastNotes.length > 180) { const cur = getCurrentStep(); state.pastNotes = state.pastNotes.filter(n => cur - n.step < 64); }
}
function visAt(when, fn) { setTimeout(() => { if (state.playing) fn(); }, Math.max(0, (when - actx.currentTime) * 1000)); }

// Human strikes a lane -> plays immediately + checks if it matches an approaching silent guide ring!
function strikeIntoExistence(lane) {
  ensureAudio();
  if (!state.playing) togglePlay();
  const cur = getCurrentStep(), nowPerf = performance.now(), ch = chordAtBar(Math.floor(cur / 16));
  playPan(lane, actx.currentTime, 0.96, 4, { dingHz: ch.dingHz });
  state.lociGlow[lane] = 1; state.lociHeat[lane] = 1;

  // Check if there's a matching guide target close to NOW on this lane!
  const sug = SUGGESTIONS[state.sugIdx];
  let matched = null, bestErr = HIT_WINDOW_STEPS;
  for (let i = 0; i < sug.notes.length; i++) {
    const gn = sug.notes[i];
    if (gn.lane !== lane) continue;
    const rawDiff = ((gn.pos - (cur % 16)) + 24) % 16 - 8; // circular signed distance in [-8..+8]
    if (Math.abs(rawDiff) <= bestErr) { bestErr = Math.abs(rawDiff); matched = { idx: i, pos: gn.pos }; }
  }

  const snapPos = matched ? matched.pos : mod16(Math.round(cur));
  state.realized.set(`${snapPos}:${lane}`, { pos: snapPos, lane, born: nowPerf });
  state.pastNotes.push({ step: cur, lane, realized: true, isGhost: false, hot: true });
  state.sparks.push({ lane, born: nowPerf, life: 580, hitGuide: Boolean(matched) });

  if (matched) {
    state.capturedInSug.add(matched.idx);
    // Once user plays >= 75% of the suggested phrase into existence, celebrate & suggest next idea!
    if (state.capturedInSug.size >= Math.max(2, Math.ceil(sug.notes.length * 0.75))) {
      state.toast = `CRYSTALLIZED "${sug.name}" → NEXT IDEA`;
      state.toastPerf = nowPerf;
      setTimeout(() => selectSuggestion(state.sugIdx + 1, false), 550);
    }
  }
}

const playBtn = document.getElementById('playBtn'), playLbl = document.getElementById('playLbl');
function togglePlay() {
  ensureAudio();
  if (!state.playing) {
    state.anchorStep = state.playheadStep; state.anchorAudioTime = actx.currentTime + 0.025;
    state.nextSchedStep = Math.ceil(state.playheadStep - 0.001); state.playing = true;
    schedulerTick(); schedTimer = setInterval(schedulerTick, 18);
  } else { state.playheadStep = getCurrentStep(); state.playing = false; clearInterval(schedTimer); schedTimer = null; }
  playBtn.classList.toggle('on', state.playing); playLbl.textContent = state.playing ? 'PAUSE' : 'PLAY';
}
playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', () => selectSuggestion(state.sugIdx + 1, true));
document.getElementById('clearBtn').addEventListener('click', () => { state.realized.clear(); state.capturedInSug.clear(); });

// ==================== 4. GEOMETRY & INTERACTION ====================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, nowY = 0, stepPx = 14, fieldL = 0, fieldR = 0, gap = 48;
const locusX = (i) => fieldL + i * gap;
function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  nowY = Math.round(H * 0.42);
  stepPx = clamp((H - nowY - 40) / FUTURE_STEPS, 10, 22);
  gap = clamp(W * 0.056, 30, 62);
  fieldL = Math.round(W * 0.5 - gap * 4); fieldR = fieldL + gap * 8;
}
window.addEventListener('resize', layout); layout();

canvas.addEventListener('pointerdown', (e) => {
  const mx = e.clientX, my = e.clientY;
  if (mx >= fieldL - gap * 0.5 && mx <= fieldR + gap * 0.5 && Math.abs(my - nowY) <= 44) {
    strikeIntoExistence(clamp(Math.round((mx - fieldL) / gap), 0, 8));
  }
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  if (e.code === 'Tab') { e.preventDefault(); selectSuggestion(state.sugIdx + 1, true); return; }
  if (!e.repeat && e.key >= '1' && e.key <= '9') strikeIntoExistence(Number(e.key) - 1);
});

// ==================== 5. VISUAL TIMING GUIDE RENDERER ====================
const sLine = (x1, y1, x2, y2, col, lw = 1) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
const sCirc = (x, y, r, col, lw = 1) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.stroke(); };
const fCirc = (x, y, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.fill(); };

let lastPerf = performance.now();
function frame(nowPerf) {
  const dt = Math.min(0.05, Math.max(0.001, (nowPerf - lastPerf) / 1000)); lastPerf = nowPerf;
  const curStep = getCurrentStep(), curBar = Math.floor(curStep / 16);
  for (let i = 0; i < 9; i++) { state.lociGlow[i] *= Math.exp(-dt * 5.2); state.lociHeat[i] = Math.max(0, state.lociHeat[i] - dt * 2.5); }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const xL = fieldL - 22, xR = fieldR + 22;

  // Bar lines
  for (let g = Math.floor(curStep) - 16; g <= Math.ceil(curStep) + FUTURE_STEPS; g++) {
    if (mod16(g) !== 0) continue;
    const y = Math.round(nowY + (g - curStep) * stepPx) + 0.5;
    if (y >= 46 && y <= H - 30) sLine(xL, y, xR, y, 'rgba(255,255,255,0.10)');
  }
  for (let i = 0; i < 9; i++) {
    sLine(locusX(i), 48, locusX(i), H - 30, `rgba(255,255,255,${i === 0 || i === 4 ? 0.065 : 0.03})`);
  }

  // 1. FUTURE REALIZED NOTES (solid white — already played into existence!)
  for (let b = curBar; b <= curBar + 2; b++) {
    for (const r of state.realized.values()) {
      const s = b * 16 + r.pos, off = s - curStep;
      if (off <= 0.02 || off > FUTURE_STEPS) continue;
      const x = locusX(r.lane), y = nowY + off * stepPx;
      fCirc(x, y, 3.6, 'rgba(255,255,255,0.90)');
    }
  }

  // 2. SILENT SUGGESTION GUIDE RINGS (approaching hollow targets + closing timing halos at NOW!)
  const sug = SUGGESTIONS[state.sugIdx];
  for (let b = curBar; b <= curBar + 2; b++) {
    for (let i = 0; i < sug.notes.length; i++) {
      const gn = sug.notes[i];
      if (state.realized.has(`${gn.pos}:${gn.lane}`)) continue; // already played into existence!
      const s = b * 16 + gn.pos, off = s - curStep;
      if (off < -0.5 || off > FUTURE_STEPS) continue;
      const x = locusX(gn.lane), y = nowY + off * stepPx;
      const near = clamp(1 - Math.abs(off) / 6, 0, 1);

      // Dashed hollow target approaching NOW
      ctx.save(); ctx.setLineDash([3, 3]);
      sCirc(x, y, 8.5, mixInk(near > 0.72 ? 1 : 0.55, 0.32 + near * 0.65), near > 0.72 ? 1.5 : 1.0);
      ctx.restore();
      ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = mixInk(near > 0.72 ? 1 : 0.5, 0.55 + near * 0.45);
      ctx.fillText(String(gn.lane + 1), x, y + 0.5);

      // CLOSING TIMING HALO right on the NOW locus as target enters strike window (within 4 steps)!
      if (off > 0 && off <= 4.5) {
        const u = off / 4.5;
        sCirc(x, nowY, 5 + u * 26, mixInk(1, (1 - u) * 0.85), 1.3);
      }
    }
  }

  // 3. PAST realized notes rising upward
  for (const n of state.pastNotes) {
    const y = nowY + (n.step - curStep) * stepPx;
    if (y < 48 || y >= nowY) continue;
    const f = clamp((y - 48) / 30, 0, 1);
    fCirc(locusX(n.lane), y, n.realized ? 3.5 : 2.2, mixInk(n.hot ? 0.8 : 0, (n.realized ? 0.85 : 0.35) * f));
  }

  // 4. Crystallization sparks when user plays a guide note into existence!
  for (let i = state.sparks.length - 1; i >= 0; i--) {
    const sp = state.sparks[i], p = (nowPerf - sp.born) / sp.life;
    if (p >= 1) { state.sparks.splice(i, 1); continue; }
    sCirc(locusX(sp.lane), nowY, 6 + p * (sp.hitGuide ? 36 : 20), mixInk(sp.hitGuide ? 1 : 0.4, (1 - p) * 0.90), 1.4);
  }

  // 5. NOW horizon & key labels
  sLine(xL, nowY + 0.5, xR, nowY + 0.5, 'rgba(255,255,255,0.68)', 1.2);
  ctx.font = '9.5px ui-monospace, monospace'; ctx.textAlign = 'center';
  for (let i = 0; i < 9; i++) {
    const x = locusX(i), g = state.lociGlow[i], h = state.lociHeat[i];
    fCirc(x, nowY, (i === 0 ? 3.0 : 2.2) + g * 2.5, mixInk(h, 0.55 + g * 0.45));
    ctx.textBaseline = 'top'; ctx.fillStyle = mixInk(h, 0.34 + g * 0.65); ctx.fillText(`${i + 1} · ${NOTES[i].name}`, x, H - 22);
  }

  // Subtle status banner
  const toastA = clamp(1 - (nowPerf - state.toastPerf) / 1800, 0, 1);
  if (toastA > 0.02) {
    ctx.font = '10px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = `rgba(255,90,31,${toastA.toFixed(3)})`;
    ctx.fillText(state.toast, W * 0.5, 44);
  } else {
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillText(`GUIDE: ${sug.name} · ${state.realized.size} NOTES REALIZED`, W * 0.5, 44);
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
