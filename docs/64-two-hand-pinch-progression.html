// 64 — SIMPLIFIED TWO-HAND FINGERTIP PINCH PROGRESSION CONDUCTOR
//   Radically simplified CV exploration (#58 feedback):
//     - ONLY tracks Thumb Tip (#4) & Index Tip (#8) per hand (clean 2-dot caliper!)

//         * Open hands float safely without touching the music

const A4 = 440.5, semiHz = (st) => A4 * Math.pow(2, st / 12);
const NOTES = [
  ['E3', semiHz(-17)], ['B3', semiHz(-10)], ['C4', semiHz(-9)],
  ['D4', semiHz(-7)],  ['E4', semiHz(-5)],  ['F#4', semiHz(-3)],
  ['G4', semiHz(-2)],  ['A4', semiHz(0)],   ['B4', semiHz(2)],
].map(([name, hz], idx) => ({ name, hz, idx, pan: ((idx / 8) - 0.5) * 0.65 }));

// 4 Distinct Harmonic Chapters steered directly by Left-Hand Pinch X!
const CHAPTERS = [
  { sym: 'i · HOME',    dingHz: semiHz(-17), subHz: semiHz(-41), pool: [0, 1, 4, 6, 8] },
  { sym: 'VI · LIFT',   dingHz: semiHz(-21), subHz: semiHz(-45), pool: [2, 4, 6, 8, 1] },
  { sym: 'VII · DRIVE', dingHz: semiHz(-19), subHz: semiHz(-43), pool: [3, 5, 7, 8, 1] },
  { sym: 'iv · DEEP',   dingHz: semiHz(-24), subHz: semiHz(-48), pool: [0, 2, 4, 7, 8] },
];

const BPM = 104, TATUM = 60 / BPM / 4, LOOKAHEAD = 0.095, SAFE = 0.0002;
const PINCH_ON = 0.056, PINCH_OFF = 0.084; // generous Schmitt hysteresis so pinches never flicker!
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const mixInk = (heat, alpha) => {
  const h = clamp(heat, 0, 1), a = clamp(alpha, 0, 1);
  return h <= 0.005 ? `rgba(255,255,255,${a.toFixed(3)})`
    : `rgba(255,${Math.round(lerp(255, 90, h))},${Math.round(lerp(255, 31, h))},${clamp(lerp(a, Math.max(a, 0.95), h), 0, 1).toFixed(3)})`;
};

// ==================== 1. WARM EXPRESSIVE HANDPAN ENGINE ====================
let actx = null, masterLP = null, hallSend = null, subOsc = null, subGain = null, noiseBuf = null;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const sr = actx.sampleRate;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -9; comp.ratio.value = 5; comp.release.value = 0.14; comp.connect(actx.destination);
    const master = actx.createGain(); master.gain.value = 0.85; master.connect(comp);
    masterLP = actx.createBiquadFilter(); masterLP.type = 'lowpass'; masterLP.frequency.value = 2300; masterLP.Q.value = 0.65;
    const dry = actx.createGain(); dry.gain.value = 0.78;
    const wet = actx.createGain(); wet.gain.value = 0.46;
    const irLen = Math.floor(sr * 2.6), ir = actx.createBuffer(2, irLen, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let lp = 0;
      for (let i = 0; i < irLen; i++) { lp = lp * 0.64 + (Math.random() * 2 - 1) * 0.36; d[i] = lp * Math.pow(1 - i / irLen, 2.45) * 0.54; }
    }
    const conv = actx.createConvolver(); conv.buffer = ir;
    hallSend = actx.createGain(); hallSend.gain.value = 0.36;
    masterLP.connect(dry); dry.connect(master);
    masterLP.connect(hallSend); hallSend.connect(conv); conv.connect(wet); wet.connect(master);

    subOsc = actx.createOscillator(); subOsc.type = 'sine'; subOsc.frequency.value = CHAPTERS[0].subHz;
    const subLP = actx.createBiquadFilter(); subLP.type = 'lowpass'; subLP.frequency.value = 115;
    subGain = actx.createGain(); subGain.gain.value = SAFE;
    subOsc.connect(subLP); subLP.connect(subGain); subGain.connect(master); subOsc.start();

    noiseBuf = actx.createBuffer(1, Math.floor(sr * 0.03), sr);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nd.length * 0.25));
  }
  if (actx.state === 'suspended') actx.resume();
}

function playPan(idx, when, vel = 0.8, dur = 3, opts = {}) {
  ensureAudio();
  const n = NOTES[idx]; if (!n) return;
  const { isGhost = false, octUp = false, stereoWide = 1.0, dingHz = null } = opts, isDing = idx === 0;
  const freq = ((isDing && dingHz) ? dingHz : n.hz) * (octUp ? 2 : 1);
  const t0 = Math.max(actx.currentTime + 0.002, when), v = clamp(vel, 0.10, 1.05);
  const sus = clamp(0.45 + dur * 0.32, 0.45, 2.65) * (isDing ? 1.42 : 1.0) * (isGhost ? 0.65 : 1.0);
  const out = actx.createGain(); out.gain.setValueAtTime(v * (isDing ? 0.43 : 0.29), t0);
  const pan = actx.createStereoPanner(); pan.pan.setValueAtTime(clamp((isDing ? 0 : n.pan) * stereoWide, -0.95, 0.95), t0);
  out.connect(pan); pan.connect(masterLP);
  for (const [r, amp, dm] of [[1, 0.94, 1], [1.003, 0.18, 0.86], [2, 0.28, 0.70], [3, 0.46, 0.66]]) {
    const o = actx.createOscillator(), g = ctxNode(actx);
    o.type = 'sine'; o.frequency.setValueAtTime(freq * r, t0);
    const atk = r === 3 ? 0.020 : 0.005, dec = Math.max(0.06, sus * dm);
    g.gain.setValueAtTime(SAFE, t0); g.gain.linearRampToValueAtTime(amp, t0 + atk); g.gain.exponentialRampToValueAtTime(SAFE, t0 + atk + dec);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + atk + dec + 0.04);
  }
}
const ctxNode = (c) => c.createGain();

function playRim(when, vel = 0.5, panVal = 0.2) {
  if (!actx) return;
  const t0 = Math.max(actx.currentTime + 0.002, when);
  const ns = actx.createBufferSource(); ns.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2650; bp.Q.value = 3.2;
  const g = actx.createGain(); g.gain.setValueAtTime(vel * 0.28, t0);
  const p = actx.createStereoPanner(); p.pan.setValueAtTime(panVal, t0);
  ns.connect(bp); bp.connect(g); g.connect(p); p.connect(masterLP); ns.start(t0);
}

// ==================== 2. PROGRESSION STATE STEERED BY 2-HAND PINCH ====================
const state = {
  playing: false, step: 0, bar: 0, nextTime: 0,
  // Left Pinch controls:
  chapterIdx: 0,   // 0..3 (i HOME, VI LIFT, VII DRIVE, iv DEEP)
  energy: 0.48,    // 0 = Outro/Sparse .. 0.5 = Groove .. 1 = Climax Swell
  // Right Pinch controls:
  rhythm: 0.48,    // 0 = Cantus .. 0.5 = 50% Ghost Groove .. 1 = 3:2 Polyrhythm
  register: 0.42,  // 0 = Low warm body .. 1 = High +8va singing bloom
  // Both Hands Pinched together (elastic stretch!):
  spread: 0.35,    // 0 = Intimate tight solo .. 1 = Vast 35% stereo 4-voice cathedral climax!
  bothPinched: false,
  fillFlash: 0,
  pulseNotes: [],
};

// ==================== 3. SCHEDULER ====================
let schedTimer = null;
function scheduler() {
  if (!state.playing || !actx) return;
  while (state.nextTime < actx.currentTime + LOOKAHEAD) {
    const s = state.step, bar = state.bar, t0 = state.nextTime;
    const ch = CHAPTERS[state.chapterIdx];
    const E = state.energy, R = state.rhythm, Reg = state.register, Sp = state.spread;
    const stereoWide = lerp(0.50, 1.50, Sp);

    // Continuous harmonic warmth & sub bed follow Energy + Two-Hand Stretch!
    masterLP.frequency.setTargetAtTime(lerp(1150, 3600, clamp(E * 0.55 + Sp * 0.55, 0, 1)), t0, 0.05);
    hallSend.gain.setTargetAtTime(lerp(0.20, 0.72, Sp), t0, 0.05);
    subOsc.frequency.setTargetAtTime(ch.subHz, t0, 0.03);
    subGain.gain.setTargetAtTime(E > 0.22 ? lerp(0.06, 0.28, clamp((E - 0.22) / 0.78 + Sp * 0.25, 0, 1)) : SAFE, t0, 0.04);

    // 1. Ding Bass Anchor (scales from beat 1 only -> Tresillo -> step 15 pickup with Energy!)
    if (s === 0 || (s === 6 && E > 0.30) || (s === 12 && E > 0.24) || (s === 15 && E > 0.62)) {
      playPan(0, t0, s === 0 ? 0.94 : 0.76, 4, { dingHz: ch.dingHz, stereoWide });
      visNote(t0, 0, 0.94);
    }

    // 2. Cathedral Chord Wash on Beat 1/3 when Two-Hand Spread is stretched wide (>0.65)!
    if (Sp > 0.65 && (s === 0 || s === 8)) {
      ch.pool.slice(1, 4).forEach((ln, k) => playPan(ln, t0 + k * 0.022, 0.52 * Sp, 6, { stereoWide }));
    }

    // 3. Rim "a"-16th pickups scale with Rhythm & Energy
    if (E > 0.28 && R > 0.25 && (s % 4 === 3 || (E > 0.55 && (s === 4 || s === 12)))) {
      playRim(t0, s % 4 === 0 ? 0.68 : 0.42, s % 8 < 4 ? -0.25 : 0.25);
    }

    // 4. Singing Melody guided by Register (Right Pinch Y) & Rhythm (Right Pinch X: Cantus ↔ 3:2!)
    const melHit = R > 0.68 ? (s % 3 === 0 || s === 14) : R > 0.28 ? (s === 3 || s === 6 || s === 10 || s === 14) : (s === 0 || s === 8);
    if (melHit && s !== 0) {
      const target = lerp(1.5, 8.0, Reg);
      const sorted = [...ch.pool].filter(p => p > 0).sort((a, b) => Math.abs(a - target) - Math.abs(b - target));
      const mIdx = sorted[(s + bar) % Math.min(2, sorted.length)];
      const octUp = Reg > 0.74 && mIdx >= 5;
      playPan(mIdx, t0 - 0.004, lerp(0.68, 0.96, E), R < 0.28 ? 5 : 2, { octUp, stereoWide });
      visNote(t0, mIdx, 0.90);
    } else if (E > 0.22 && R > 0.22 && s % 4 !== 1) {
      // 50% Ghost Bed
      const gIdx = ch.pool[(s + bar) % ch.pool.length];
      playPan(gIdx, t0 + 0.003, s % 4 === 3 ? 0.36 : 0.24, 1, { isGhost: true, stereoWide });
    }

    state.nextTime += TATUM; state.step = (state.step + 1) % 16; if (state.step === 0) state.bar++;
  }
}

function visNote(when, idx, vel) {
  setTimeout(() => {
    if (!state.playing) return;
    state.pulseNotes.push({ idx, vel, born: performance.now(), life: 680 });
    if (state.pulseNotes.length > 24) state.pulseNotes.shift();
  }, Math.max(0, (when - actx.currentTime) * 1000));
}

function triggerTurnaroundFill() {
  ensureAudio();
  const ch = CHAPTERS[state.chapterIdx], t0 = actx.currentTime + 0.004;
  [8, 6, 4].forEach((ln, k) => playPan(ch.pool[ln % ch.pool.length] || 4, t0 + k * 0.065, 0.86 - k * 0.1, 3, { stereoWide: 1.3 }));
  state.fillFlash = 1.0;
}

const playBtn = document.getElementById('playBtn'), camBtn = document.getElementById('camBtn'), simBtn = document.getElementById('simBtn'), camSel = document.getElementById('camSel');
function togglePlay(force = null) {
  const want = force != null ? force : !state.playing;
  if (want === state.playing) return;
  ensureAudio(); state.playing = want;
  if (want) { state.nextTime = actx.currentTime + 0.025; scheduler(); schedTimer = setInterval(scheduler, 18); }
  else { clearInterval(schedTimer); schedTimer = null; if (subGain) subGain.gain.setTargetAtTime(SAFE, actx.currentTime, 0.02); }

}

// ==================== 4. CLEAN FINGERTIP PINCH TRACKER + CAMERA SELECTOR ====================
class SmoothVal {
  constructor(fc = 1.8, beta = 0.18) { this.fc = fc; this.beta = beta; this.x = null; this.dx = 0; this.t = null; }
  reset() { this.x = null; this.dx = 0; this.t = null; }
  _a(c, dt) { return 1 / (1 + (1 / (2 * Math.PI * Math.max(1e-4, c))) / dt); }
  update(v, t) {
    if (this.x === null) { this.x = v; this.t = t; return v; }
    const dt = clamp(t - this.t, 0.004, 0.2); this.t = t;
    if (Math.abs(v - this.x) > 0.24) return this.x; // outlier rejection
    const ad = this._a(1.0, dt); this.dx = ad * ((v - this.x) / dt) + (1 - ad) * this.dx;
    const ax = this._a(this.fc + this.beta * Math.abs(this.dx), dt);
    return (this.x = ax * v + (1 - ax) * this.x);
  }
}

const videoEl = document.getElementById('cv-video');
const mkPinchHand = () => ({
  active: false, seenAt: 0, pinched: false, pinchStartMs: 0,
  tx: 0.5, ty: 0.5, ix: 0.5, iy: 0.5, px: 0.5, py: 0.5, dist: 0.2,
  fTx: new SmoothVal(), fTy: new SmoothVal(), fIx: new SmoothVal(), fIy: new SmoothVal()
});
const cv = { mode: 'off', loading: false, stream: null, landmarker: null, lastVidT: -1, simStart: 0, hands: { L: mkPinchHand(), R: mkPinchHand() } };

async function populateCameras() {
  if (!navigator.mediaDevices?.enumerateDevices) return;
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const prev = camSel.value; camSel.innerHTML = '';
    if (!devs.length) { camSel.innerHTML = '<option value="">NO CAMERA</option>'; return; }
    devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || `CAMERA ${i + 1}`; camSel.appendChild(o); });
    if (devs.some(d => d.deviceId === prev)) camSel.value = prev;
  } catch {}
}
populateCameras();

function stopCv() {
  cv.mode = 'off'; cv.loading = false;
  if (cv.stream) { cv.stream.getTracks().forEach(t => t.stop()); cv.stream = null; }
  videoEl.srcObject = null;
  cv.hands.L.active = cv.hands.R.active = false;
  camBtn.textContent = 'CAM OFF'; camBtn.classList.remove('on', 'sig');
  simBtn.textContent = 'SIM PINCH'; simBtn.classList.remove('on', 'sig');
}

async function startCamera() {
  stopCv(); ensureAudio(); cv.loading = true; camBtn.textContent = 'LOADING…'; camBtn.classList.add('sig');
  if (!navigator.mediaDevices?.getUserMedia) { cv.loading = false; camBtn.textContent = 'NO CAM API'; return; }
  const devId = camSel.value;
  const vOpt = devId ? { deviceId: { exact: devId }, width: 640, height: 480 } : { width: 640, height: 480, facingMode: 'user' };
  try {
    cv.stream = await navigator.mediaDevices.getUserMedia({ video: vOpt, audio: false });
    await populateCameras();
    const id = cv.stream.getVideoTracks()[0]?.getSettings?.().deviceId; if (id) camSel.value = id;
    videoEl.srcObject = cv.stream; await videoEl.play();
    if (!cv.landmarker) {
      const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs');
      const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm');
      const mk = (d) => HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d }, runningMode: 'VIDEO', numHands: 2 });
      try { cv.landmarker = await mk('GPU'); } catch { cv.landmarker = await mk('CPU'); }
    }
    cv.loading = false; cv.mode = 'cam'; camBtn.textContent = 'CAM LIVE'; camBtn.classList.add('on');
  } catch { stopCv(); camBtn.textContent = 'CAM ERROR'; }
}
camBtn.addEventListener('click', () => (cv.mode === 'cam' || cv.loading) ? stopCv() : startCamera());
camSel.addEventListener('change', () => { if (cv.mode === 'cam') startCamera(); });
simBtn.addEventListener('click', () => {
  ensureAudio(); if (cv.mode === 'sim') { stopCv(); return; }
  stopCv(); cv.mode = 'sim'; cv.simStart = performance.now();
  simBtn.textContent = 'STOP SIM'; simBtn.classList.add('sig', 'on');
  if (!state.playing) togglePlay(true);
});

// Pure Fingertip Pinch Ingestion (ONLY reads landmark #4 Thumb Tip & #8 Index Tip!)
function processFingertips(rawList, nowMs) {
  const tSec = nowMs / 1000;
  const pairs = rawList.filter(r => r && r.length >= 9).map(r => {
    const thumb = { x: 1 - r[4].x, y: r[4].y }, index = { x: 1 - r[8].x, y: r[8].y };
    return { thumb, index, cx: (thumb.x + index.x) * 0.5 };
  });

  let pL = null, pR = null;
  if (pairs.length === 1) { if (pairs[0].cx < 0.5) pL = pairs[0]; else pR = pairs[0]; }
  else if (pairs.length >= 2) { pairs.sort((a, b) => a.cx - b.cx); pL = pairs[0]; pR = pairs[1]; }

  for (const [id, src] of [['L', pL], ['R', pR]]) {
    const h = cv.hands[id];
    if (src) {
      h.active = true; h.seenAt = nowMs;
      h.tx = clamp(h.fTx.update(src.thumb.x, tSec), 0, 1); h.ty = clamp(h.fTy.update(src.thumb.y, tSec), 0, 1);
      h.ix = clamp(h.fIx.update(src.index.x, tSec), 0, 1); h.iy = clamp(h.fIy.update(src.index.y, tSec), 0, 1);
      h.px = (h.tx + h.ix) * 0.5; h.py = (h.ty + h.iy) * 0.5;
      h.dist = Math.hypot(h.tx - h.ix, h.ty - h.iy);

      if (!h.pinched && h.dist < PINCH_ON) { h.pinched = true; h.pinchStartMs = nowMs; }
      else if (h.pinched && h.dist > PINCH_OFF) {
        if (id === 'R' && (nowMs - h.pinchStartMs) < 240) triggerTurnaroundFill(); // quick R pinch tap = flourish!
        h.pinched = false;
      }

      // CLUTCH-TO-ENGAGE: Track progression ONLY moves while pinched! Open hand never causes accidental drift!
      if (h.pinched) {
        if (id === 'L') {
          const nx = clamp((h.px - 0.08) / 0.40, 0, 0.999);
          state.chapterIdx = Math.floor(nx * 4);
          state.energy = clamp(1 - (h.py - 0.16) / 0.68, 0, 1);
        } else {
          state.rhythm = clamp((h.px - 0.52) / 0.40, 0, 1);
          state.register = clamp(1 - (h.py - 0.16) / 0.68, 0, 1);
        }
      }
    } else if (nowMs - h.seenAt > 300) {
      h.active = false; h.pinched = false; h.fTx.reset(); h.fTy.reset(); h.fIx.reset(); h.fIy.reset();
    }
  }

  // TWO-HAND PINCH ELASTIC STRETCH -> controls Stereo Climax Spread!
  state.bothPinched = cv.hands.L.active && cv.hands.R.active && cv.hands.L.pinched && cv.hands.R.pinched;
  if (state.bothPinched) {
    const handSpan = Math.hypot(cv.hands.R.px - cv.hands.L.px, cv.hands.R.py - cv.hands.L.py);
    state.spread = clamp((handSpan - 0.18) / 0.62, 0, 1);
  }
}

function tickCv(nowMs) {
  if (cv.mode === 'cam' && cv.landmarker && videoEl.readyState >= 2 && videoEl.currentTime !== cv.lastVidT) {
    cv.lastVidT = videoEl.currentTime;
    try { const r = cv.landmarker.detectForVideo(videoEl, Math.round(nowMs)); processFingertips(r?.landmarks || [], nowMs); } catch {}
  } else if (cv.mode === 'sim') {
    const t = (nowMs - cv.simStart) / 1000, cyc = t % 16;
    // Choreographed demo: 0-5s L pinch walks Chapters -> 5-10s R pinch sweeps Register/Rhythm -> 10-16s BOTH pinch & stretch!
    const pinL = cyc < 5.5 || cyc > 9.5;
    const pinR = cyc > 4.5;
    const xL = cyc > 10 ? lerp(0.36, 0.12, Math.sin(((cyc - 10) / 6) * Math.PI)) : 0.12 + 0.32 * ((cyc % 5.5) / 5.5);
    const yL = 0.55 - 0.28 * Math.sin(t * 0.55);
    const xR = cyc > 10 ? lerp(0.64, 0.88, Math.sin(((cyc - 10) / 6) * Math.PI)) : 0.72 + 0.16 * Math.sin(t * 0.7);
    const yR = 0.50 - 0.28 * Math.cos(t * 0.65);
    const mkPair = (cx, cy, pinched) => {
      const gap = pinched ? 0.014 : 0.095;
      const arr = new Array(9).fill({ x: 0.5, y: 0.5 });
      arr[4] = { x: 1 - (cx - gap * 0.5), y: cy + gap * 0.35 };
      arr[8] = { x: 1 - (cx + gap * 0.5), y: cy - gap * 0.35 };
      return arr;
    };
    processFingertips([mkPair(xL, yL, pinL), mkPair(xR, yR, pinR)], nowMs);
  }
}

// ==================== 5. MOUSE FALLBACK + ULTRA-MINIMAL 2-DOT FINGERTIP RENDERER ====================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

let mouseDrag = null;
canvas.addEventListener('pointerdown', (e) => {
  ensureAudio(); if (!state.playing) togglePlay(true);
  canvas.setPointerCapture(e.pointerId);
  mouseDrag = e.clientX < W * 0.5 ? 'L' : 'R';
  applyMouse(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => { if (mouseDrag) applyMouse(e.clientX, e.clientY); });
canvas.addEventListener('pointerup', () => { mouseDrag = null; });
function applyMouse(mx, my) {
  if (mouseDrag === 'L') {
    state.chapterIdx = clamp(Math.floor((mx / (W * 0.5)) * 4), 0, 3);
    state.energy = clamp(1 - (my - 50) / (H - 100), 0, 1);
  } else {
    state.rhythm = clamp((mx - W * 0.5) / (W * 0.5), 0, 1);
    state.register = clamp(1 - (my - 50) / (H - 100), 0, 1);
  }
}
window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); togglePlay(); } });

let lastMs = performance.now();
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - lastMs) / 1000); lastMs = nowMs;
  tickCv(nowMs);
  state.fillFlash = Math.max(0, state.fillFlash - dt * 2.2);

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const midX = Math.round(W * 0.5), padT = 62, padB = 42, fieldH = H - padT - padB;

  // Clean minimalist L / R Stage Divider & Progression Anchors
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(midX + 0.5, padT); ctx.lineTo(midX + 0.5, H - padB); ctx.stroke();

  // LEFT HALF: 4 Harmonic Chapters (i / VI / VII / iv) × Energy Height!
  const lW = midX - 36;
  ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center';
  for (let c = 0; c < 4; c++) {
    const cx = 24 + (c + 0.5) * (lW / 4), active = state.chapterIdx === c;
    ctx.strokeStyle = active ? 'rgba(255,90,31,0.45)' : 'rgba(255,255,255,0.06)';
    ctx.beginPath(); ctx.moveTo(cx, padT + 14); ctx.lineTo(cx, H - padB - 14); ctx.stroke();
    ctx.fillStyle = active ? '#ff5a1f' : 'rgba(255,255,255,0.32)';
    ctx.fillText(CHAPTERS[c].sym, cx, padT + 6);
  }
  // Current locked Left progression crosshair
  const lx = 24 + (state.chapterIdx + 0.5) * (lW / 4), ly = lerp(H - padB - 14, padT + 18, state.energy);
  ctx.strokeStyle = mixInk(cv.hands.L.pinched ? 1 : 0.4, 0.72); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(lx, ly, 8 + state.energy * 10, 0, Math.PI * 2); ctx.stroke();

  // RIGHT HALF: Rhythm (Cantus ↔ Ghost ↔ 3:2) × Melodic Register (+8va)!
  const rX0 = midX + 24, rW = W - rX0 - 24;
  ctx.fillStyle = 'rgba(255,255,255,0.32)';
  ctx.textAlign = 'left';  ctx.fillText('CANTUS', rX0, padT + 6);
  ctx.textAlign = 'center'; ctx.fillText('50% GHOST', rX0 + rW * 0.5, padT + 6);
  ctx.textAlign = 'right'; ctx.fillText('3:2 FLOW', rX0 + rW, padT + 6);
  const rx = rX0 + state.rhythm * rW, ry = lerp(H - padB - 14, padT + 18, state.register);
  ctx.strokeStyle = mixInk(cv.hands.R.pinched ? 1 : 0.4, 0.72); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(rx, ry, 8 + state.register * 10, 0, Math.PI * 2); ctx.stroke();

  // Subtle sounding note blooms along bottom bar
  for (let i = state.pulseNotes.length - 1; i >= 0; i--) {
    const pn = state.pulseNotes[i], p = (nowMs - pn.born) / pn.life;
    if (p >= 1) { state.pulseNotes.splice(i, 1); continue; }
    const nx = lerp(W * 0.20, W * 0.80, pn.idx / 8);
    ctx.strokeStyle = `rgba(255,255,255,${((1 - p) * 0.35).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(nx, H - 22, 4 + p * 22, 0, Math.PI * 2); ctx.stroke();
  }

  // TWO-HAND PINCH ELASTIC CORD (glows directly between pinched fingertips when pulling climax!)
  if (state.bothPinched) {
    const L = cv.hands.L, R = cv.hands.R;
    ctx.strokeStyle = mixInk(1, 0.45 + state.spread * 0.55); ctx.lineWidth = 1.2 + state.spread * 2.4;
    ctx.beginPath(); ctx.moveTo(L.px * W, L.py * H); ctx.lineTo(R.px * W, R.py * H); ctx.stroke();
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#ff5a1f';
    ctx.fillText(`STEREO CLIMAX ${Math.round(state.spread * 100)}%`, (L.px + R.px) * 0.5 * W, (L.py + R.py) * 0.5 * H - 10);
  }

  // ULTRA-MINIMAL FINGERTIP CALIPERS (literally just Thumb dot + Index dot + connecting line!)
  for (const id of ['L', 'R']) {
    const h = cv.hands[id]; if (!h.active) continue;
    const tx = h.tx * W, ty = h.ty * H, ix = h.ix * W, iy = h.iy * H;
    ctx.strokeStyle = h.pinched ? '#ff5a1f' : 'rgba(255,255,255,0.45)'; ctx.lineWidth = h.pinched ? 2.0 : 1.0;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(ix, iy); ctx.stroke();
    for (const [fx, fy] of [[tx, ty], [ix, iy]]) {
      ctx.fillStyle = h.pinched ? '#ff5a1f' : '#fff';
      ctx.beginPath(); ctx.arc(fx, fy, h.pinched ? 4.5 : 3.2, 0, Math.PI * 2); ctx.fill();
    }
    if (h.pinched) {
      ctx.strokeStyle = 'rgba(255,90,31,0.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(h.px * W, h.py * H, 15, 0, Math.PI * 2); ctx.stroke();
    }
  }

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
