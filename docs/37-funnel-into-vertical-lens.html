    const b0 = Math.max(0, (u0 ? u0.age : 0) / 16), b1 = Math.max(0, (u1 ? u1.age : 0) / 16), pfx = drag.shift ? `+G${state.groups.length + 1} · ` : '';
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#ff5a1f';
    ctx.fillText(`${pfx}${drag.selIds.size}n · −${b0.toFixed(1)}b..−${b1.toFixed(1)}b`, r.x1, Math.max(geo.padTop + 12, r.y0 - 4)); return;
  }
  if ((drag.mode === 'placeFuture' || drag.mode === 'editFuture') && drag.activePin) {
    const p = drag.activePin, pt = projFunnel(p.noteIdx - 4, p.step - curStep);
    ctx.font = '9px ui-monospace, monospace'; ctx.textAlign = p.noteIdx >= 6 ? 'right' : 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ff5a1f';
    ctx.fillText(`${NOTES[p.noteIdx].name} · d=${p.dur}`, p.noteIdx >= 6 ? pt.x - 15 : pt.x + 15, pt.y); return;
  }
  if (hover.target === 'futEmpty' && !drag.mode && hover.ghostLocus >= 0) {
    const off = hover.ghostStep - curStep;
    if (off > 0.2 && off <= FUTURE_STEPS) {
      const pt = projFunnel(hover.ghostLocus - 4, off), pL = projFunnel(-WALL_PAD_LANES, off), f = edgeFadeBot(pt.y);
      strokeLine(pL.x, pt.y + 0.5, pt.x - 10 * pt.scale, pt.y + 0.5, `rgba(255,255,255,${(0.08 * f).toFixed(3)})`);
      ctx.save(); ctx.setLineDash([2, 2]); traceDiamond(pt.x, pt.y, 5.2 * pt.scale); ctx.strokeStyle = `rgba(255,255,255,${(0.50 * f).toFixed(3)})`; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
      ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = hover.ghostLocus >= 6 ? 'right' : 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = `rgba(255,255,255,${(0.48 * f).toFixed(3)})`;
      ctx.fillText(`+ ${NOTES[hover.ghostLocus].name}`, hover.ghostLocus >= 6 ? pt.x - 12 : pt.x + 12, pt.y);
    }
    return;
  }
  if (hover.pastId > 0 && hover.focus > 0.05 && !drag.mode) {
    const n = state.pastNotes.find(p => p.id === hover.pastId); if (!n || n.step >= curStep) return;
    const x = geo.locusX[n.noteIdx], y = wallY(curStep - n.step); if (y < geo.padTop - 2 || y >= geo.nowY) return;
    const a = hover.focus, col = n.locked ? `rgba(255,90,31,${(0.75 * a).toFixed(3)})` : `rgba(255,255,255,${(0.32 * a).toFixed(3)})`;
    strokeCirc(x, y, 13, col, 0.85); strokeLine(geo.wallL, y + 0.5, x - 16, y + 0.5, `rgba(255,255,255,${(0.10 * a).toFixed(3)})`);
    const label = `−${Math.max(0, (curStep - n.step) / 16).toFixed(1)}b · ${NOTES[n.noteIdx].name} · d=${n.dur}`;
    ctx.font = '9px ui-monospace, monospace'; const tw = ctx.measureText(label).width + 12, bx = n.noteIdx >= 6 ? x - 18 - tw : x + 18, by = clamp(y - 9, geo.padTop + 2, geo.nowY - 22);
    ctx.fillStyle = `rgba(0,0,0,${(0.90 * a).toFixed(3)})`; ctx.fillRect(bx, by, tw, 17);
    ctx.strokeStyle = n.locked ? `rgba(255,90,31,${(0.75 * a).toFixed(3)})` : `rgba(255,255,255,${(0.34 * a).toFixed(3)})`; ctx.lineWidth = 0.85; ctx.strokeRect(bx + 0.5, by + 0.5, tw, 17);
    ctx.fillStyle = n.locked ? `rgba(255,90,31,${(0.96 * a).toFixed(3)})` : `rgba(255,255,255,${(0.90 * a).toFixed(3)})`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(label, bx + 6, by + 9);
  }
}

const drawKnob = (x, y, act, heat, hov) => { fillCirc(x, y, act ? 6.8 : 5.8, act ? '#ff5a1f' : '#000'); strokeCirc(x, y, act ? 6.8 : 5.8, mixInk(heat, hov || act ? 1 : 0.78), act ? 1.9 : 1.25); if (!act) fillCirc(x, y, 1.8, mixInk(heat, 0.92)); };
function drawControls(nowPerf) {
  ctx.font = '9px ui-monospace, monospace';
  const lbl = (txt, x, y, al, bl, h, a) => { ctx.textAlign = al; ctx.textBaseline = bl; ctx.fillStyle = mixInk(h, a); ctx.fillText(txt, x, y); };
  // Left Top: Log Past Lens Slider
  const lx = geo.lensX, lTop = geo.lensTop, lBot = geo.lensBot, ky = lensKnobY(), lAct = drag.mode === 'lens', lHeat = lAct ? 1 : clamp(1 - (nowPerf - state.lensHotPerf) / FLASH_MS, 0, 1);
  strokeLine(lx + 0.5, lTop, lx + 0.5, lBot, 'rgba(255,255,255,0.14)');
  for (let w = 1; w <= 4; w += 0.5) {
    const ty = Math.round(lensKnobY(w)) + 0.5, maj = Number.isInteger(w), tw = maj ? 6 : 3;
    strokeLine(lx - tw, ty, lx + tw, ty, Math.abs(ty - ky) < 9 ? mixInk(lHeat, 0.85) : `rgba(255,255,255,${maj ? 0.30 : 0.12})`);
    if (maj) lbl(`${w}×`, lx - 9, ty, 'right', 'middle', Math.abs(state.warp - w) < 0.2 ? lHeat : 0, Math.abs(state.warp - w) < 0.25 ? 0.72 : 0.28);
  }
  strokeLine(lx + 0.5, lBot, lx + 0.5, ky, mixInk(lHeat, 0.58), 1.4);
  drawKnob(lx, ky, lAct, lHeat, hover.target === 'lens');
  lbl('LENS', lx, lTop - 13, 'center', 'bottom', lHeat, 0.38);

  // Left Bottom: 2D Motion × Tension Compass (only if space allows outside funnel)
  if (geo.frontL > geo.R * 2 + 26) {
    const sx = geo.steerX, sy = geo.steerY, R = geo.R, sk = steerKnobPos(), sAct = drag.mode === 'steer', sHeat = sAct ? 1 : clamp(1 - (nowPerf - state.steerHotPerf) / FLASH_MS, 0, 1);
    strokeCirc(sx, sy, R, mixInk(sHeat, 0.18 + sHeat * 0.24)); strokeCirc(sx, sy, R * 0.5, 'rgba(255,255,255,0.06)');
    strokeLine(sx - R, sy + 0.5, sx + R, sy + 0.5, 'rgba(255,255,255,0.09)'); strokeLine(sx + 0.5, sy - R, sx + 0.5, sy + R, 'rgba(255,255,255,0.09)');
    strokeLine(sx, sy, sk.x, sk.y, mixInk(sHeat, 0.52), 1.25); drawKnob(sk.x, sk.y, sAct, sHeat, hover.target === 'steer');
    lbl('TENSE', sx, sy - R - 7, 'center', 'bottom', sHeat, 0.28); lbl('CALM', sx, sy + R + 7, 'center', 'top', sHeat, 0.28);
  }

  // Right Wing: 1€ Adaptive Memory Bias Slider
  if (W - geo.frontR > 54) {
    const rx = geo.rightX, gR = geo.gaugeR, rk = rightKnobPos(), rAct = drag.mode === 'right', rHeat = rAct ? 1 : clamp(1 - (nowPerf - state.rightHotPerf) / FLASH_MS, 0, 1);
    strokeLine(rx + 0.5, geo.nowY - gR, rx + 0.5, geo.nowY + gR, 'rgba(255,255,255,0.14)');
    strokeLine(rx + 0.5, geo.nowY + gR, rx + 0.5, rk.y, mixInk(rHeat, 0.52), 1.35);
    drawKnob(rx, rk.y, rAct, rHeat, hover.target === 'right');
    lbl('HOLD', rx, geo.nowY - gR - 9, 'center', 'bottom', rHeat, 0.34);
    lbl('DRIFT', rx, geo.nowY + gR + 9, 'center', 'top', rHeat, 0.30);
  }
}

let lastFramePerf = performance.now();
function frame(nowPerf) {
  const dt = Math.min(0.05, Math.max(0.001, (nowPerf - lastFramePerf) / 1000)); lastFramePerf = nowPerf;
  const kSmooth = 1 - Math.exp(-dt * 12);
  if (Math.abs(state.warp - state.targetWarp) > 0.0005) { state.warp = lerp(state.warp, state.targetWarp, kSmooth); state.k = warpToK(state.warp); }
  if (Math.abs(state.flare - state.targetFlare) > 0.001) { state.flare = lerp(state.flare, state.targetFlare, kSmooth); layout(); }

  stepAdaptiveMemory(dt, nowPerf);
  const curStep = getCurrentStep();
  for (const n of state.pastNotes) if (!n.firedVisual && n.step <= curStep) { n.firedVisual = true; triggerResonator(n.noteIdx, n.vel, n.dur, false, curStep, nowPerf); }

  const wantFocus = hover.target === 'past' && !drag.mode && hover.pastId > 0 ? 1 : 0;
  hover.focus = lerp(hover.focus, wantFocus, 1 - Math.exp(-dt * 14));
  if (hover.pastId > 0) { const hn = state.pastNotes.find(p => p.id === hover.pastId); if (hn && hn.step < curStep) { hover.focusX = geo.locusX[hn.noteIdx]; hover.focusY = wallY(curStep - hn.step); } }

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  drawArchitecturalStage(curStep, nowPerf);
  drawMemoryHalo(nowPerf);
  drawWallToFunnelAttention(curStep, nowPerf);
  drawWavePackets(curStep, dt, nowPerf);
  drawNowFoldInterferometer(dt, nowPerf);
  drawOverlays(curStep);
  drawControls(nowPerf);
  requestAnimationFrame(frame);
}

seedInitialPast();
recomputeFuture(false);
requestAnimationFrame(frame);
</script>
</body>
