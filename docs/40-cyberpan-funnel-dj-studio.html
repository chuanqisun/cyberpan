<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>40 — Cyberpan Funnel DJ Studio (Vertical Wall × Funnel × Curve × Drop × Hand CV)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font: 11px/1 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #cv-video { display: none; }
  header {
    position: fixed; inset: 0 0 auto 0; height: 34px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 12px; background: rgba(0,0,0,0.88); border-bottom: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }
  .grp { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  button, .pill {
    pointer-events: auto; cursor: pointer; appearance: none; background: #000; color: rgba(255,255,255,0.68);
    font: inherit; font-size: 9.5px; letter-spacing: 0.08em; border: 1px solid rgba(255,255,255,0.20);
    border-radius: 2px; height: 21px; padding: 0 7px; display: inline-flex; align-items: center; gap: 5px;
    transition: border-color 120ms, color 120ms, background 120ms;
  }
  .pill { border-radius: 99px; padding: 0 8px; }
  button:hover, .pill:hover { border-color: rgba(255,255,255,0.75); color: #fff; }
  button.on { border-color: #fff; color: #fff; }
  .pill.on { border-color: #fff; background: #fff; color: #000; }
  .pill.sig { border-color: #ff5a1f; color: #ff5a1f; }
  .pill.sig.on { background: #ff5a1f; color: #000; }
  .pill.stat { pointer-events: none; cursor: default; color: rgba(255,255,255,0.38); border-color: rgba(255,255,255,0.12); }
  #playBtn .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.34); }
  #playBtn.on .dot { background: #ff5a1f; box-shadow: 0 0 6px #ff5a1f; }
  #phaseHud { color: rgba(255,255,255,0.72); font-size: 9.5px; letter-spacing: 0.09em; min-width: 118px; }
  #phaseHud.hot { color: #ff5a1f; }
  @media (max-width: 980px) { #stamps { display: none; } }
  @media (max-width: 720px) { #flareBtn, #quantBtn { display: none; } }
</style>
</head>
<body>
<header>
  <div class="grp">
    <button id="playBtn" type="button"><span class="dot"></span><span id="playLbl">PLAY</span></button>

  </div>
</header>
<video id="cv-video" playsinline muted></video>
<canvas id="c"></canvas>

<script type="module">
'use strict';
// ============================================================================
// 40 — CYBERPAN FUNNEL DJ STUDIO (UNIFIED FLAGSHIP FOR ALL 36-IDEAS FEEDBACK)
// 1. CORRECTED 3D STAGE (#37):
//    - TOP (PAST):    100% STRAIGHT-UP parallel vertical wall + #27 C¹ log lens,
//                     1€ adaptive memory halo, hover micro-lens & Shift multi-group
//    - MIDDLE (NOW):  90° architectural hinge + kick interferometer + 9 strike loci
//    - BOTTOM (FUTURE): One-point pseudo-perspective floor FUNNELING UPWARD into NOW
//                     with exact inverse unprojFunnel() for direct future pinning
// 2. LEFT WING (#30): Live DJ Drop Conductor Piston (STRIP ↓ / FLOW / BUILD ↑ / VACUUM)
//                     Overrides curve live when dragged/conducted; drops on beat!
// 3. RIGHT WING (#29): 4-Bar Emotional Curve Spine + auto SILENCE/BUILD/DROP phases
//                     + 1-click stamps (GROOVE / BUILD->DROP / FAKEOUT / CALM)
// 4. BI-MANUAL MEDIAPIPE CV (#31):
//    - LEFT HAND:  Height conducts DJ Piston; Fist = Vacuum Hold; Slam ↓ = Drop!
//    - RIGHT HAND: Center = aim & pinch live handpan; Right Wing = Air-Pen Curve Draw!
//    - BOTH SLAM:  Triggers full-stage SUPER DROP!
// 5. STUDIO BANK (Optional): Click BANK to load ./soundbanks/yishama-stainless.bank.js
// ============================================================================
const NOTES = [
  ['D3','^1',146.83], ['A3','^5',220.00], ['Bb3','^b6',233.08], ['C4','^b7',261.63],
  ['D4','^1',293.66], ['E4','^2',329.63], ['F4','^b3',349.23], ['G4','^4',392.00], ['A4','^5',440.00],
].map(([name, deg, freq], idx) => ({ name, deg, freq, idx, pan: (idx - 4) * 0.13 }));

const BPM = 122, BEAT_S = 60 / BPM, STEP_S = BEAT_S / 4, BAR_S = STEP_S * 16;
const LOOKAHEAD_S = 0.098, FUTURE_STEPS = 48, CURVE_STEPS = 64, FLASH_MS = 440, SAFE_MIN = 0.0002;
const DEFAULT_WARP = 2.4, FLARE_PRESETS = [1.28, 1.52, 1.76], QUANT_DURS = [1, 2, 3, 4, 6, 8];
const VAC_THRESH = 0.86, STRIP_THRESH = -0.14, BUILD_DROP_MIN = 0.28, RULER_BARS = [1, 2, 4, 8, 16];
const CHORDS = [[0, 1, 4, 6, 8], [2, 4, 6, 8, 1], [3, 5, 7, 1, 8], [0, 1, 4, 6, 5]];
const SUB_ROOTS = [[36.71, 73.42], [58.27, 116.54], [65.41, 130.81], [36.71, 73.42]];
const CELLS = {
  calm:   [[8], [6, -2], [4, 4], [4, -4], [6, 2]],
  groove: [[3, 3, 2], [4, 2, 2], [2, 2, 4], [3, 2, 3], [2, 4, 2]],
  build:  [[2, 2, 2, 2], [2, 1, 1, 2, 2], [1, 1, 2, 1, 1, 2], [1, 1, 1, 1, 2, 2]],
  drop:   [[3, 3, 2], [2, 2, 2, 2], [3, 2, 3], [2, 1, 1, 2, 2]]
};

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const mod16 = (s) => ((Math.round(s) % 16) + 16) % 16;
const snapDur = (s) => QUANT_DURS.reduce((b, d) => Math.abs(d - s) < Math.abs(b - s) ? d : b, QUANT_DURS[0]);
const hash01 = (a, b, c = 0) => {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177);
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
};
const mixInk = (heat, alpha) => {
  const h = clamp(heat, 0, 1), a = clamp(alpha, 0, 1);
  return h <= 0.005 ? `rgba(255,255,255,${a.toFixed(3)})`
    : `rgba(255,${Math.round(lerp(255, 90, h))},${Math.round(lerp(255, 31, h))},${clamp(lerp(a, Math.max(a, 0.92), h), 0, 1).toFixed(3)})`;
};
const harmonicBond = (a, b) => {
  if (a === b) return 1.0;
  const r = Math.max(NOTES[a].freq, NOTES[b].freq) / Math.min(NOTES[a].freq, NOTES[b].freq);
  return Math.abs(r - 2) < 0.03 ? 0.86 : Math.abs(r - 1.5) < 0.03 ? 0.68 : Math.abs(r - 3) < 0.05 ? 0.62 : Math.abs(r - 1.333) < 0.03 ? 0.48 : 0;
};

// ==================== 1. HYBRID WEB AUDIO ENGINE + OPTIONAL YISHAMA BANK ====================
let actx = null, masterBus = null, drumBus = null, uiBus = null;
let handpanBus = null, washHPF = null, washGate = null, duckGain = null;
let iceRevSend = null, vacDirect = null, subOsc1 = null, subOsc2 = null, subLPF = null, subDuck = null, subGate = null;
let riserBP = null, riserGain = null, shimGain = null, noiseLoopBuf = null, transientBuf = null, lastClickMs = 0, schedHpHz = 20;

const bank = { state: 'off', buffers: new Map() }; // Optional pre-generated Yishama Stainless bank
const mkFlt = (type, hz, q = 1) => { const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = hz; f.Q.value = q; return f; };
const mkGain = (val = 1) => { const g = actx.createGain(); g.gain.value = val; return g; };

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return actx; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const sr = actx.sampleRate, comp = actx.createDynamicsCompressor();
  comp.threshold.value = -8.5; comp.knee.value = 10; comp.ratio.value = 5.5; comp.attack.value = 0.003; comp.release.value = 0.14; comp.connect(actx.destination);
  masterBus = mkGain(0.86); masterBus.connect(comp);
  drumBus = mkGain(0.94); drumBus.connect(masterBus);
  uiBus = mkGain(0.22); uiBus.connect(comp);

  // Icy 2.6s Stereo Reverb (bypasses washGate so tail hangs dramatically in VACUUM/SILENCE!)
  const irLen = Math.floor(sr * 2.6), ir = actx.createBuffer(2, irLen, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch); let lp = 0;
    for (let i = 0; i < irLen; i++) { lp = lp * 0.62 + (Math.random() * 2 - 1) * 0.38; d[i] = lp * Math.pow(1 - i / irLen, 2.5) * (i < 900 ? i / 900 : 1) * 0.56; }
  }
  const conv = actx.createConvolver(); conv.buffer = ir;
  const revHP = mkFlt('highpass', 300, 0.7);
  iceRevSend = mkGain(0.30); iceRevSend.connect(conv); conv.connect(revHP); revHP.connect(masterBus);
  vacDirect = mkGain(0.56); vacDirect.connect(masterBus);

  handpanBus = mkGain(1.0); washHPF = mkFlt('highpass', 20, 0.72); washGate = mkGain(1.0); duckGain = mkGain(1.0);
  handpanBus.connect(washHPF); washHPF.connect(washGate); washGate.connect(duckGain); duckGain.connect(masterBus);

  subOsc1 = actx.createOscillator(); subOsc1.type = 'sine'; subOsc1.frequency.value = 36.71;
  subOsc2 = actx.createOscillator(); subOsc2.type = 'triangle'; subOsc2.frequency.value = 73.42;
  subLPF = mkFlt('lowpass', 165, 0.9); subDuck = mkGain(1.0); subGate = mkGain(SAFE_MIN);
  subOsc1.connect(mkGain(0.68)).connect(subLPF); subOsc2.connect(mkGain(0.32)).connect(subLPF);
  subLPF.connect(subDuck); subDuck.connect(subGate); subGate.connect(masterBus); subOsc1.start(); subOsc2.start();

  noiseLoopBuf = actx.createBuffer(1, Math.floor(sr * 3.0), sr);
  const ld = noiseLoopBuf.getChannelData(0); for (let i = 0; i < ld.length; i++) ld[i] = Math.random() * 2 - 1;
  transientBuf = actx.createBuffer(1, Math.floor(sr * 0.048), sr);
  const td = transientBuf.getChannelData(0); for (let i = 0; i < td.length; i++) td[i] = (Math.random() * 2 - 1) * Math.exp(-i / (td.length * 0.22));

  const rSrc = actx.createBufferSource(); rSrc.buffer = noiseLoopBuf; rSrc.loop = true;
  const rHP = mkFlt('highpass', 190, 0.7); riserBP = mkFlt('bandpass', 280, 1.3); riserGain = mkGain(SAFE_MIN);
  rSrc.connect(rHP); rHP.connect(riserBP); riserBP.connect(riserGain); riserGain.connect(masterBus); riserGain.connect(iceRevSend); rSrc.start();

  shimGain = mkGain(SAFE_MIN);
  for (const [hz, w] of [[293.66, 0.35], [440.0, 0.50], [442.2, 0.30], [587.33, 0.22]]) {
    const o = actx.createOscillator(); o.frequency.value = hz; o.connect(mkGain(w)).connect(shimGain); o.start();
  }
  shimGain.connect(iceRevSend); shimGain.connect(masterBus);
  return actx;
}

function silenceContinuous() {
  if (!actx) return;
  const t = actx.currentTime;
  for (const g of [riserGain, shimGain, subGate]) { if (g) { g.gain.cancelScheduledValues(t); g.gain.setTargetAtTime(SAFE_MIN, t, 0.025); } }
}

async function loadYishamaBank() {
  const btn = document.getElementById('bankBtn');
  if (bank.state === 'loading') return;
  if (bank.state === 'ready') {
    bank.state = 'bypass'; btn.classList.remove('on', 'sig'); btn.textContent = 'SYNTH';
    setBanner('AUDIO · BUILT-IN SYNTH'); return;
  }
  if (bank.state === 'bypass' && bank.buffers.size > 0) {
    bank.state = 'ready'; btn.classList.add('on', 'sig'); btn.textContent = 'YISHAMA';
    setBanner('AUDIO · YISHAMA STAINLESS BANK'); return;
  }
  ensureAudio(); bank.state = 'loading'; btn.textContent = 'LOAD...'; btn.classList.add('sig');
  try {
    if (!window.__HANDPAN_BANKS__?.['yishama-stainless']) {
      await new Promise((res, rej) => {
        const sc = document.createElement('script'); sc.src = './soundbanks/yishama-stainless.bank.js';
        sc.onload = res; sc.onerror = () => rej(new Error('Bank file missing')); document.head.appendChild(sc);
      });
    }
    const raw = window.__HANDPAN_BANKS__?.['yishama-stainless'];
    if (!raw?.samples) throw new Error('Invalid bank');
    const dec = async (b64) => {
      const bin = atob(b64), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return await actx.decodeAudioData(arr.buffer.slice(0));
    };
    const jobs = [];
    for (const n of NOTES) {
      for (const key of [`${n.name}|N|v0|r0`, `${n.name}|N|v1|r0`, `${n.name}|H|v0|r0`]) {
        if (raw.samples[key]) jobs.push(dec(raw.samples[key]).then(buf => bank.buffers.set(key, buf)));
      }
    }
    await Promise.all(jobs);
    bank.state = 'ready'; btn.classList.add('on', 'sig'); btn.textContent = 'YISHAMA';
    setBanner('YISHAMA STAINLESS BANK LOADED');
  } catch {
    bank.state = 'off'; btn.classList.remove('on', 'sig'); btn.textContent = 'BANK N/A';
    setBanner('BANK UNAVAILABLE · USING BUILT-IN SYNTH');
  }
}

function playHandpan(idx, vel = 0.78, durSteps = 4, when = null, whisper = false, inVacSolo = false) {
  const ctxA = ensureAudio(), t0 = Math.max(ctxA.currentTime + 0.001, when ?? ctxA.currentTime);
  const n = NOTES[idx], v = clamp(vel, 0.14, 1.0);
  const pan = ctxA.createStereoPanner(); pan.pan.setValueAtTime(n.pan, t0);
  if (inVacSolo) { pan.connect(vacDirect); pan.connect(iceRevSend); }
  else { if (!whisper) pan.connect(handpanBus); pan.connect(iceRevSend); }

  // Use decoded Yishama Stainless sample bank when loaded!
  if (bank.state === 'ready') {
    const key = whisper ? `${n.name}|H|v0|r0` : (v > 0.62 ? `${n.name}|N|v1|r0` : `${n.name}|N|v0|r0`);
    const buf = bank.buffers.get(key) || bank.buffers.get(`${n.name}|N|v1|r0`);
    if (buf) {
      const src = ctxA.createBufferSource(); src.buffer = buf;
      const g = mkGain(SAFE_MIN), cutSec = clamp(0.45 + durSteps * 0.34, 0.55, buf.duration);
      g.gain.setValueAtTime(v * (idx === 0 ? 0.78 : 0.64) * (whisper ? 0.68 : 1.0), t0);
      if (cutSec < buf.duration - 0.15) g.gain.setTargetAtTime(SAFE_MIN, t0 + cutSec * 0.62, cutSec * 0.28);
      src.connect(g); g.connect(pan); src.start(t0); src.stop(t0 + Math.min(buf.duration, cutSec + 0.8));
      return;
    }
  }

  // Built-in Coupled-Bloom D Kurd Web Audio synth
  const f0 = n.freq, isDing = idx === 0;
  const tau1 = (isDing ? 1.52 : 1.08) * Math.pow(220 / f0, 0.22) * (0.36 + Math.pow(durSteps / 8, 0.76) * 1.42) * (whisper ? 1.45 : 1);
  const vGain = mkGain(v * (isDing ? 0.54 : 0.42) * (whisper ? 0.64 : 1)); vGain.connect(pan);
  for (const [hz, amp, rise, tau] of [
    [f0, 0.72, 0.005, tau1], [f0 + 0.72, 0.28, 0.008, tau1 * 0.94],
    [f0 * 2.001, 0.26 * (0.62 + 0.45 * v), 0.024, tau1 * 0.48], [f0 * 2.998, 0.095 * v, 0.038, tau1 * 0.25]
  ]) {
    const osc = ctxA.createOscillator(), g = mkGain(SAFE_MIN);
    osc.frequency.setValueAtTime(hz * (1 + 0.0022 * v), t0); osc.frequency.exponentialRampToValueAtTime(hz, t0 + 0.042);
    g.gain.setValueAtTime(SAFE_MIN, t0); g.gain.linearRampToValueAtTime(Math.max(SAFE_MIN, amp), t0 + rise);
    g.gain.setTargetAtTime(SAFE_MIN, t0 + rise, tau * 0.62);
    osc.connect(g); g.connect(vGain); osc.start(t0); osc.stop(t0 + Math.min(4.6, rise + tau * 3.5));
  }
  const src = ctxA.createBufferSource(), bp = mkFlt('bandpass', 520 + idx * 115, 1.7), ng = mkGain(SAFE_MIN);
  src.buffer = transientBuf; ng.gain.setValueAtTime(Math.max(SAFE_MIN, v * (whisper ? 0.08 : 0.20)), t0);
  ng.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + 0.024);
  src.connect(bp); bp.connect(ng); ng.connect(pan); src.start(t0);
}

function triggerSidechain(t0, depth = 0.55) {
  const floor = clamp(1 - depth, 0.14, 0.92), rel = STEP_S * 2.5;
  for (const g of [duckGain, subDuck]) {
    if (!g) continue;
    g.gain.setValueAtTime(1.0, t0); g.gain.linearRampToValueAtTime(floor, t0 + 0.011); g.gain.exponentialRampToValueAtTime(1.0, t0 + rel);
  }
}

function playSubKick(t0, vel = 0.92, heavy = false) {
  const ctxA = ensureAudio(), v = clamp(vel, 0.2, 1.0), osc = ctxA.createOscillator(), g = mkGain(SAFE_MIN);
  osc.frequency.setValueAtTime(heavy ? 138 : 128, t0); osc.frequency.exponentialRampToValueAtTime(44, t0 + 0.075);
  osc.frequency.exponentialRampToValueAtTime(36.71, t0 + (heavy ? 0.36 : 0.24));
  g.gain.setValueAtTime(SAFE_MIN, t0); g.gain.linearRampToValueAtTime(v * (heavy ? 0.88 : 0.72), t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + (heavy ? 0.44 : 0.30));
  osc.connect(g); g.connect(drumBus); osc.start(t0); osc.stop(t0 + (heavy ? 0.48 : 0.34));

  const punch = ctxA.createOscillator(), pg = mkGain(SAFE_MIN);
  punch.type = 'triangle'; punch.frequency.setValueAtTime(420, t0); punch.frequency.exponentialRampToValueAtTime(78, t0 + 0.022);
  pg.gain.setValueAtTime(v * 0.26, t0); pg.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + 0.028);
  punch.connect(pg); pg.connect(drumBus); punch.start(t0); punch.stop(t0 + 0.032);
}

function playHat(t0, vel = 0.55, isOffbeat = true) {
  const ctxA = ensureAudio(), src = ctxA.createBufferSource(); src.buffer = noiseLoopBuf;
  const hp = mkFlt('highpass', isOffbeat ? 6800 : 7800, 0.7), bp = mkFlt('bandpass', isOffbeat ? 9200 : 10800, isOffbeat ? 1.8 : 2.6);
  const g = mkGain(SAFE_MIN), pan = ctxA.createStereoPanner(), dur = isOffbeat ? 0.072 : 0.036;
  g.gain.setValueAtTime(SAFE_MIN, t0); g.gain.linearRampToValueAtTime(Math.max(SAFE_MIN, vel * (isOffbeat ? 0.24 : 0.11)), t0 + (isOffbeat ? 0.002 : 0.006));
  g.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + dur);
  pan.pan.setValueAtTime(isOffbeat ? 0.18 : -0.22, t0);
  src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(pan); pan.connect(drumBus);
  src.start(t0, Math.random() * 2.0, dur + 0.02);
}

function playBuildSnare(t0, heat = 0.5, vel = 0.65) {
  const ctxA = ensureAudio(), h = clamp(heat, 0, 1), body = ctxA.createOscillator(), bg = mkGain(SAFE_MIN);
  body.type = 'triangle'; body.frequency.setValueAtTime(lerp(220, 560, h), t0); body.frequency.exponentialRampToValueAtTime(lerp(135, 310, h), t0 + 0.048);
  bg.gain.setValueAtTime(Math.max(SAFE_MIN, vel * 0.28), t0); bg.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + 0.068);
  body.connect(bg); bg.connect(drumBus); body.start(t0); body.stop(t0 + 0.074);

  const src = ctxA.createBufferSource(); src.buffer = noiseLoopBuf;
  const bp = mkFlt('bandpass', lerp(340, 1850, h), lerp(1.4, 3.6, h)), ng = mkGain(SAFE_MIN), tail = lerp(0.11, 0.055, h);
  ng.gain.setValueAtTime(SAFE_MIN, t0); ng.gain.linearRampToValueAtTime(Math.max(SAFE_MIN, vel * 0.34), t0 + 0.002); ng.gain.exponentialRampToValueAtTime(SAFE_MIN, t0 + tail);
  src.connect(bp); bp.connect(ng); ng.connect(drumBus); ng.connect(iceRevSend);
  src.start(t0, Math.random() * 2.0, tail + 0.02);
}

function playDropImpact(t0, intensity = 0.92, halfTime = false, superDrop = false) {
  const ctxA = ensureAudio(), p = clamp(intensity, 0.55, 1.0);
  washHPF.frequency.cancelScheduledValues(t0); washHPF.frequency.setValueAtTime(Math.max(20, schedHpHz), t0);
  washHPF.frequency.exponentialRampToValueAtTime(20, t0 + 0.016); washHPF.Q.setTargetAtTime(0.72, t0, 0.012); schedHpHz = 20;
  washGate.gain.cancelScheduledValues(t0); washGate.gain.setValueAtTime(1.0, t0);
  riserGain.gain.cancelScheduledValues(t0); riserGain.gain.setTargetAtTime(SAFE_MIN, t0, 0.006);
  shimGain.gain.cancelScheduledValues(t0); shimGain.gain.setTargetAtTime(SAFE_MIN, t0, 0.012);

  const boom = ctxA.createOscillator(), bg = mkGain(SAFE_MIN);

class OneEuro {

  reset() { this.x = null; this.dx = 0; this.t = null; }

  filter(v, tSec) {
    if (!Number.isFinite(v) || !Number.isFinite(tSec)) return this.x ?? 0;
    if (this.x === null || this.t === null) { this.x = v; this.dx = 0; this.t = tSec; return v; }

function computeFistness(lms) {
  const palmLen = Math.hypot(lms[9].x - lms[0].x, lms[9].y - lms[0].y) || 0.08;
  let sum = 0; for (const ti of TIP_IDX) sum += Math.hypot(lms[ti].x - lms[0].x, lms[ti].y - lms[0].y);
  return clamp(1 - ((sum / 4) / palmLen - 1.05) / 0.62, 0, 1);
}

function paintCurveSpan(sA, eA, sB, eB) {
  const minS = Math.ceil(state.playhead) + 1, maxS = Math.floor(state.playhead) + CURVE_STEPS;
  for (let s = Math.min(sA, sB); s <= Math.max(sA, sB); s++) {
    if (s < minS || s > maxS) continue;
    state.curve.set(s, clamp(lerp(eA, eB, clamp(sB === sA ? 1 : (s - sA) / (sB - sA), 0, 1)), 0.01, 0.99));
    state.markers.delete(s);
  }
  state.activeStamp = null; updateStampUI(); recomputeFuture(1.5);
}
function togglePinpointMarker(rawStep) {
  const minS = Math.ceil(state.playhead) + 1, maxS = Math.floor(state.playhead) + CURVE_STEPS, nearBeat = Math.round(rawStep / 4) * 4;
  const step = clamp(Math.abs(rawStep - nearBeat) <= 1.35 ? nearBeat : Math.round(rawStep), minS, maxS);
  const cur = state.markers.get(step);
  let afterSilence = getCurveRaw(step) < 0.16;
  for (let k = 1; k <= 16; k++) if (state.markers.get(step - k)?.type === 'silence') { afterSilence = true; break; }
  const setDrop = () => {
    state.markers.set(step, { type: 'drop', halfTime: false });
    for (let k = 0; k < 24 && step + k <= maxS + 8; k++) state.curve.set(step + k, 0.86 - (k / 24) * 0.10);
    playClick(0.45, 1680, 0.055); setBanner('CURVE MARKER · ▼ DROP');
  };
  if (!cur) {
    if (afterSilence) setDrop();
    else { state.markers.set(step, { type: 'silence' }); for (let k = 0; k < 8 && step + k <= maxS + 4; k++) { if (k > 0 && state.markers.get(step + k)?.type === 'drop') break; state.curve.set(step + k, 0.02); } playClick(0.35, 620, 0.05); setBanner('CURVE MARKER · ○ SILENCE'); }
  } else if (cur.type === 'silence') setDrop();
  else { state.markers.delete(step); const a = getCurveRaw(step - 2), b = getCurveRaw(step + 8); for (let k = 0; k < 8; k++) state.curve.set(step + k, lerp(a, b, k / 8)); playClick(0.25, 920, 0.04); }
  state.activeStamp = null; updateStampUI(); recomputeFuture(1.5);
}

function processHandFrame(rawList, handedList, nowMs) {
  const assigned = assignHands(rawList, handedList), tSec = nowMs / 1000;
  for (const id of ['L', 'R']) {
    const h = assigned[id], slot = cv.hands[id];
    if (h) {
      if (!slot.active && nowMs - slot.seenAt > 320) { slot.fx.reset(); slot.fy.reset(); slot.pinched = false; slot.penActive = false; slot.prevT = tSec; }
      slot.active = true; slot.seenAt = nowMs; slot.lms = h.lms; slot.rawCx = h.cx; slot.rawCy = h.cy;
      const rx = id === 'L' ? clamp((h.cx - 0.04) / 0.38, 0, 1) : clamp((h.cx - 0.42) / 0.54, 0, 1);
      const ry = clamp(1 - (h.cy - 0.10) / 0.78, 0, 1); // 0 = bottom, 1 = top
      const nx = clamp(slot.fx.filter(rx, tSec), 0, 1), ny = clamp(slot.fy.filter(ry, tSec), 0, 1);
      const dt = Math.max(0.012, tSec - (slot.prevT || tSec - 0.016));
      slot.vyDown = (slot.ny - ny) / dt; slot.prevNy = slot.ny; slot.nx = nx; slot.ny = ny; slot.prevT = tSec;

      const d = Math.hypot(h.lms[4].x - h.lms[8].x, h.lms[4].y - h.lms[8].y);
      slot.pinchDist = d; slot.pinchProx = clamp(1 - (d - 0.048) / 0.095, 0, 1);
      slot.fistAmt = computeFistness(h.lms); slot.fist = slot.fistAmt > 0.68;

      if (id === 'R') {
        // Seamless Dual-Zone Right Hand: Center Stage (<=0.64) = Live Handpan · Right Wing (>0.64) = Air-Pen Curve Sculptor!
        slot.zone = nx > 0.64 ? 'curve' : 'pan';
        if (slot.zone === 'pan') {
          slot.penActive = false;
          if (!slot.pinched && d < PINCH_ON && (nowMs - slot.lastPinchAt) > 190) {
            slot.pinched = true; slot.lastPinchAt = nowMs; slot.pinchFlash = 1.0;
            const aim = clamp(Math.round((nx / 0.64) * 8), 0, 8);
            strikeLiveHandpan(aim, clamp(lerp(0.62, 1.0, ny), 0.56, 1.0));
            setBanner(state.pistonMode === 'VACUUM' ? `VACUUM SOLO · ${NOTES[aim].name}` : `R PINCH · ${NOTES[aim].name}`);
          } else if (slot.pinched && d > PINCH_OFF) slot.pinched = false;
        } else {
          const curveU = clamp((nx - 0.64) / 0.36, 0, 1);
          const cx = lerp(geo.curveX0, geo.curveX1, curveU), cy = lerp(H - geo.padBot - 4, geo.nowY + 8, ny);
          const curStep = Math.round(curveStepOfY(cy)), curE = curveEOfX(cx);
          if (!slot.pinched && d < PINCH_ON && (nowMs - slot.lastPinchAt) > 130) {
            slot.pinched = true; slot.lastPinchAt = nowMs; slot.pinchFlash = 1.0;
            slot.penActive = true; slot.penMoved = false; slot.penStartMs = nowMs; slot.penStartX = cx; slot.penStartY = cy; slot.penLastStep = curStep; slot.penLastE = curE;
          } else if (slot.pinched && d <= PINCH_OFF && slot.penActive) {
            if (!slot.penMoved && Math.hypot(cx - slot.penStartX, cy - slot.penStartY) > 10) slot.penMoved = true;
            if (slot.penMoved && ptr.mode !== 'curve') {
              paintCurveSpan(slot.penLastStep, slot.penLastE, curStep, curE);
              state.brush.push({ x: cx, y: cy, t: nowMs });
              if (Math.floor(curStep / 4) !== Math.floor(slot.penLastStep / 4)) playClick(0.35, 640 + curE * 1120, 0.03);
              slot.penLastStep = curStep; slot.penLastE = curE;
            }
          } else if (slot.pinched && d > PINCH_OFF) {
            if (slot.penActive && !slot.penMoved && (nowMs - slot.penStartMs) < 380 && ptr.mode !== 'curve') togglePinpointMarker(curveStepOfY(slot.penStartY));
            slot.pinched = false; slot.penActive = false; slot.penMoved = false;
          }
        }
      } else {
        if (!slot.pinched && d < PINCH_ON) slot.pinched = true;
        else if (slot.pinched && d > PINCH_OFF) slot.pinched = false;
      }
    } else {
      slot.active = false;
      if (nowMs - slot.seenAt > 360) { slot.fx.reset(); slot.fy.reset(); slot.pinched = false; slot.fist = false; slot.penActive = false; slot.lms = null; }
    }
  }

  // Left Hand conducts Left-Wing DJ Piston (#30)
  const L = cv.hands.L, R = cv.hands.R;
  if (L.active && ptr.mode !== 'piston' && !state.keysHeld.up && !state.keysHeld.down) {
    state.washResX = lerp(state.washResX, L.nx, 0.22);
    const rawPiston = L.ny < 0.24 ? lerp(-0.46, 0, L.ny / 0.24) : lerp(0, 1.04, (L.ny - 0.24) / 0.72);
    const bothSlam = R.active && R.vyDown > 1.35 && L.vyDown > 1.35;

    if ((L.fist || L.pinched) && (state.pistonMode === 'VACUUM' || rawPiston > 0.76)) {
      if (!state.vacuumLockedByFist) { state.vacuumLockedByFist = true; setBanner('L FIST · VACUUM HOLD LOCK'); }
      setPistonDirect(1.0, false, 0);
    } else if (state.vacuumLockedByFist && !L.fist && !L.pinched) {
      state.vacuumLockedByFist = false; L.slamFlash = 1.0; L.lastSlamAt = nowMs;
      requestDrop(1.0, bothSlam);
    } else if ((state.pistonMode === 'BUILD' || state.pistonMode === 'VACUUM') && state.peakTension >= 0.34 && L.vyDown > 1.45 && (nowMs - L.lastSlamAt) > 650) {
      L.slamFlash = 1.0; L.lastSlamAt = nowMs; if (bothSlam) R.slamFlash = 1.0;
      requestDrop(clamp(0.78 + state.peakTension * 0.22, 0.78, 1.0), bothSlam);
    } else if (state.pistonMode !== 'DROP' || rawPiston > 0.30 || rawPiston < -0.18) {
      if (!(state.pistonMode === 'DROP' && rawPiston < 0.28 && rawPiston > -0.16)) setPistonDirect(rawPiston, false, 0);
    }
  } else if (!L.active && state.vacuumLockedByFist) {
    state.vacuumLockedByFist = false; releasePiston();
  }

  const n = (assigned.L ? 1 : 0) + (assigned.R ? 1 : 0);
  if (n !== cv.handCount) { cv.handCount = n; setCvStatus(`${cv.mode === 'sim' ? 'SIM' : 'CV'} · ${n} HAND${n === 1 ? '' : 'S'}`, true); }
}

function synthHand21(cxM, cyM, side, pinch, fist, tilt, t) {
  const s = side, c = Math.cos(tilt), sn = Math.sin(tilt), p = clamp(pinch, 0, 1), f = clamp(fist, 0, 1);
  const j = (ox, oy) => ({ x: clamp(1 - (cxM + ox * c - oy * sn + Math.sin(t * 65 + ox * 150) * 0.0011), 0, 1), y: clamp(cyM + ox * sn + oy * c + Math.cos(t * 59 + oy * 150) * 0.0011, 0, 1), z: 0 });
  const curl = (yOpen, yClosed) => lerp(yOpen, yClosed, f);
  return [
    j(-s * 0.012, 0.078), j(-s * 0.036, 0.052), j(lerp(-s * 0.062, -s * 0.050, Math.max(p, f)), lerp(0.024, 0.018, Math.max(p, f))),
    j(lerp(-s * 0.078, -s * 0.052, Math.max(p, f)), lerp(-0.004, -0.014, Math.max(p, f))), j(lerp(-s * 0.090, -s * 0.048, Math.max(p, f)), lerp(-0.028, -0.044, Math.max(p, f))),
    j(-s * 0.034, -0.020), j(lerp(-s * 0.044, -s * 0.048, p), curl(-0.062, -0.028)),
    j(lerp(-s * 0.049, -s * 0.052, p), curl(-0.094, -0.006)), j(lerp(-s * 0.052, -s * 0.048, Math.max(p, f)), lerp(curl(-0.122, 0.018), -0.052, p)),
    j(-s * 0.008, -0.026), j(-s * 0.010, curl(-0.072, -0.030)), j(-s * 0.012, curl(-0.106, -0.004)), j(-s * 0.014, curl(-0.136, 0.022)),
    j(s * 0.016, -0.022), j(s * 0.020, curl(-0.066, -0.026)), j(s * 0.023, curl(-0.098, -0.002)), j(s * 0.026, curl(-0.124, 0.024)),
    j(s * 0.038, -0.010), j(s * 0.046, curl(-0.046, -0.016)), j(s * 0.052, curl(-0.072, 0.006)), j(s * 0.057, curl(-0.094, 0.028))
  ];
}

function tickCv(nowMs) {
  if (cv.mode === 'cam' && cv.landmarker && videoEl.readyState >= 2 && videoEl.currentTime !== cv.lastVideoTime) {
    cv.lastVideoTime = videoEl.currentTime;
    const ts = Math.max(cv.lastDetectMs + 1, Math.round(nowMs)); cv.lastDetectMs = ts;
    try { const res = cv.landmarker.detectForVideo(videoEl, ts); processHandFrame(res?.landmarks || [], res?.handedness || [], nowMs); } catch {}
  } else if (cv.mode === 'sim') {
    // 18-second full-studio choreography:
    // 0..3.6s:  R Hand moves into Right Wing -> air-draws rising curve on 4-bar spine!
    // 3.6..8.2s: L Hand lifts DJ Piston into roaring BUILD -> R Hand glides to Center Stage and strikes handpan notes!
    // 8.2..10.2s: L Hand makes FIST VACUUM HOLD -> R Hand pinches a haunting Vacuum Solo note!
    // 10.2..10.75s: BOTH HANDS SLAM DOWN -> SUPER DROP shockwave across the funnel & wall!
    // 10.75..18s: Euphoric DROP groove with live Right Hand handpan pinches!
    const t = (nowMs - cv.simStartMs) / 1000, cyc = t % 18.0;
    let lY = 0.66, lFist = 0, rX = 0.62, rY = 0.50, rPinch = 0;
    if (cyc < 3.6) {
      const u = cyc / 3.6;
      rX = lerp(0.82, 0.94, u); rY = lerp(0.68, 0.30, u); rPinch = 1.0;
      lY = 0.66 + Math.sin(t * 2.0) * 0.02;
    } else if (cyc < 8.2) {
      const u = (cyc - 3.6) / 4.6;
      lY = lerp(0.66, 0.14, Math.pow(u, 1.15));
      rX = 0.56 + 0.14 * Math.sin(t * 1.4); rY = lerp(0.50, 0.24, u);
      const ph = (cyc - 3.8) % 1.4; if (ph < 0.26) rPinch = Math.sin((ph / 0.26) * Math.PI);
    } else if (cyc < 10.2) {
      lY = 0.14; lFist = 1.0; rX = 0.60; rY = 0.26;
      if (cyc > 8.9 && cyc < 9.3) rPinch = Math.sin(((cyc - 8.9) / 0.40) * Math.PI);
    } else if (cyc < 10.75) {
      const u = (cyc - 10.2) / 0.55;
      lY = lerp(0.14, 0.70, Math.pow(u, 0.6)); rY = lerp(0.26, 0.70, Math.pow(u, 0.6)); rX = 0.60; lFist = 0;
    } else {
      lY = 0.66 + Math.sin(t * 3.2) * 0.03; rX = 0.54 + 0.16 * Math.sin(t * 1.1); rY = 0.48 + 0.10 * Math.cos(t * 1.3);
      const ph = (cyc - 11.0) % 1.45; if (ph < 0.28) rPinch = Math.sin((ph / 0.28) * Math.PI);
    }
    const hL = synthHand21(0.20 + 0.06 * Math.sin(t * 0.6), lY, -1, 0, lFist, 0.08 * Math.sin(t), t);
    const hR = synthHand21(rX, rY, 1, rPinch, 0, -0.08 * Math.cos(t), t + 1.4);
    processHandFrame([hL, hR], [[{ categoryName: 'Right' }], [{ categoryName: 'Left' }]], nowMs);
  }
}

// ==================== 7. MULTI-ZONE POINTER, SELECTION (#27), FUNNEL PIN (#37), PISTON (#30), CURVE (#29) ====================
const ptr = {
  mode: null, pid: null, sx: 0, sy: 0, cx: 0, cy: 0, moved: false, shift: false,
  lastY: 0, lastT: 0, lastStep: -1, lastE: 0.46, pinObj: null,
  hoverZone: null, hoverWallAge: -1, hoverWallX: 0, hoverLocus: -1, hoverCurveStep: -1
};

function hitTestZone(x, y) {
  if (Math.abs(x - geo.pistonX) <= 38 && y >= geo.nowY - geo.railUp - 26 && y <= geo.nowY + geo.railDown + 26) return 'piston';
  if (x >= geo.curveX0 - 14 && x <= geo.curveX1 + 14 && y >= geo.nowY - 6 && y <= H - geo.padBot + 14) return 'curve';
  if (x >= geo.wallL - 14 && x <= geo.wallR + 14 && Math.abs(y - geo.nowY) <= 22) return 'now';
  if (x >= geo.wallL - 14 && x <= geo.wallR + 14 && y >= geo.padTop && y < geo.nowY - 14) return 'wall';
  if (y > geo.nowY + 14 && y <= H - geo.padBot) {
    const f = unprojFunnel(x, y);
    if (f && Math.abs(f.wx) <= WALL_PAD_LANES + 0.35 && f.off >= 0.4 && f.off <= FUTURE_STEPS + 1) return 'funnel';
  }
  return null;
}

function finalizeWallSelection(x0, y0, x1, y1, additive) {
  const rx0 = Math.min(x0, x1), rx1 = Math.max(x0, x1), ry0 = Math.min(y0, y1), ry1 = Math.max(y0, y1);
  const matched = [];
  for (const p of state.past) {
    const age = state.playhead - p.step; if (age < 0) continue;
    const pt = projWall(p.locus - 4, age);
    if (pt.x >= rx0 - 10 && pt.x <= rx1 + 10 && pt.y >= ry0 - 10 && pt.y <= ry1 + 10) matched.push(p);
  }
  const nowP = performance.now();
  if (!matched.length) {
    if (!additive) {
      state.groups = []; for (const p of state.past) p.locked = false;
      for (const sl of mem.slots) { sl.pinned *= 0.2; sl.energy *= 0.45; }
      recomputeFuture(1.5); setBanner('MEMORY GROUPS CLEARED');
    }
    return;
  }
  if (!additive) {
    state.groups = [];
    for (const sl of mem.slots) { sl.energy *= 0.25; sl.pinned = 0; sl.sources = []; }
  }
  const gid = state.nextGroupId++, ids = new Set(matched.map(p => p.id));
  state.groups.push({ id: gid, noteIds: ids });
  pulseMemVel(0.55);
  for (const p of matched) {
    p.locked = true; p.flash = 1.0;
    captureSlot(mod16(p.step), p.locus, p.dur, 0.88, 0.86, p.id, nowP, additive, gid);
  }
  syncGroupsToMemory(); recomputeFuture(1.5);
  playClick(0, 1460, 0.055);
  setBanner(`LOCKED G${state.groups.length} (${matched.length} NOTES) → FUNNEL`);
}

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  const x = e.clientX, y = e.clientY, z = hitTestZone(x, y);
  ensureAudio();
  if (e.button === 2 && z === 'funnel') {
    const f = unprojFunnel(x, y); if (!f) return;
    const step = Math.round(state.playhead + f.off);
    state.pinnedFuture = state.pinnedFuture.filter(p => Math.abs(p.step - step) > 1.2);
    state.mutedSteps.add(step); recomputeFuture(1.5); playClick(0, 520, 0.045); setBanner('MUTED FUTURE BEAT'); return;
  }
  if (!z) return;
  canvas.setPointerCapture(e.pointerId);
  ptr.mode = z; ptr.pid = e.pointerId; ptr.sx = ptr.cx = x; ptr.sy = ptr.cy = y; ptr.moved = false; ptr.shift = e.shiftKey;
  if (z === 'piston') {
    if (!state.playing) togglePlay(true);
    ptr.lastY = y; ptr.lastT = performance.now(); setPistonDirect(yToPiston(y), false, 0);
  } else if (z === 'curve') {
    ptr.lastStep = Math.round(curveStepOfY(y)); ptr.lastE = curveEOfX(x);
  } else if (z === 'now') {
    const l = clamp(Math.round((x - geo.cx) / geo.wallGap + 4), 0, 8);
    strikeLiveHandpan(l, 0.92);
  } else if (z === 'funnel') {
    const f = unprojFunnel(x, y); if (!f) return;
    const locus = clamp(Math.round(f.wx + 4), 0, 8), step = Math.max(Math.ceil(state.playhead + 1), Math.round(state.playhead + f.off));
    state.mutedSteps.delete(step);
    state.pinnedFuture = state.pinnedFuture.filter(p => Math.abs(p.step - step) > 0.6 || p.locus !== locus);
    const pin = { id: state.nextId++, step, locus, dur: 2 };
    state.pinnedFuture.push(pin); ptr.pinObj = pin;
    playClick(NOTES[locus].pan, 1280 + locus * 85, 0.05); recomputeFuture(1.5);
    setBanner(`PINNED ${NOTES[locus].name} IN FUNNEL`);
  }
});

canvas.addEventListener('pointermove', (e) => {
  const x = e.clientX, y = e.clientY; ptr.cx = x; ptr.cy = y;
  const z = hitTestZone(x, y); ptr.hoverZone = z;
  ptr.hoverLocus = z === 'now' ? clamp(Math.round((x - geo.cx) / geo.wallGap + 4), 0, 8) : -1;
  ptr.hoverCurveStep = z === 'curve' ? Math.round(curveStepOfY(y)) : -1;
  if (z === 'wall') { const w = unprojWall(x, y); ptr.hoverWallAge = w ? w.age : -1; ptr.hoverWallX = x; } else ptr.hoverWallAge = -1;
  canvas.style.cursor = z === 'piston' ? 'ns-resize' : z === 'wall' ? 'crosshair' : (z === 'curve' || z === 'funnel' || z === 'now') ? 'pointer' : 'default';

  if (ptr.pid !== e.pointerId || !ptr.mode) return;
  if (!ptr.moved && Math.hypot(x - ptr.sx, y - ptr.sy) > 5) ptr.moved = true;
  if (ptr.mode === 'piston') {
    const nowP = performance.now(), vy = (y - ptr.lastY) / Math.max(0.008, (nowP - ptr.lastT) / 1000);
    ptr.lastY = y; ptr.lastT = nowP; setPistonDirect(yToPiston(y), true, vy / 220);
  } else if (ptr.mode === 'curve' && ptr.moved) {
    const s = Math.round(curveStepOfY(y)), val = curveEOfX(x);
    paintCurveSpan(ptr.lastStep, ptr.lastE, s, val);
    state.brush.push({ x: clamp(x, geo.curveX0, geo.curveX1), y: clamp(y, geo.nowY + 2, H - geo.padBot), t: performance.now() });
    if (Math.floor(s / 4) !== Math.floor(ptr.lastStep / 4)) playClick(0.35, 620 + val * 1150, 0.032);
    ptr.lastStep = s; ptr.lastE = val;
  } else if (ptr.mode === 'funnel' && ptr.pinObj && ptr.moved) {
    const f = unprojFunnel(x, y); if (!f) return;
    const endStep = state.playhead + f.off;
    ptr.pinObj.dur = snapDur(clamp(endStep - ptr.pinObj.step, 1, 8));
    recomputeFuture(1.5);
  }
});

const endPtr = (e) => {
  if (ptr.pid !== e.pointerId) return;
  if (ptr.mode === 'piston') releasePiston();
  else if (ptr.mode === 'curve' && !ptr.moved) togglePinpointMarker(curveStepOfY(e.clientY));
  else if (ptr.mode === 'wall') finalizeWallSelection(ptr.sx, ptr.sy, ptr.cx, ptr.cy, ptr.shift);
  ptr.mode = ptr.pid = ptr.pinObj = null;
};
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  state.warp = clamp(state.warp + Math.sign(e.deltaY) * 0.24, 1.0, 4.0);
  state.k = Math.pow(Math.max(1, state.warp) - 1, 1.48) * 0.036;
  setBanner(`PAST LENS · ${state.warp.toFixed(1)}×`);
}, { passive: false });

// Header Buttons & Keyboard Shortcuts
const playBtn = document.getElementById('playBtn'), playLbl = document.getElementById('playLbl');
const phaseHud = document.getElementById('phaseHud'), quantBtn = document.getElementById('quantBtn'), flareBtn = document.getElementById('flareBtn'), bankBtn = document.getElementById('bankBtn');
const stampBtns = [...document.querySelectorAll('#stamps button')];
const updateStampUI = () => { for (const b of stampBtns) b.classList.toggle('on', b.dataset.stamp === state.activeStamp); };

function togglePlay(force = null) {
  const want = force != null ? force : !state.playing;
  if (want === state.playing) return;
  const ctxA = ensureAudio();
  if (want) {
    state.playing = true; state.anchorTime = ctxA.currentTime; state.anchorStep = state.playhead;
    state.nextEdmStep = Math.ceil(state.playhead); for (const n of state.future) n.scheduled = false;
  } else { updatePlayhead(); state.playing = false; silenceContinuous(); }
  playBtn.classList.toggle('on', state.playing); playLbl.textContent = state.playing ? 'PAUSE' : 'PLAY';
}
function toggleQuant() {
  state.quantize = !state.quantize; quantBtn.classList.toggle('on', state.quantize); quantBtn.textContent = state.quantize ? 'SYNC' : 'INST';
  setBanner(state.quantize ? 'DROP · BEAT-SYNC ON' : 'DROP · INSTANT');
}
function cycleFlare() {
  state.flareIdx = (state.flareIdx + 1) % FLARE_PRESETS.length; state.flare = FLARE_PRESETS[state.flareIdx];
  flareBtn.textContent = `${state.flare.toFixed(2)}×`; layout();
  setBanner(`FUNNEL FLARE · ${state.flare.toFixed(2)}×`);
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'q') return toggleQuant();
  if (k === 'f') return cycleFlare();
  if (k === 'w' || e.key === 'ArrowUp') { ensureAudio(); if (!state.playing) togglePlay(true); state.keysHeld.up = true; return; }
  if (k === 's' || e.key === 'ArrowDown') { ensureAudio(); if (!state.playing) togglePlay(true); state.keysHeld.down = true; return; }
  if (k === 'd' || e.key === 'Enter') { e.preventDefault(); requestDrop(0.95, false); return; }
  if (e.key >= '1' && e.key <= '9') strikeLiveHandpan(Number(e.key) - 1, 0.92);
});
window.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if ((k === 'w' || e.key === 'ArrowUp') && state.keysHeld.up) { state.keysHeld.up = false; releasePiston(); }
  else if (k === 's' || e.key === 'ArrowDown') state.keysHeld.down = false;
});

// ==================== 8. UNIFIED 60FPS RENDERER (PISTON | WALL × FUNNEL | CURVE | CV HANDS) ====================
let lastFrameMs = performance.now(), lastSeenStep = -1;
const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
const ring = (x, y, r, fill = false, stroke = true) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); if (fill) ctx.fill(); if (stroke) ctx.stroke(); };

function drawFrame(nowMs) {
  const dt = Math.min(0.05, (nowMs - lastFrameMs) / 1000); lastFrameMs = nowMs;
  if (state.keysHeld.up) setPistonDirect(state.piston + dt * 0.42);
  else if (state.keysHeld.down) setPistonDirect(state.piston - dt * 0.55);

  tickCv(nowMs);
  updatePlayhead(); analyzeTimeline(); stepAdaptiveMemory(dt, nowMs);
  const curInt = Math.floor(state.playhead), effNow = getEffectiveDj(curInt);
  state.livePhase = effNow.phase;

  if (state.playing && curInt !== lastSeenStep) {
    lastSeenStep = curInt; const bs = mod16(curInt);
    if (!effNow.manual && effNow.isDrop) { state.dropFlash = 1.0; state.kickPulse = 1.25; state.shocks.push({ age: 0, maxAge: 1.15, big: true }); }
    else if (effNow.phase === 'drop' && (effNow.halfTime ? (bs === 0 || bs === 10) : bs % 4 === 0)) { state.kickPulse = 0.96; state.shocks.push({ age: 0, maxAge: 0.42, big: false }); }
    else if (effNow.phase === 'groove' && bs % 4 === 0) state.kickPulse = 0.56;
  }

  state.kickPulse *= Math.exp(-dt * 7.5);
  state.dropFlash = Math.max(0, state.dropFlash - dt / 0.85);
  state.bannerAlpha = Math.max(0, state.bannerAlpha - dt * 0.68);
  for (let i = 0; i < 9; i++) { state.locusGlow[i] *= Math.exp(-dt * 4.8); if (state.locusHeat[i] > 0) state.locusHeat[i] = Math.max(0, state.locusHeat[i] - dt / (FLASH_MS / 1000)); }
  for (let i = state.ripples.length - 1; i >= 0; i--) { const r = state.ripples[i]; r.age += dt; if (r.heat > 0) r.heat = Math.max(0, r.heat - dt / 0.7); if (r.age >= r.maxAge) state.ripples.splice(i, 1); }
  for (let i = state.shocks.length - 1; i >= 0; i--) { state.shocks[i].age += dt; if (state.shocks[i].age >= state.shocks[i].maxAge) state.shocks.splice(i, 1); }
  for (let i = state.sympArcs.length - 1; i >= 0; i--) if (nowMs - state.sympArcs[i].bornPerf > state.sympArcs[i].lifeMs) state.sympArcs.splice(i, 1);
  for (const p of state.past) { if (p.flash > 0) p.flash = Math.max(0, p.flash - dt / 0.5); if (p.symp > 0) p.symp = Math.max(0, p.symp * Math.exp(-dt * 2.2)); }
  while (state.brush.length && nowMs - state.brush[0].t > 500) state.brush.shift();
  for (const h of [cv.hands.L, cv.hands.R]) { h.fade = clamp(h.fade + (h.active ? dt * 6.5 : -dt * 3.8), 0, 1); h.pinchFlash = Math.max(0, h.pinchFlash - dt * 3.0); h.slamFlash = Math.max(0, h.slamFlash - dt * 2.6); }

  const barNum = String(Math.floor(state.playhead / 16) + 1).padStart(2, '0'), beatNum = (Math.floor(state.playhead / 4) % 4) + 1;
  const tag = effNow.manual ? (state.pistonMode === 'VACUUM' ? 'VACUUM' : state.pistonMode) : effNow.phase.toUpperCase();
  phaseHud.textContent = `40 · ${tag} · ${barNum}.${beatNum} · ${BPM}`;
  phaseHud.classList.toggle('hot', tag === 'BUILD' || tag === 'DROP' || tag === 'VACUUM' || state.dropFlash > 0.1);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.font = '9.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textBaseline = 'middle';

  drawStageArchitecture(effNow);
  drawAttentionAndSympArcs(nowMs);
  drawPastWallNotes();
  drawFunnelFutureNotes();
  drawNowFoldHinge(effNow);
  drawLeftPiston(effNow);
  drawRightCurve(nowMs);
  drawCvOverlays();

  // Marquee selection box on Straight Past Wall (#27)
  if (ptr.mode === 'wall' && ptr.moved) {
    const x0 = Math.min(ptr.sx, ptr.cx), y0 = Math.min(ptr.sy, ptr.cy), w = Math.abs(ptr.cx - ptr.sx), h = Math.abs(ptr.cy - ptr.sy);
    ctx.fillStyle = 'rgba(255,90,31,0.08)'; ctx.fillRect(x0, y0, w, h);
    ctx.strokeStyle = 'rgba(255,90,31,0.82)'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]); ctx.strokeRect(x0 + 0.5, y0 + 0.5, w, h); ctx.setLineDash([]);
  }

  if (state.bannerAlpha > 0.02 && state.bannerText) {
    ctx.font = '10px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,90,31,${(state.bannerAlpha * 0.92).toFixed(3)})`;
    ctx.fillText(state.bannerText, geo.cx, geo.padTop + 10);
  }
  requestAnimationFrame(drawFrame);
}

// 1. STRAIGHT VERTICAL PAST WALL + PSEUDO-PERSPECTIVE FUTURE FUNNEL ARCHITECTURE (#37)
function drawStageArchitecture(effNow) {
  const heat = effNow.phase === 'build' ? effNow.buildHeat : Math.max(state.dropFlash, effNow.phase === 'drop' ? 0.35 : 0);

  // Subtle architectural cast-crease shading on the funnel floor right beneath NOW
  const gFloor = ctx.createLinearGradient(0, geo.nowY, 0, geo.nowY + geo.frontH);
  gFloor.addColorStop(0, 'rgba(255,255,255,0.045)');
  gFloor.addColorStop(0.22, 'rgba(255,255,255,0.015)');
  gFloor.addColorStop(1, 'rgba(255,255,255,0.002)');
  ctx.fillStyle = gFloor;
  ctx.beginPath();
  ctx.moveTo(geo.wallL, geo.nowY); ctx.lineTo(geo.wallR, geo.nowY);
  ctx.lineTo(geo.frontR, H - geo.padBot); ctx.lineTo(geo.frontL, H - geo.padBot);
  ctx.closePath(); ctx.fill();

  // Outer silhouette boundaries: STRAIGHT UP on Past Wall, STRAIGHT FLARING RAILS on Future Funnel!
  ctx.strokeStyle = mixInk(heat * 0.5, 0.24); ctx.lineWidth = 1;
  line(geo.wallL, geo.padTop, geo.wallL, geo.nowY);
  line(geo.wallR, geo.padTop, geo.wallR, geo.nowY);
  line(geo.wallL, geo.nowY, geo.frontL, H - geo.padBot);
  line(geo.wallR, geo.nowY, geo.frontR, H - geo.padBot);

  // 9 Musical Lanes: Strictly parallel vertical UP the wall, converging perspective rails UP the funnel!
  for (let i = 0; i < 9; i++) {
    const wx = i - 4, topP = projWall(wx, 0), botP = projFunnel(wx, FUTURE_STEPS), isRoot = i === 0 || i === 4;
    ctx.strokeStyle = isRoot ? 'rgba(255,255,255,0.11)' : 'rgba(255,255,255,0.045)'; ctx.lineWidth = 1;
    line(topP.x, geo.padTop, topP.x, geo.nowY);
    ctx.strokeStyle = isRoot ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.055)';
    line(topP.x, geo.nowY, botP.x, botP.y);
  }

  // Logarithmic Past Bar Ruler on the Straight Vertical Wall (#27)
  ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'right';
  for (const bars of RULER_BARS) {
    const y = wallY(bars * 16); if (y < geo.padTop + 6 || y > geo.nowY - 12) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
    line(geo.wallL, y, geo.wallR, y);
    ctx.fillStyle = 'rgba(255,255,255,0.24)'; ctx.fillText(`-${bars}B`, geo.wallL - 6, y);
  }

  // Perspective Future Beat & Bar Cross-Bars marching UP the funnel toward NOW!
  const firstBeat = Math.ceil(state.playhead / 4) * 4;
  for (let s = firstBeat; s <= state.playhead + FUTURE_STEPS; s += 4) {
    const off = s - state.playhead; if (off < 0.25) continue;
    const isBar = mod16(s) === 0, pL = projFunnel(-WALL_PAD_LANES, off), pR = projFunnel(WALL_PAD_LANES, off);
    const info = getInfo(s);
    ctx.strokeStyle = info.isDrop ? 'rgba(255,90,31,0.52)' : isBar ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.042)';
    ctx.lineWidth = info.isDrop ? 1.4 : 1;
    line(pL.x, pL.y, pR.x, pR.y);
  }

  // Corner stage tags
  ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.textAlign = 'left'; ctx.fillText(`PAST WALL ↑ · LENS ${state.warp.toFixed(1)}× · DRAG SELECT`, geo.wallL + 4, geo.padTop - 4);
  ctx.fillText(`↓ FUTURE FUNNEL (${state.flare.toFixed(2)}×) · CLICK PIN · RMB MUTE`, geo.frontL + 4, H - geo.padBot + 12);
}

// 2. LUMINOUS WALL-TO-FUNNEL ATTENTION ARCS + SYMPATHETIC RESONANCE (#27 × #37)
function drawAttentionAndSympArcs(nowMs) {
  const pastById = new Map(); for (const p of state.past) pastById.set(p.id, p);

  // Attention arcs linking selected/remembered vertical wall notes into future funnel predictions!
  for (const n of state.future) {
    if (!n.attn || !n.attn.pastId) continue;
    const src = pastById.get(n.attn.pastId); if (!src) continue;
    const age = state.playhead - src.step, off = n.step - state.playhead;
    if (age < 0 || off < 0 || off > FUTURE_STEPS) continue;
    const pA = projWall(src.locus - 4, age), pB = projFunnel(n.locus - 4, off);
    if (pA.y < geo.padTop) continue;
    const a = clamp(n.attn.weight * (1 - off / FUTURE_STEPS) * 0.44, 0.06, 0.46);
    ctx.strokeStyle = mixInk(n.attn.locked ? 0.92 : 0.2, a);
    ctx.lineWidth = n.attn.locked ? 1.15 : 0.8;
    const bend = (pA.x + pB.x) * 0.5 + (pA.x < geo.cx ? -26 : 26);
    ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.quadraticCurveTo(bend, geo.nowY, pB.x, pB.y); ctx.stroke();
  }

  // Sympathetic resonance arcs from live strikes up the straight vertical wall
  for (const arc of state.sympArcs) {
    const u = (nowMs - arc.bornPerf) / arc.lifeMs; if (u >= 1) continue;
    const age = state.playhead - arc.past.step; if (age < 0.1) continue;
    const pB = projWall(arc.past.locus - 4, age); if (pB.y < geo.padTop) continue;
    const x0 = geo.locusX[arc.fromIdx], a = (1 - u) * arc.bond * 0.42;
    ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`; ctx.lineWidth = 0.85;
    ctx.beginPath(); ctx.moveTo(x0, geo.nowY); ctx.quadraticCurveTo((x0 + pB.x) * 0.5 + (x0 < pB.x ? -16 : 16), (geo.nowY + pB.y) * 0.5, pB.x, pB.y); ctx.stroke();
  }
}

// 3. STRAIGHT PAST WALL NOTES + MULTI-GROUP BRACKETS + HOVER MICRO-LENS (#27)
function drawPastWallNotes() {
  for (const p of state.past) {
    const age = state.playhead - p.step; if (age < 0) continue;
    const pt = projWall(p.locus - 4, age); if (pt.y < geo.padTop - 6 || pt.y > geo.nowY + 2) continue;
    const ageEnd = Math.max(0, age - p.dur), ptEnd = projWall(p.locus - 4, ageEnd);
    const fade = clamp(1 - Math.log(1 + age / 14) / Math.log(22), 0.16, 0.94);
    const heat = Math.max(p.flash || 0, p.locked ? 0.92 : 0);

    // Micro-lens hover magnification on dense upper past wall!
    let mag = 1;
    if (ptr.hoverWallAge > 0 && Math.abs(pt.y - ptr.cy) < 42) mag = 1 + (1 - Math.abs(pt.y - ptr.cy) / 42) * 0.45;
    if (ptEnd.y > pt.y + 1.5) {
      ctx.strokeStyle = mixInk(heat, fade * 0.48); ctx.lineWidth = p.locked ? 1.45 : 1.0;
      line(pt.x, pt.y, pt.x, Math.min(geo.nowY, ptEnd.y));
    }
    const r = (2.0 + Math.sqrt(p.dur) * 0.78) * mag;
    ctx.fillStyle = mixInk(heat, fade); ring(pt.x, pt.y, r, true, false);
    if (p.locked || p.symp > 0.25) {
      ctx.strokeStyle = mixInk(p.locked ? 0.95 : 0, (p.locked ? 0.72 : p.symp * 0.65) * fade); ctx.lineWidth = 0.95;
      ring(pt.x, pt.y, r + 3.4, false, true);
    }
  }

  // Group bounding brackets (G1, G2...) on Straight Vertical Past Wall!
  state.groups.forEach((g, gi) => {
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, cnt = 0;
    for (const p of state.past) {
      if (!g.noteIds.has(p.id)) continue;
      const age = state.playhead - p.step; if (age < 0) continue;
      const pt = projWall(p.locus - 4, age); if (pt.y < geo.padTop) continue;
      minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x); minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y); cnt++;
    }
    if (!cnt) return;
    ctx.strokeStyle = 'rgba(255,90,31,0.52)'; ctx.lineWidth = 1;
    ctx.strokeRect(minX - 9, minY - 8, (maxX - minX) + 18, (maxY - minY) + 16);
    ctx.fillStyle = 'rgba(255,90,31,0.88)'; ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'left';
    ctx.fillText(`G${gi + 1}`, minX - 8, minY - 12);
  });
}

// 4. PSEUDO-PERSPECTIVE FUNNEL FUTURE NOTES (SCALING WITH PERSPECTIVE S!)
function drawFunnelFutureNotes() {
  for (const n of state.future) {
    const off = n.step - state.playhead; if (off < 0 || off > FUTURE_STEPS) continue;
    const p0 = projFunnel(n.locus - 4, off), p1 = projFunnel(n.locus - 4, Math.min(FUTURE_STEPS, off + n.dur));
    const prox = clamp(1 - off / FUTURE_STEPS, 0, 1), info = getInfo(n.step);
    const heat = n.dropNote || n.pinned ? 1.0 : info.phase === 'build' ? info.buildHeat * 0.85 : (n.attn?.locked ? 0.72 : 0);
    const sa = 0.28 + prox * 0.68, rad = (2.4 + Math.sqrt(n.dur) * 1.15) * lerp(0.88, 1.32, (p0.scale - 1) / Math.max(0.2, state.flare - 1));

    if (p1.y > p0.y + rad) {
      ctx.strokeStyle = mixInk(heat, sa * 0.45); ctx.lineWidth = 0.9 * p0.scale * 0.78;
      line(p0.x, p0.y + rad * 0.8, p1.x, p1.y);
    }
    if (n.pinned) {
      // Crisp perspective-scaled Diamond Pin for user-planted funnel notes!
      ctx.fillStyle = `rgba(255,90,31,${(0.32 + prox * 0.35).toFixed(3)})`;
      ctx.strokeStyle = `rgba(255,90,31,${sa.toFixed(3)})`; ctx.lineWidth = 1.45;
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y - rad * 1.15); ctx.lineTo(p0.x + rad * 1.15, p0.y);
      ctx.lineTo(p0.x, p0.y + rad * 1.15); ctx.lineTo(p0.x - rad * 1.15, p0.y); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = mixInk(heat, n.dropNote ? 0.40 : n.whisper ? 0.04 : 0.07 + heat * 0.16);
      ctx.strokeStyle = mixInk(heat, n.whisper ? sa * 0.62 : sa); ctx.lineWidth = n.dropNote ? 1.6 : 1.05;
      ring(p0.x, p0.y, rad, true, true);
      if (n.dropNote) { ctx.strokeStyle = `rgba(255,90,31,${(sa * 0.58).toFixed(3)})`; ctx.lineWidth = 0.95; ring(p0.x, p0.y, rad + 4.5); }
    }
  }
}

// 5. ARCHITECTURAL 90° NOW FOLD HINGE + INTERFEROMETER + 9 STRIKE LOCI
function drawNowFoldHinge(effNow) {
  const kp = state.kickPulse, df = state.dropFlash;
  const lineHeat = Math.max(df, effNow.phase === 'build' ? effNow.buildHeat * 0.78 : effNow.phase === 'silence' ? 0.55 : 0);

  // Resonant ripples radiating along the NOW crease
  for (const r of state.ripples) {
    const cx = geo.locusX[r.locus], u = clamp(r.age / r.maxAge, 0, 1);
    ctx.strokeStyle = mixInk(r.heat, Math.pow(1 - u, 1.4) * (0.60 + r.vel * 0.26)); ctx.lineWidth = 1.2 - u * 0.45;
    ring(cx, geo.nowY, 4 + (1 - Math.pow(1 - u, 2.1)) * r.maxR);
  }

  // Drop shockwaves propagating up the straight wall and down the funnel!
  for (const sh of state.shocks) {
    const u = clamp(sh.age / sh.maxAge, 0, 1), a = Math.pow(1 - u, 1.5) * (sh.big ? 0.85 : 0.26), dy = u * (sh.big ? 135 : 30);
    ctx.strokeStyle = sh.big ? `rgba(255,90,31,${a.toFixed(3)})` : `rgba(255,255,255,${a.toFixed(3)})`;
    ctx.lineWidth = sh.big ? 2.0 * (1 - u * 0.5) : 0.9;
    line(geo.wallL, geo.nowY - dy, geo.wallR, geo.nowY - dy);
    const q = clamp(dy / geo.frontH, 0, 1), S = 1 + (state.flare - 1) * q;
    line(geo.cx - geo.wallHalfW * S, geo.nowY + dy, geo.cx + geo.wallHalfW * S, geo.nowY + dy);
  }

  // Kick-breathing hinge line
  ctx.strokeStyle = mixInk(lineHeat, effNow.phase === 'silence' ? 0.34 : 0.72 + kp * 0.26); ctx.lineWidth = 1.15 + df * 1.25;
  ctx.beginPath();
  if (kp > 0.03) {
    for (let i = 0; i <= 40; i++) {
      const u = i / 40, wave = Math.sin(u * Math.PI * 6 + state.playhead * 1.9) * Math.sin(u * Math.PI) * kp * 4.8;
      i === 0 ? ctx.moveTo(lerp(geo.wallL - 8, geo.wallR + 8, u), geo.nowY + wave) : ctx.lineTo(lerp(geo.wallL - 8, geo.wallR + 8, u), geo.nowY + wave);
    }
  } else { ctx.moveTo(geo.wallL - 8, geo.nowY); ctx.lineTo(geo.wallR + 8, geo.nowY); }
  ctx.stroke();

  const rAim = (cv.hands.R.active && cv.hands.R.zone === 'pan') ? clamp(Math.round((cv.hands.R.nx / 0.64) * 8), 0, 8) : -1;
  for (let i = 0; i < 9; i++) {
    const sx = geo.locusX[i], glow = state.locusGlow[i], heat = Math.max(state.locusHeat[i], df * 0.72, rAim === i ? 0.9 : 0);
    const hov = ptr.hoverLocus === i || rAim === i, isRoot = i === 0 || i === 4, th = (isRoot ? 6.5 : 4.5) + glow * 3.2 + kp * (isRoot ? 2.2 : 0.8);
    ctx.strokeStyle = mixInk(heat, hov ? 0.98 : 0.46 + glow * 0.52); ctx.lineWidth = glow > 0.14 || hov ? 1.5 : 1;
    line(sx, geo.nowY - th, sx, geo.nowY + th);
    if (glow > 0.08 || hov) { ctx.fillStyle = mixInk(heat, clamp(glow + (hov ? 0.48 : 0), 0, 1)); ring(sx, geo.nowY, 2.2 + glow * 2.4, true, false); }
    ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = mixInk(heat, hov || glow > 0.18 ? 0.94 : isRoot ? 0.46 : 0.26); ctx.fillText(NOTES[i].name, sx, geo.nowY - th - 7);
  }
}

// 6. LEFT WING: LIVE DJ DROP CONDUCTOR PISTON (#30)
function drawLeftPiston(effNow) {
  const px = geo.pistonX, yTop = geo.nowY - geo.railUp, yBot = geo.nowY + geo.railDown;
  const yVac = pistonToY(VAC_THRESH), yStrip = pistonToY(STRIP_THRESH), pY = pistonToY(state.piston);
  const manualHot = state.pistonMode === 'BUILD' || state.pistonMode === 'VACUUM' || state.pistonMode === 'DROP';
  const heat = state.pistonMode === 'VACUUM' ? 1.0 : state.pistonMode === 'BUILD' ? clamp(state.piston / VAC_THRESH, 0.2, 1) : state.dropFlash;

  // Spine & zone ticks
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1; line(px, yTop, px, yBot);
  ctx.strokeStyle = 'rgba(255,90,31,0.48)'; line(px - 10, yVac, px + 10, yVac);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; line(px - 12, geo.nowY, px + 12, geo.nowY);
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; line(px - 8, yStrip, px + 8, yStrip);

  // Active energy fill bar along piston rail
  if (Math.abs(state.piston) > 0.02) {
    ctx.strokeStyle = mixInk(state.piston > 0 ? heat : 0, state.piston > 0 ? 0.85 : 0.45);
    ctx.lineWidth = 2.6; line(px, geo.nowY, px, pY);
  }

  // Snare subdivision ruler ticks along BUILD region
  for (const [lvl, lbl] of [[0.22, '1/4'], [0.46, '1/8'], [0.68, '1/16'], [0.84, '1/32']]) {
    const ty = pistonToY(lvl), lit = state.piston >= lvl && state.pistonMode === 'BUILD';
    ctx.strokeStyle = lit ? 'rgba(255,90,31,0.88)' : 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
    line(px + 5, ty, px + 11, ty);
    ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'left';
    ctx.fillStyle = lit ? '#ff5a1f' : 'rgba(255,255,255,0.24)'; ctx.fillText(lbl, px + 14, ty);
  }

  // Piston puck
  ctx.fillStyle = manualHot ? mixInk(heat, 0.92) : '#000';
  ctx.strokeStyle = mixInk(heat, manualHot ? 1.0 : 0.65); ctx.lineWidth = 1.6;
  ring(px, pY, 7.5 + (state.pistonMode === 'VACUUM' ? 2.5 : 0), true, true);
  if (state.vacuumLockedByFist) {
    ctx.strokeStyle = 'rgba(255,90,31,0.78)'; ctx.lineWidth = 1; ring(px, pY, 14, false, true);
  }

  // Labels
  ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = state.pistonMode === 'VACUUM' ? '#ff5a1f' : 'rgba(255,255,255,0.34)'; ctx.fillText('VACUUM ↑', px, yTop - 12);
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillText('STRIP ↓', px, yBot + 12);
  ctx.fillStyle = manualHot ? '#ff5a1f' : 'rgba(255,255,255,0.44)';
  ctx.fillText(effNow.manual ? state.pistonMode : 'CURVE AUTO', px, yTop - 24);
}

// 7. RIGHT WING: 4-BAR EMOTIONAL CURVE SPINE (#29)
function drawRightCurve(nowMs) {
  const x0 = geo.curveX0, x1 = geo.curveX1, gx = Math.round(curveXOfE(0.46)) + 0.5;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; line(x0 + 0.5, geo.padTop, x0 + 0.5, H - geo.padBot);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.setLineDash([2, 5]); line(gx, geo.padTop, gx, H - geo.padBot); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; line(x1 - 0.5, geo.padTop, x1 - 0.5, H - geo.padBot);
  ctx.strokeStyle = 'rgba(255,255,255,0.34)'; line(x0, geo.nowY, x1, geo.nowY);

  ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.fillStyle = 'rgba(255,255,255,0.24)';
  ctx.textAlign = 'left'; ctx.fillText('CURVE · 4 BARS', x0 + 2, geo.padTop - 4);
  ctx.fillText('SIL', x0 + 2, H - geo.padBot + 12);
  ctx.textAlign = 'center'; ctx.fillText('GRV', gx, H - geo.padBot + 12);
  ctx.textAlign = 'right'; ctx.fillText('MAX', x1 - 2, H - geo.padBot + 12);

  const pts = [];
  const lo = Math.floor(state.playhead) - 44, hi = Math.ceil(state.playhead) + CURVE_STEPS;
  for (let s = lo; s <= hi; s++) {
    const y = curveYOfStep(s); if (y < geo.padTop - 4 || y > H - geo.padBot + 4) continue;
    const info = getInfo(s); pts.push({ s, y: clamp(y, geo.padTop, H - geo.padBot), x: curveXOfE(info.E), info });
  }
  if (pts.length > 1) {
    const grad = ctx.createLinearGradient(x0, 0, x1, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0.015)'); grad.addColorStop(0.55, 'rgba(255,255,255,0.06)'); grad.addColorStop(1, 'rgba(255,90,31,0.16)');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(x0, pts[0].y);
    for (const p of pts) ctx.lineTo(p.x, p.y);
    ctx.lineTo(x0, pts[pts.length - 1].y); ctx.closePath(); ctx.fill();
  }
  for (const { s, y, x, info } of pts) {
    const isPast = s < state.playhead, pf = isPast ? clamp(1 - (state.playhead - s) / 40, 0.14, 0.72) : 1.0;
    if (info.isSilenceStart || info.marker?.type === 'silence') {
      ctx.strokeStyle = `rgba(255,255,255,${(0.75 * pf).toFixed(3)})`; ctx.lineWidth = 1.1; ring(x0 + 10, y, 3.6);
      ctx.fillStyle = `rgba(255,255,255,${(0.68 * pf).toFixed(3)})`; ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'left'; ctx.fillText('SIL', x0 + 17, y);
    }
    if (info.isDrop) {
      ctx.strokeStyle = `rgba(255,90,31,${(0.92 * pf).toFixed(3)})`; ctx.lineWidth = 1.4; line(x0, y, x1, y);
      ctx.fillStyle = `rgba(255,90,31,${(0.96 * pf).toFixed(3)})`; ctx.font = '8.5px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'right';
      ctx.fillText(info.halfTime ? '▼ HALF' : '▼ DROP', x1 - 3, y - 6);
    }
  }
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], isPast = b.s < state.playhead;
    const heat = b.info.phase === 'build' ? b.info.buildHeat : b.info.phase === 'drop' ? 0.85 : 0;
    ctx.strokeStyle = mixInk(heat, isPast ? clamp(1 - (state.playhead - b.s) / 40, 0.16, 0.72) : (b.info.phase === 'silence' ? 0.34 : 0.90));
    ctx.lineWidth = isPast ? 1.1 : (b.info.phase === 'build' || b.info.phase === 'drop' ? 2.0 : 1.4);
    line(a.x, a.y, b.x, b.y);
  }
  if (state.brush.length > 1) {
    ctx.lineCap = 'round';
    for (let i = 1; i < state.brush.length; i++) {
      const a = state.brush[i - 1], b = state.brush[i]; if (b.t - a.t > 140) continue;
      const life = clamp(1 - (nowMs - b.t) / 500, 0, 1);
      ctx.strokeStyle = `rgba(255,90,31,${(life * 0.94).toFixed(3)})`; ctx.lineWidth = 1.8 + life * 2.2; line(a.x, a.y, b.x, b.y);
    }
  }
  // NOW curve energy bead
  const curE = lerp(getCurveRaw(Math.floor(state.playhead)), getCurveRaw(Math.ceil(state.playhead)), state.playhead - Math.floor(state.playhead));
  ctx.fillStyle = mixInk(state.dropFlash, 0.96); ring(curveXOfE(curE), geo.nowY, 3.4 + state.kickPulse * 1.8, true, false);
}

// 8. 21-POINT MEDIAPIPE HAND WIREFRAMES & TETHERS (#31)
function drawSkeleton(slot, ax, ay, scalePx, hot) {
  const f = slot.fade, pts = slot.lms.map(p => [ax + (p.x - slot.rawCx) * scalePx, ay + (p.y - slot.rawCy) * scalePx]);
  ctx.fillStyle = mixInk(hot, 0.045 * f); ctx.beginPath();
  PALM_IDX.forEach((idx, i) => i === 0 ? ctx.moveTo(pts[idx][0], pts[idx][1]) : ctx.lineTo(pts[idx][0], pts[idx][1]));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = mixInk(hot, (0.28 + hot * 0.48) * f); ctx.lineWidth = 1.1; ctx.beginPath();
  for (const [a, b] of HAND_BONES) { ctx.moveTo(pts[a][0], pts[a][1]); ctx.lineTo(pts[b][0], pts[b][1]); }
  ctx.stroke();
  for (let i = 0; i < 21; i++) {
    const isTip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
    ctx.fillStyle = mixInk(i === 4 || i === 8 ? Math.max(hot, slot.pinchProx) : hot, (isTip ? 0.80 : 0.34) * f);
    ring(pts[i][0], pts[i][1], isTip ? 2.0 : 1.1, true, false);
  }
  return pts;
}

function drawCvOverlays() {
  const L = cv.hands.L, R = cv.hands.R, skScale = clamp(Math.min(W, H) * 0.36, 130, 225);
  if (L.lms && L.fade > 0.01) {
    const f = L.fade, pY = pistonToY(state.piston), hx = geo.pistonX + 52, hy = clamp(pY, geo.padTop + 42, H - geo.padBot - 42);
    const hot = Math.max(L.fistAmt, L.slamFlash, state.pistonMode === 'BUILD' || state.pistonMode === 'VACUUM' ? 0.82 : 0);
    ctx.strokeStyle = mixInk(hot, (0.28 + hot * 0.48) * f); ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
    line(geo.pistonX, pY, hx, hy); ctx.setLineDash([]);
    drawSkeleton(L, hx, hy, skScale, hot);
    ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = mixInk(hot, 0.84 * f);
    ctx.fillText(L.fist ? 'L · FIST VACUUM' : 'L · DJ PISTON', hx, hy + 38);
  }
  if (R.lms && R.fade > 0.01) {
    const f = R.fade, hot = R.pinched ? 1.0 : Math.max(R.pinchProx * 0.85, R.pinchFlash, R.slamFlash);
    if (R.zone === 'curve') {
      const curveU = clamp((R.nx - 0.64) / 0.36, 0, 1);
      const px = lerp(geo.curveX0, geo.curveX1, curveU), py = lerp(H - geo.padBot - 4, geo.nowY + 8, R.ny);
      ctx.strokeStyle = mixInk(hot, 0.94 * f); ctx.lineWidth = R.pinched ? 1.8 : 1.1;
      ring(px, py, R.pinched ? 7 : 10 - R.pinchProx * 3, false, true);
      if (R.pinched) { ctx.fillStyle = `rgba(255,90,31,${(0.95 * f).toFixed(3)})`; ring(px, py, 2.8, true, false); }
      const skX = clamp(px - 44, geo.wallR + 18, W - 40), skY = clamp(py - 18, geo.padTop + 40, H - geo.padBot - 36);
      const pts = drawSkeleton(R, skX, skY, skScale * 0.85, hot);
      ctx.strokeStyle = mixInk(hot, (0.32 + hot * 0.52) * f); ctx.lineWidth = 1; line(pts[8][0], pts[8][1], px, py);
      ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'right';
      ctx.fillStyle = mixInk(hot, 0.90 * f); ctx.fillText(R.pinched ? 'R · AIR-PEN' : 'R · CURVE AIM', px - 10, py - 9);
    } else {
      const aim = clamp(Math.round((R.nx / 0.64) * 8), 0, 8), tx = geo.locusX[aim];
      const hx = lerp(geo.wallL + 16, geo.wallR - 16, clamp(R.nx / 0.64, 0, 1)), hy = clamp(lerp(H - geo.padBot - 44, geo.padTop + 44, R.ny), geo.padTop + 42, H - geo.padBot - 42);
      ctx.strokeStyle = mixInk(hot, (0.24 + hot * 0.48) * f); ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
      line(hx, hy, tx, geo.nowY); ctx.setLineDash([]);
      ctx.strokeStyle = mixInk(hot, 0.88 * f); ctx.lineWidth = 1.3; ring(tx, geo.nowY, 8 + R.pinchFlash * 7, false, true);
      drawSkeleton(R, hx, hy, skScale * 0.92, hot);
      ctx.font = '8px ui-monospace, "SF Mono", Menlo, monospace'; ctx.textAlign = 'center';
      ctx.fillStyle = mixInk(hot, 0.84 * f); ctx.fillText(`R · ${NOTES[aim].name}`, hx, hy + 38);
    }
  }
}

seedOpeningStudio();
requestAnimationFrame(drawFrame);
</script>
