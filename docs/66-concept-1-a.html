<style>

<canvas id="c"></canvas>
<header>
  <span class="hint">66 · 1A · SPACE play · press-drag in future = pie (direction=type, distance=intensity) · drag cue = move · wheel = intensity · right-click/⌫ = delete · hold W = build · ←/→ drop flavor · J = tap</span>

<script>
// ===================== 66 SHARED CORE (audio · clock · theory) =====================
// E Kurd / Amara 9-tone pan, i–VI–VII–i one-bar harmonic cycle (#41), 16-step bars.
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const hash01 = (a, b = 0, c = 0) => {
  let x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 2147483647)) | 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296;

// lane index 0..8 ; KEYS[i] plays lane i (home row)
const NOTES = [['E3', -17], ['B3', -10], ['C4', -9], ['D4', -7], ['E4', -5], ['F#4', -3], ['G4', -2], ['A4', 0], ['B4', 2]]

const KEYS = 'asdfghjkl';
// one chord per bar; pool = lanes that sound "right" in that bar; bassHz = sub root
const PROG = [
  { sym: 'i', pool: [0, 1, 4, 6, 8], bassHz: semiHz(-29) },
  { sym: 'VI', pool: [2, 4, 6, 8, 1], bassHz: semiHz(-33) },
  { sym: 'VII', pool: [3, 5, 7, 8, 1], bassHz: semiHz(-31) },
  { sym: 'i', pool: [0, 1, 4, 6, 5], bassHz: semiHz(-29) },

const chordAt = (bar) => PROG[mod(bar, PROG.length)];
// #41 metric weight per 16th: strong downbeats, strong "a" pickups (3,7,11,15), weak "e"

// ----------------------------- AUDIO -----------------------------
const Audio = (() => {
  let ctx = null, master, bus, hpf, lpf, dry, revSend, revOut, noise, riserBP, riserG, ui;

  return {
    ensure, get ctx() { return ctx; }, now: () => (ctx ? ctx.currentTime : 0),
    // handpan strike: lane 0..8, vel 0..1, durSteps controls ring length, octave shifts up 1 octave
    pan(lane, when, vel = .8, durSteps = 4, octave = 0) {
      ensure(); const n = NOTES[lane]; if (!n) return; const t = T(when), v = clamp(vel, .05, 1), f = n.freq * (octave ? 2 : 1);
      const tau = clamp(.25 + durSteps * .22, .3, 2.4) * (lane === 0 ? 1.2 : 1);
      const out = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = n.pan; out.connect(p); p.connect(bus);
      const g = env(t, .004, .26 * v, tau); g.connect(out); osc('sine', f, t, tau, g); osc('sine', f + .7, t, tau, g);
      const h2 = env(t, .02, .12 * v, tau * .6); h2.connect(out); osc('sine', f * 2.001, t, tau * .6, h2);
      const h3 = env(t, .03, .07 * v, tau * .45); h3.connect(out); osc('sine', f * 2.998, t, tau * .45, h3);

    kick(when, v = .8) { ensure(); const t = T(when), g = env(t, .003, .7 * v, .3); g.connect(bus); const o = osc('sine', 130, t, .32, g); o.frequency.exponentialRampToValueAtTime(42, t + .12); },
    hat(when, v = .4, open = false) { ensure(); noiseHit(T(when), 'highpass', open ? 6000 : 7500, .8, .12 * v, open ? .16 : .035); },
    tak(when, v = .6) { ensure(); const t = T(when); noiseHit(t, 'bandpass', 2400, 1.6, .26 * v, .07); const g = env(t, .002, .15 * v, .06); g.connect(bus); osc('triangle', 300, t, .06, g); },
    sub(when, hz, durSec, v = .45) { ensure(); const t = T(when), g = env(t, .015, v, Math.max(.1, durSec)), lp = filt('lowpass', 220, 1); lp.connect(g); g.connect(bus); osc('sine', hz, t, durSec, lp); osc('triangle', hz * 2, t, durSec, lp); },
    impact(when, v = 1) { ensure(); const t = T(when), g = env(t, .004, .8 * v, 1.4); g.connect(master); const o = osc('sine', 120, t, 1.4, g); o.frequency.exponentialRampToValueAtTime(41, t + .1); noiseHit(t, 'lowpass', 3000, .7, .3 * v, 1.6, master); },
    // UI detent click (haptic-ish); pitch 0.5..2
    click(pitch = 1, strong = false) { if (!ctx) return; noiseHit(ctx.currentTime + .001, 'bandpass', 2200 * pitch, 5, strong ? .25 : .12, strong ? .025 : .012, ui); },
    // continuous macro controls (0..1), smoothed
    setRiser(x) { if (!ctx) return; const t = ctx.currentTime; riserG.gain.setTargetAtTime(Math.max(.0001, Math.pow(x, 1.5) * .22), t, .04); riserBP.frequency.setTargetAtTime(300 + x * 4500, t, .04); },
    setHPF(x) { if (!ctx) return; hpf.frequency.setTargetAtTime(20 * Math.pow(70, clamp(x, 0, 1)), ctx.currentTime, .03); hpf.Q.value = .7 + x * 3; },
    setLPF(x) { if (!ctx) return; lpf.frequency.setTargetAtTime(18000 * Math.pow(400 / 18000, clamp(x, 0, 1)), ctx.currentTime, .03); },
    setReverb(x) { if (!ctx) return; revSend.gain.setTargetAtTime(.25 + x * .6, ctx.currentTime, .05); },
    // freeze: dry bus muted, reverb tail hangs
    setFreeze(on) { if (!ctx) return; const t = ctx.currentTime; dry.gain.setTargetAtTime(on ? .0001 : 1, t, on ? .01 : .005); revSend.gain.setTargetAtTime(on ? .0001 : .25, t, .01); revOut.gain.setTargetAtTime(on ? .7 : .5, t, .05); },
  };
})();

// ----------------------------- CLOCK -----------------------------
// Sample-accurate 16th-step scheduler. Clock.onStep(fn(step, when)) is called ~120ms ahead.
// Clock.pos() = fractional current step (for drawing). Clock.later(when, fn) runs fn when audio time arrives.
const Clock = (() => {
  const subs = []; let bpm = 105, playing = false, anchorStep = 0, anchorTime = 0, next = 0, timer = null, pausedAt = 0;
  const stepDur = () => 60 / bpm / 4;
  function tick() {
    const ctx = Audio.ctx; if (!playing || !ctx) return;
    const horizon = ctx.currentTime + .12;
    while (anchorTime + (next - anchorStep) * stepDur() < horizon) { const when = anchorTime + (next - anchorStep) * stepDur(); for (const f of subs) f(next, when); next++; }
  }
  return {
    get playing() { return playing; }, get bpm() { return bpm; }, stepDur,
    setBpm(b) { const p = this.pos(); bpm = b; if (playing) { anchorStep = p; anchorTime = Audio.now(); } },
    onStep(f) { subs.push(f); },
    pos() { if (!playing || !Audio.ctx) return pausedAt; return anchorStep + Math.max(0, (Audio.now() - anchorTime) / stepDur()); },
    timeOf(step) { return anchorTime + (step - anchorStep) * stepDur(); },
    start() { Audio.ensure(); if (playing) return; playing = true; anchorStep = pausedAt; anchorTime = Audio.now() + .05; next = Math.ceil(anchorStep); timer = setInterval(tick, 25); tick(); },
    stop() { if (!playing) return; pausedAt = this.pos(); playing = false; clearInterval(timer); },
    toggle() { playing ? this.stop() : this.start(); },
    later(when, fn) { setTimeout(fn, Math.max(0, (when - Audio.now()) * 1000)); },

// ----------------------------- CANVAS HELPERS -----------------------------
function setupCanvas(canvas, onResize) {
  const ctx = canvas.getContext('2d');
  const fit = () => { const d = Math.min(2, devicePixelRatio || 1), r = canvas.getBoundingClientRect(); canvas.width = r.width * d; canvas.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); onResize && onResize(r.width, r.height); };
  addEventListener('resize', fit); fit(); return ctx;
}
const ink = (a) => `rgba(255,255,255,${clamp(a, 0, 1).toFixed(3)})`;
const HOT = '#ff5a1f';
const hot = (a) => `rgba(255,90,31,${clamp(a, 0, 1).toFixed(3)})`;
// ===================== END CORE =====================

/* 66 · Concept 1 · Realtime DJ HUD — variation 1A: HORIZONTAL TIMELINE HUD.
   You schedule future events ("cues") with a radial pie (direction = type, drag length = intensity);
   each cue plays itself automatically, and when the playhead reaches it a live control appears in a
   fixed HUD panel at the bottom-left, under the playhead, so you can take over.
   Time flows right -> left; playhead at 25% width. Top band = energy (past = recorded, future = predicted),
   middle = cue lane, bottom = upcoming notes. Hover a cue to see the energy with vs without it.
   Lineage: #30 drop piston (DROP control), #49 HALF/RAVE/FAKEOUT flavors, #52 snap-to-archetype (RHYTHM),
   #62 radial layout (pie). Judge: is a fixed control panel + left-scrolling timeline easy to read and steer? */
// ==================== CONCEPT-1 ENGINE (identical in 1A / 1B / 1C; only the UI differs) ====================
Clock.setBpm(120);
const BAR = 16, POST = 64, LOOK = 128;                       // POST = climax steps after a drop
const TYPES = ['RHYTHM', 'DROP', 'LIFT', 'SWEEP', 'KILL', 'BREAK'];
const SHORT = { RHYTHM: 'RHY', DROP: 'DROP', LIFT: 'LIFT', SWEEP: 'SWP', KILL: 'KILL', BREAK: 'BRK' };
const FLAV = ['HALF', 'FULL', 'FAKE'];
// candidate percussion patterns, ordered sparse -> driving (intensity preselects)
const RHY = [
  { name: 'TRESILLO', kick: [0, 6, 12], tak: [3, 9], e: 0 },
  { name: 'BROKEN', kick: [0, 3, 10], tak: [4, 12], e: .04 },
  { name: 'FOUR', kick: [0, 4, 8, 12], tak: [], e: .09 },
];
const S = { cues: [], nextId: 1, rhythm0: 0, hist: [], played: [], pos: 0, holding: false, hover: null, tapT: -1e9, lastTap: -1 };

const snap4 = (s) => Math.round(s / 4) * 4;
const minFuture = () => Math.ceil((S.pos + 2) / 4) * 4;
function addCue(type, step, intensity) {
  const c = { id: S.nextId++, type, step: Math.max(snap4(step), minFuture()), len: type === 'DROP' ? 64 : 32, intensity: clamp(intensity, .05, 1),
    done: false, phase: 'wait', taps: [], locked: null, charge: 0, flavor: 'FULL', manual: false, dropAt: null, freezeAt: null, power: 1, buildStart: 0 };
  S.cues.push(c); S.cues.sort((a, b) => a.step - b.step); return c;
}
const started = (c) => c.phase !== 'wait' || c.step <= S.pos + 1.5;
function moveCue(c, step) { if (started(c)) return; c.step = Math.max(snap4(step), minFuture()); S.cues.sort((a, b) => a.step - b.step); }
function removeCue(c) {
  if (!c) return; if (c.type === 'DROP' && c.phase === 'freeze') Audio.setFreeze(false);
  S.cues = S.cues.filter(x => x !== c); if (S.hover === c) S.hover = null;
}
const setIntensity = (c, v) => { c.intensity = clamp(v, .05, 1); };

// ---------- rhythm candidates: circular snap distance between taps and kick onsets ----------
const cdist = (a, b) => { const d = Math.abs(mod(a - b, BAR)); return Math.min(d, BAR - d); };
function rhyConf(taps) {
  if (!taps.length) return [1 / 3, 1 / 3, 1 / 3];
  const raw = RHY.map(r => {
    let a = 0, b = 0;
    for (const t of taps) a += Math.min(...r.kick.map(o => cdist(t, o)));
    for (const o of r.kick) b += Math.min(...taps.map(t => cdist(t, o)));
    return a / taps.length + .5 * b / r.kick.length;
  });

}
const argmax = (arr) => arr.indexOf(Math.max(...arr));
const preselect = (i) => Math.min(2, Math.floor(i * 3));
const leadOf = (c) => c.locked ?? (c.taps.length ? argmax(rhyConf(c.taps)) : preselect(c.intensity));
function rhythmAt(s, skipId) {
  let r = S.rhythm0;
  for (const c of S.cues) if (c.type === 'RHYTHM' && c.id !== skipId && c.step <= s) r = leadOf(c);
  return r;
}

// ---------- DROP timing (predicted while not yet decided) ----------
function dropTimes(c) {
  if (c.dropAt != null) return { fr: c.freezeAt ?? c.dropAt, dr: c.dropAt };
  if (!c.manual) return { fr: c.freezeAt ?? c.step + c.len - 8, dr: c.step + c.len };
  const nb = Math.ceil((S.pos + 1.5) / 4) * 4;
  if (c.freezeAt != null) return { fr: c.freezeAt, dr: Math.max(c.freezeAt + 4, nb) };

  return { fr, dr: Math.ceil((fr + 4) / 4) * 4 };
}

// ---------- ENERGY model: base groove + every cue's characteristic shape ----------
function dropE(c, s, base) {
  if (s < c.step) return null;

    return base + .42 * (.4 + .6 * i) * clamp(p, 0, 1);

}

  const m = { LIFT: 0, SWEEP: 0, KILL: 0, BREAK: 0 };
  for (const c of S.cues) {
    if (c.id === skipId || !(c.type in m)) continue;
    const rel = s - c.step; if (rel < 0 || rel >= c.len) continue;
    const p = rel / c.len, shape = c.type === 'LIFT' ? p : c.type === 'SWEEP' ? 1 - Math.abs(2 * p - 1) : 1;

  e += .4 * m.LIFT - .32 * m.SWEEP - .3 * m.KILL;
  e = lerp(e, .1, m.BREAK);

// ---------- groove: deterministic per 8-bar phrase, density follows energy ----------
function noteAt(s, E) {
  const bar = Math.floor(s / BAR), i = mod(s, BAR), ch = chordAt(bar), ph = mod(bar, 8);
  if (!(i === 0 || hash01(ph, i, 11) < METRIC[i] * (.3 + .55 * E))) return null;
  const lane = i === 0 ? ch.pool[0] : ch.pool[Math.floor(hash01(ph, i, 3) * ch.pool.length)];
  const acc = i === 0 || (METRIC[i] >= .75 ? hash01(ph, i, 5) > .3 : hash01(ph, i, 5) > .85);
  return { lane, vel: acc ? .55 + .35 * E : .3, acc };

// ---------- DROP state machine (runs in the scheduler) ----------
function fireDrop(c, s, when) {

}
function stepDrop(c, s, when) {
  if (c.phase === 'wait') { c.phase = 'build'; c.buildStart = s; c.charge = 0; }
  if (c.phase === 'build') {

    if (c.dropAt != null && s >= c.dropAt) return fireDrop(c, s, when);
    if (c.charge >= 1) {
      c.phase = 'freeze'; c.freezeAt = s;
      Audio.pan(chordAt(Math.floor(s / BAR)).pool[0], when, .9, 16, 1);   // one naked note rings into the frozen hall
      Clock.later(when + .08, () => { if (c.phase === 'freeze') Audio.setFreeze(true); });
      return 'freeze';

    return due != null && s >= due ? fireDrop(c, s, when) : 'freeze';

  if (c.phase === 'post') { if (s >= c.dropAt + POST) { c.phase = 'done'; c.done = true; return null; } return 'post'; }
  return null;

Clock.onStep((s, when) => {
  const sd = Clock.stepDur(), i = mod(s, BAR), ch = chordAt(Math.floor(s / BAR));
  for (const c of S.cues) {
    if (c.done || c.type === 'DROP' || s < c.step) continue;
    if (c.phase === 'wait') c.phase = 'live';
    if (s >= c.step + c.len) { if (c.type === 'RHYTHM' && c.locked == null) c.locked = leadOf(c); c.done = true; c.phase = 'done'; }
  }

    if ((k === 0 && fl !== 'FAKE') || (k === 16 && fl === 'FAKE')) { Audio.impact(when, pw); Audio.sub(when, ch.bassHz, sd * 14, .6 * pw); }
    if (fake) { if (k === 0) Audio.kick(when, .5); if (kb === 8) Audio.tak(when, .35); n = n && n.acc && i % 8 === 0 ? { ...n, vel: .3 } : null; }
    else if (half) {

// ---------- live control (shared input semantics) ----------

const PIE_R = 92, PIE_DEAD = 14;

  else if (c.phase === 'freeze') st = `FREEZE · beat ${Math.floor((pos - c.freezeAt) / 4) + 1} · ${c.manual ? (c.dropAt != null ? 'drop armed' : 'release = drop on next beat') : 'auto drop at cue end'}`;
  else st = `DROP ${c.flavor} · bar ${Math.min(4, Math.floor((pos - c.dropAt) / BAR) + 1)}/4`;
  g.fillStyle = ink(.6); g.fillText(st, x + 110, y + 18);
  const post = c.phase === 'post';
  g.strokeStyle = ink(.4); g.strokeRect(sl.x + .5, sl.y + .5, sl.w, sl.h);
  g.fillStyle = c.phase === 'freeze' ? HOT : ink(.06); g.fillRect(sl.x + 1, sl.y + 1, sl.w - 1, 14);
  g.fillStyle = c.phase === 'freeze' ? '#000' : ink(.5); g.textAlign = 'center'; g.fillText('FRZ', sl.x + sl.w / 2, sl.y + 12);
  const fh = (post ? 0 : q) * sl.h; g.fillStyle = S.holding || (drag && drag.mode === 'hud') ? hot(.6) : ink(.35); g.fillRect(sl.x + 1, sl.y + sl.h - fh, sl.w - 1, fh);
  g.fillStyle = ink(.9); g.fillRect(sl.x - 4, sl.y + sl.h - fh, sl.w + 8, 2);
  FLAV.forEach((f, k) => {
    const r = hudFlav(k), on = c.flavor === f;
    g.strokeStyle = on ? HOT : ink(.2); g.strokeRect(r.x + .5, r.y + .5, r.w, r.h);
    g.fillStyle = on ? HOT : ink(.5); g.fillText(f, r.x + r.w / 2, r.y + 18);
    g.fillStyle = ink(.35); g.fillText({ HALF: 'half-time', FULL: '4-floor', FAKE: 'void→slam' }[f], r.x + r.w / 2, r.y + 36);
    // tiny kick diagram of the first 2 bars after the drop
    for (let i = 0; i < 32; i++) {
      const kk = f === 'FULL' ? i % 4 === 0 : f === 'HALF' ? i % 16 === 0 : i === 0 || (i >= 16 && i % 4 === 0);
      if (kk) { g.fillStyle = on ? HOT : ink(.5); g.fillRect(r.x + 6 + i * (r.w - 12) / 32, r.y + r.h - 30, 2, 12); }
    }
  });
  g.textAlign = 'left'; g.fillStyle = ink(.35); g.fillText('←/→ or drag sideways', hudFlav(0).x, y + HUD.h - 6);
}
requestAnimationFrame(frame);
demoPlan();
