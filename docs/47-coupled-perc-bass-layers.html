<!DOCTYPE html>

<title>47 — Single-Instrument 4-Layer Timing Coupling (Bass · Perc · Ghost · Melody)</title>
<style>

  button {

<body>
<canvas id="c"></canvas>
<header>
  <span class="hint"><b>47</b> · 1-INSTRUMENT COUPLING · <b>click pan / 1–8</b> melody · <b>center / D</b> ding · <b>rim / T</b> tak · <b>outer / G</b> gu · <b>click ring</b> edit layer · <b>SPACE</b> play</span>
  <div class="grp">
    <button id="modeBtn" class="on" type="button" title="Cycle Timing Coupling Topology (C)">COUPLE: a-SUCTION</button>
    <button id="playBtn" type="button"><span class="dot"></span><span id="playLbl">PLAY</span></button>
  </div>
</header>
<script type="module">
'use strict';
// ============================================================================
// 47 — SINGLE-INSTRUMENT 4-LAYER TIMING COUPLING (1 CORE INTERACTION)
//   One handpan = 4 acoustically distinct layers from #41/#42:
//     Ring 0 (Inner): BASS   — Ding root (i–VI–VII) + Gu Helmholtz shell (65–250 Hz)
//     Ring 1:         PERC   — Rim Tak slap (2.4 kHz) + 3.8 kHz skin clicks + Muted slap
//     Ring 2:         GHOST  — 50% Ghost-Note tactile bed (250–700 Hz @ ~30% vel)
//     Ring 3 (Outer): MELODY — Singing foreground accents (700–2500 Hz @ ~92% vel)
//   TIMING COUPLING:
//     Performing ANY zone on the pan (or toggling steps on any ring) automatically
//     re-couples the other 3 layers so they INTERLOCK instead of colliding:
//       - Ghost bed ducks out of loud Melody steps & dips on "e" (1,5,9,13)
//       - Perc snaps into complementary backbeats + "a"-16th pickups around Bass
//       - Melody & Ghost shift harmonic gravity to match the active Bass root!
// ============================================================================

const A4 = 440.5, semiHz = (st) => A4 * Math.pow(2, st / 12);
// 0 = Center Ding (E3); 1..8 = 8 tone fields arranged circularly like a real E Amara handpan
const TONES = [
  { name: 'E3',  deg: '^1',  hz: semiHz(-17), pan:  0.00 }, // 0: Center Ding
  { name: 'B3',  deg: '^5',  hz: semiHz(-10), pan: -0.35 }, // 1
  { name: 'C4',  deg: '^b6', hz: semiHz(-9),  pan:  0.35 }, // 2
  { name: 'D4',  deg: '^b7', hz: semiHz(-7),  pan: -0.48 }, // 3
  { name: 'E4',  deg: '^1',  hz: semiHz(-5),  pan:  0.48 }, // 4
  { name: 'F#4', deg: '^2',  hz: semiHz(-3),  pan: -0.38 }, // 5
  { name: 'G4',  deg: '^b3', hz: semiHz(-2),  pan:  0.38 }, // 6
  { name: 'A4',  deg: '^4',  hz: semiHz(0),   pan: -0.22 }, // 7
  { name: 'B4',  deg: '^5',  hz: semiHz(2),   pan:  0.22 }, // 8
];

const PROG = [
  { sym: 'i',   dingHz: semiHz(-17), pool: [1, 4, 6, 8] },
  { sym: 'VI',  dingHz: semiHz(-21), pool: [2, 4, 6, 8] },
  { sym: 'VII', dingHz: semiHz(-19), pool: [3, 5, 7, 8] },
  { sym: 'i',   dingHz: semiHz(-17), pool: [1, 4, 6, 5] },
];

// 4 Coupling Topologies from #41/#42 & #44
const MODES = [
  { id: 'suction',  label: 'a-SUCTION',  bass: [1,0,0,0, 0,0,0,0, .7,0,0,0, 0,0,0,.8], perc: [0,0,0,.8, 1,0,0,.8, 0,0,0,1, 1,0,0,.8] },
  { id: 'tresillo', label: 'TRESILLO',   bass: [1,0,0,0, 0,0,.85,0, 0,0,0,0, .9,0,0,0], perc: [0,0,.5,0, 1,0,0,.7, 0,0,.5,0, 1,0,0,.8] },
  { id: 'duet32',   label: '3:2 DUET',   bass: [1,0,0,.75, 0,0,.85,0, 0,.75,0,0, .9,0,0,0], perc: [0,0,0,.7, 0,0,.7,0, 0,0,.75,0, 1,0,0,.6] },
  { id: 'hocket',   label: 'CALL-RESP',  bass: [1,0,0,0, 0,0,.75,0, 0,0,0,0, 0,0,0,.7], perc: [0,0,0,0, 0,0,0,0, .8,0,.6,.9, 1,0,.6,.85] },
];

const BPM = 105, TATUM = 60 / BPM / 4, LOOKAHEAD = 0.10;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const mixInk = (heat, alpha) => {
  const h = clamp(heat, 0, 1), a = clamp(alpha, 0, 1);
  return h <= 0.005 ? `rgba(255,255,255,${a.toFixed(3)})`
    : `rgba(255,${Math.round(lerp(255, 90, h))},${Math.round(lerp(255, 31, h))},${clamp(lerp(a, Math.max(a, 0.94), h), 0, 1).toFixed(3)})`;
};

// ==================== 1. SINGLE-INSTRUMENT 4-LAYER ACOUSTIC SYNTH ====================
let actx = null, masterLP = null, noiseBuf = null;
function ensureAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const sr = actx.sampleRate;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -9; comp.ratio.value = 5; comp.release.value = 0.14; comp.connect(actx.destination);
    const master = actx.createGain(); master.gain.value = 0.85; master.connect(comp);
    masterLP = actx.createBiquadFilter(); masterLP.type = 'lowpass'; masterLP.frequency.value = 2450; masterLP.Q.value = 0.65;

    const dry = actx.createGain(); dry.gain.value = 0.82;
    const wet = actx.createGain(); wet.gain.value = 0.42;
    const irLen = Math.floor(sr * 2.4), ir = actx.createBuffer(2, irLen, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch); let lp = 0;
      for (let i = 0; i < irLen; i++) { lp = lp * 0.66 + (Math.random() * 2 - 1) * 0.34; d[i] = lp * Math.pow(1 - i / irLen, 2.55) * 0.50; }
    }
    const conv = actx.createConvolver(); conv.buffer = ir;
    masterLP.connect(dry); dry.connect(master);
    masterLP.connect(conv); conv.connect(wet); wet.connect(master);

    noiseBuf = actx.createBuffer(1, Math.floor(sr * 0.055), sr);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nd.length * 0.24));
  }
  if (actx.state === 'suspended') actx.resume();
}

function playTone(idx, when, vel = 0.8, opts = {}) {
  ensureAudio();
  const t = TONES[idx]; if (!t) return;
  const { isGhost = false, isMuted = false, dingHz = null } = opts;
  const isDing = idx === 0, freq = (isDing && dingHz) ? dingHz : t.hz;
  const t0 = Math.max(actx.currentTime + 0.002, when), v = clamp(vel, 0.12, 1.05);
  const sus = (isMuted ? 0.18 : isGhost ? 0.58 : isDing ? 2.15 : 1.55);

  const out = actx.createGain(); out.gain.setValueAtTime(v * (isDing ? 0.45 : 0.30), t0);
  const pan = actx.createStereoPanner(); pan.pan.setValueAtTime(t.pan, t0);
  out.connect(pan); pan.connect(masterLP);

  const partials = isDing
    ? [[1.0, 1.0, 1.0], [1.003, 0.24, 0.90], [2.0, 0.32, 0.72], [3.0, 0.38, 0.60]]
    : [[1.0, 0.92, 1.0], [1.0025, 0.18, 0.86], [2.0, 0.26, 0.68], [3.0, 0.46, 0.66]];
  for (const [r, amp, dm] of partials) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * r, t0);
    const atk = isMuted ? 0.002 : (isDing ? 0.007 : 0.005), dec = Math.max(0.06, sus * dm);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(amp, t0 + atk); g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
    o.connect(g); g.connect(out); o.start(t0); o.stop(t0 + atk + dec + 0.04);
  }
  const ns = actx.createBufferSource(); ns.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = isMuted ? 1900 : 3700; bp.Q.value = 2.2;
  const ng = actx.createGain(); ng.gain.setValueAtTime(v * (isMuted ? 0.16 : isGhost ? 0.035 : 0.075), t0);
  ns.connect(bp); bp.connect(ng); ng.connect(pan); ns.start(t0);
}

// Acoustic handpan percussion: Gu (Helmholtz shell bass), Tak (shoulder slap), Click (3.8 kHz skin tick)
function playPerc(kind, when, vel = 0.75, panVal = 0) {
  ensureAudio();
  const t0 = Math.max(actx.currentTime + 0.002, when), v = clamp(vel, 0.12, 1.0);
  const pan = actx.createStereoPanner(); pan.pan.setValueAtTime(panVal, t0); pan.connect(masterLP);

  if (kind === 'gu') {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(122, t0); o.frequency.exponentialRampToValueAtTime(62, t0 + 0.14);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v * 0.56, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.24);
    o.connect(g); g.connect(pan); o.start(t0); o.stop(t0 + 0.26);
    return;
  }

  const ns = actx.createBufferSource(); ns.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = kind === 'tak' ? 2350 : 3850;
  bp.Q.value = kind === 'tak' ? 3.4 : 2.6;
  const g = actx.createGain(); g.gain.setValueAtTime(v * (kind === 'tak' ? 0.36 : 0.22), t0);
  ns.connect(bp); bp.connect(g); g.connect(pan); ns.start(t0);

  if (kind === 'tak') {
    const bo = actx.createOscillator(), bg = actx.createGain();
    bo.type = 'triangle'; bo.frequency.setValueAtTime(340, t0); bo.frequency.exponentialRampToValueAtTime(190, t0 + 0.032);
    bg.gain.setValueAtTime(0.0001, t0); bg.gain.linearRampToValueAtTime(v * 0.18, t0 + 0.002); bg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
    bo.connect(bg); bg.connect(pan); bo.start(t0); bo.stop(t0 + 0.05);
  }
}

// ==================== 2. 4-LAYER TIMING COUPLING MODEL ====================
const state = {
  playing: false, modeIdx: 0, step: 0, bar: 0,
  nextStepTime: 0, visualStep: 0,
  // 4 coupled 16-step layer grids (all performed on ONE handpan!)
  bass:   new Float32Array(16), // 0=off, >0 = Ding/Gu strength (Gu on off-accents, Ding on root!)
  perc:   new Float32Array(16), // 0=off, 0.5=click, 1.0=tak
  ghost:  new Float32Array(16), // auto-coupled 50% ghost bed (yields to melody & "e" dips!)
  melody: new Int8Array(16),    // -1=off, 1..8 = tone field index
  // Visual excitation
  toneGlow: new Float32Array(9), toneHeat: new Float32Array(9),
  rimGlow: 0, rimHeat: 0, guGlow: 0, guHeat: 0,
  stepFlash: [new Float32Array(16), new Float32Array(16), new Float32Array(16), new Float32Array(16)],
  couplingArcs: [],
};

const currentChord = () => PROG[state.bar % PROG.length];

// Recompute automatic timing coupling so Bass, Perc, Ghost, and Melody lock cleanly without mud!
function applyCoupling(resetPatterns = false) {
  const m = MODES[state.modeIdx];
  if (resetPatterns) {
    for (let s = 0; s < 16; s++) {
      state.bass[s] = m.bass[s];
      state.perc[s] = m.perc[s];
    }
    state.melody.fill(-1);
    if (m.id === 'hocket') { state.melody[0] = 4; state.melody[3] = 6; state.melody[6] = 8; }
    else if (m.id === 'duet32') { state.melody[0] = 4; state.melody[3] = 6; state.melody[6] = 8; state.melody[9] = 7; state.melody[12] = 4; }
    else { state.melody[0] = 4; state.melody[3] = 6; state.melody[6] = 8; state.melody[10] = 7; state.melody[12] = 4; }
  }
  // Coupling Law 1: Ghost bed automatically fills gaps, dips on "e" (1,5,9,13), boosts "a" (3,7,11,15),
  // and DUCKS out of strong Melody strikes so 50% figure-ground separation stays crystal-clear!
  for (let s = 0; s < 16; s++) {
    if (state.melody[s] >= 1) {
      state.ghost[s] = 0; // yield slot to foreground melody!
    } else if (m.id === 'hocket' && s >= 8) {
      state.ghost[s] = (s % 2 === 0) ? 0.24 : 0; // breathe during perc answer
    } else if (s % 4 === 1) {
      state.ghost[s] = state.bass[s] > 0 ? 0 : 0.16; // deep "e" dip
    } else if (s % 4 === 3) {
      state.ghost[s] = 0.42; // "a"-16th pickup suction
    } else {
      state.ghost[s] = state.bass[s] > 0.8 ? 0.22 : 0.30;
    }
  }
}

function addCouplingArc(fromRing, toRing, step, hot = false) {
  state.couplingArcs.push({ fromRing, toRing, step, hot, born: performance.now(), life: 420 });
  if (state.couplingArcs.length > 24) state.couplingArcs.shift();
}

// ==================== 3. SCHEDULER ====================
let schedTimer = null;
function scheduler() {
  if (!state.playing || !actx) return;
  while (state.nextStepTime < actx.currentTime + LOOKAHEAD) {
    const s = state.step, bar = state.bar, tBase = state.nextStepTime;
    const ch = PROG[bar % PROG.length];
    const jitter = (Math.random() * 2 - 1) * 0.007;

    // 1. BASS LAYER (Ding root + Helmholtz Gu shell thump)
    if (state.bass[s] > 0.05) {
      const bv = state.bass[s];
      const tHit = Math.max(actx.currentTime + 0.002, tBase + jitter - 0.005);
      // Downbeats & step 15 play resonant Ding; inner syncopations layer warm Helmholtz Gu!
      if (s === 0 || s === 6 || s === 12 || s === 15) {
        playTone(0, tHit, bv * 0.96, { dingHz: ch.dingHz });
      }
      if (s === 0 || s === 8 || s === 10 || (s === 6 && bv > 0.7)) {
        playPerc('gu', tHit, bv * 0.82, 0);
      }
      scheduleVis(tHit, () => {
        state.toneGlow[0] = 1; state.guGlow = 0.85; state.stepFlash[0][s] = 1;
        if (state.perc[(s + 1) % 16] > 0) addCouplingArc(0, 1, s, false);
      });
    }

    // 2. PERCUSSION LAYER (Rim Tak on 4/12 + 3.8kHz finger clicks on "a"-16th pickups)
    if (state.perc[s] > 0.05) {
      const pv = state.perc[s], isTak = (s === 4 || s === 12) || pv >= 0.92;
      const tHit = Math.max(actx.currentTime + 0.002, tBase + jitter + (isTak ? -0.003 : 0.002));
      playPerc(isTak ? 'tak' : 'click', tHit, pv * 0.84, s % 8 < 4 ? -0.22 : 0.22);
      scheduleVis(tHit, () => { state.rimGlow = Math.max(state.rimGlow, isTak ? 1 : 0.6); state.stepFlash[1][s] = 1; });
    }

    // 3. GHOST BED LAYER (50% Rule: soft ~30% vel 16th-note body pulse)
    if (state.ghost[s] > 0.05) {
      const gv = state.ghost[s];
      const toneIdx = ch.pool[(s + bar) % ch.pool.length];
      const tHit = Math.max(actx.currentTime + 0.002, tBase + jitter + 0.003);
      playTone(toneIdx, tHit, gv, { isGhost: true, isMuted: s % 4 === 2 && state.modeIdx === 1 });
      scheduleVis(tHit, () => { state.toneGlow[toneIdx] = Math.max(state.toneGlow[toneIdx], 0.35); state.stepFlash[2][s] = 0.7; });
    }

    // 4. MELODY LAYER (Singing foreground accents — 3x louder than ghost bed!)
    if (state.melody[s] >= 1) {
      let mIdx = state.melody[s];
      // Subtle harmonic gravity pull on bar 2/3 while preserving contour
      if (bar % 4 === 1 && !ch.pool.includes(mIdx) && mIdx > 1) mIdx = clamp(mIdx - 1, 1, 8);
      const tHit = Math.max(actx.currentTime + 0.002, tBase + jitter - 0.005);
      const mv = s % 4 === 3 ? 0.96 : 0.88;
      playTone(mIdx, tHit, mv, { isGhost: false });
      scheduleVis(tHit, () => {
        state.toneGlow[mIdx] = 1; state.stepFlash[3][s] = 1;
        if (state.bass[s] > 0) addCouplingArc(3, 0, s, false);
      });
    }

    scheduleVis(tBase, () => { state.visualStep = s; });

    state.nextStepTime += TATUM;
    state.step = (state.step + 1) % 16;
    if (state.step === 0) state.bar++;
  }
}

function scheduleVis(when, fn) {
  const ms = Math.max(0, (when - actx.currentTime) * 1000);
  setTimeout(() => { if (state.playing) fn(); }, ms);
}

const playBtn = document.getElementById('playBtn'), playLbl = document.getElementById('playLbl'), modeBtn = document.getElementById('modeBtn');
function togglePlay() {
  ensureAudio();
  if (!state.playing) {
    state.playing = true; state.step = 0; state.nextStepTime = actx.currentTime + 0.03;
    scheduler(); schedTimer = setInterval(scheduler, 20);
  } else {
    state.playing = false; clearInterval(schedTimer); schedTimer = null;
  }
  playBtn.classList.toggle('on', state.playing); playLbl.textContent = state.playing ? 'PAUSE' : 'PLAY';
}
function cycleMode() {
  state.modeIdx = (state.modeIdx + 1) % MODES.length;
  modeBtn.textContent = `COUPLE: ${MODES[state.modeIdx].label}`;
  applyCoupling(true);
}
playBtn.addEventListener('click', togglePlay);
modeBtn.addEventListener('click', cycleMode);

// Live performance directly on ONE handpan — teaches & couples the active step!
function performZone(kind, toneIdx = 0) {
  ensureAudio();
  const s = state.playing ? state.visualStep : (state.step++ % 16);
  const ch = currentChord();

  if (kind === 'ding') {
    playTone(0, actx.currentTime, 0.96, { dingHz: ch.dingHz });
    state.toneGlow[0] = 1; state.toneHeat[0] = 1;
    state.bass[s] = 0.95; state.stepFlash[0][s] = 1;
    // Automatically insert a complementary "a"-pickup click right before if empty!
    const pre = (s + 15) % 16;
    if (state.perc[pre] === 0) state.perc[pre] = 0.65;
    addCouplingArc(0, 1, s, true);
    applyCoupling(false);
  } else if (kind === 'gu') {
    playPerc('gu', actx.currentTime, 0.96, 0);
    state.guGlow = 1; state.guHeat = 1;
    state.bass[s] = 0.85; state.stepFlash[0][s] = 1;
    addCouplingArc(0, 2, s, true);
    applyCoupling(false);
  } else if (kind === 'tak') {
    playPerc('tak', actx.currentTime, 0.92, 0.15);
    state.rimGlow = 1; state.rimHeat = 1;
    state.perc[s] = 1.0; state.stepFlash[1][s] = 1;
    addCouplingArc(1, 0, s, true);
    applyCoupling(false);
  } else if (kind === 'melody') {
    playTone(toneIdx, actx.currentTime, 0.94, {});
    state.toneGlow[toneIdx] = 1; state.toneHeat[toneIdx] = 1;
    state.melody[s] = toneIdx; state.stepFlash[3][s] = 1;
    addCouplingArc(3, 2, s, true);
    applyCoupling(false); // automatically ducks ghost note on step s!
  }
}

// ==================== 4. MINIMALIST TOP-DOWN HANDPAN + 4-RING COUPLER GEOMETRY ====================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0;
const geo = { cx: 0, cy: 0, panR: 130, dingR: 36, fieldR: 84, fieldPadR: 22, rings: [172, 200, 228, 256] };

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  geo.cx = W * 0.5; geo.cy = H * 0.52;
  const maxR = Math.min(W, H - 70) * 0.44;
  geo.panR = clamp(maxR * 0.52, 88, 154);
  geo.dingR = geo.panR * 0.27;
  geo.fieldR = geo.panR * 0.64;
  geo.fieldPadR = geo.panR * 0.165;
  const ringStep = clamp((maxR - geo.panR - 16) / 4, 20, 34);
  geo.rings = [0, 1, 2, 3].map(i => geo.panR + 22 + i * ringStep);
}
window.addEventListener('resize', layout); layout();

// Exact angular layout of the 8 tone fields around the center Ding
const tonePos = (idx) => {
  if (idx === 0) return { x: geo.cx, y: geo.cy };
  // Alternate left/right ascending from bottom like a physical handpan!
  const order = [0, 4, 3, 5, 2, 6, 1, 7]; // maps 1..8 clockwise starting bottom
  const ang = Math.PI * 0.5 + (order[idx - 1] / 8) * Math.PI * 2;
  return { x: geo.cx + Math.cos(ang) * geo.fieldR, y: geo.cy + Math.sin(ang) * geo.fieldR };
};
const stepAngle = (s) => -Math.PI * 0.5 + (s / 16) * Math.PI * 2;

const hover = { zone: null, idx: -1, ring: -1, step: -1 };
function hitTest(mx, my) {
  const dx = mx - geo.cx, dy = my - geo.cy, dist = Math.hypot(dx, dy);
  // 1. Center Ding
  if (dist <= geo.dingR + 4) return { zone: 'ding', idx: 0 };
  // 2. Tone fields 1..8
  for (let i = 1; i <= 8; i++) {
    const p = tonePos(i);
    if (Math.hypot(mx - p.x, my - p.y) <= geo.fieldPadR + 4) return { zone: 'melody', idx: i };
  }
  // 3. Handpan Rim (Tak) vs Outer Shell edge (Gu)
  if (dist <= geo.panR - 8) return { zone: 'tak', idx: -1 };
  if (dist <= geo.panR + 10) return { zone: 'gu', idx: -1 };

  // 4. Outer 4-Ring 16-Step Phase Coupler (click any step on any ring to toggle/couple!)
  for (let ri = 0; ri < 4; ri++) {
    if (Math.abs(dist - geo.rings[ri]) <= 12) {
      let ang = Math.atan2(dy, dx) + Math.PI * 0.5;
      if (ang < 0) ang += Math.PI * 2;
      const s = Math.round((ang / (Math.PI * 2)) * 16) % 16;
      return { zone: 'ring', ring: ri, step: s };
    }
  }
  return { zone: null, idx: -1, ring: -1, step: -1 };
}

canvas.addEventListener('pointerdown', (e) => {
  const r = canvas.getBoundingClientRect(), h = hitTest(e.clientX - r.left, e.clientY - r.top);
  if (!h.zone) return;
  ensureAudio();
  if (h.zone === 'ring') {
    const { ring, step } = h;
    if (ring === 0) state.bass[step] = state.bass[step] > 0 ? 0 : 0.90;
    else if (ring === 1) state.perc[step] = state.perc[step] > 0 ? 0 : (step % 4 === 0 ? 1.0 : 0.75);
    else if (ring === 2) state.ghost[step] = state.ghost[step] > 0 ? 0 : 0.32;
    else if (ring === 3) state.melody[step] = state.melody[step] >= 1 ? -1 : currentChord().pool[step % 4];
    state.stepFlash[ring][step] = 1;
    if (ring !== 2) applyCoupling(false);
    return;
  }
  performZone(h.zone, h.idx);
});

canvas.addEventListener('pointermove', (e) => {
  const r = canvas.getBoundingClientRect(), h = hitTest(e.clientX - r.left, e.clientY - r.top);
  Object.assign(hover, { zone: h.zone, idx: h.idx ?? -1, ring: h.ring ?? -1, step: h.step ?? -1 });
  canvas.style.cursor = h.zone ? 'pointer' : 'default';
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.repeat) return;
  else if (e.key.toLowerCase() === 'c') cycleMode();
  else if (e.key.toLowerCase() === 'd') performZone('ding');
  else if (e.key.toLowerCase() === 'g') performZone('gu');
  else if (e.key.toLowerCase() === 't') performZone('tak');
  else if (e.key >= '1' && e.key <= '8') performZone('melody', Number(e.key));
});

// ==================== 5. ULTRA-CLEAN MONOCHROME RENDERER ====================
const sCirc = (x, y, r, col, lw = 1) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.stroke(); };
const fCirc = (x, y, r, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2); ctx.fill(); };
const RING_NAMES = ['BASS', 'PERC', 'GHOST', 'MELODY'];

let lastPerf = performance.now();
function frame(nowPerf) {
  const dt = Math.min(0.05, Math.max(0.001, (nowPerf - lastPerf) / 1000)); lastPerf = nowPerf;
  for (let i = 0; i < 9; i++) { state.toneGlow[i] *= Math.exp(-dt * 5.2); state.toneHeat[i] = Math.max(0, state.toneHeat[i] - dt * 2.5); }
  state.rimGlow *= Math.exp(-dt * 6.5); state.rimHeat = Math.max(0, state.rimHeat - dt * 2.8);
  state.guGlow *= Math.exp(-dt * 5.0); state.guHeat = Math.max(0, state.guHeat - dt * 2.5);
  for (let ri = 0; ri < 4; ri++) for (let s = 0; s < 16; s++) state.stepFlash[ri][s] *= Math.exp(-dt * 7.5);

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const cx = geo.cx, cy = geo.cy;

  // 1. Subtle radial beat spokes (steps 0, 4, 8, 12 downbeats + 3, 7, 11, 15 "a" pickups)
  for (let s = 0; s < 16; s++) {
    const a = stepAngle(s), isBeat = s % 4 === 0, isPickup = s % 4 === 3;
    if (!isBeat && !isPickup) continue;
    const r0 = geo.rings[0] - 8, r1 = geo.rings[3] + 10;
    ctx.strokeStyle = isBeat ? 'rgba(255,255,255,0.12)' : 'rgba(255,90,31,0.12)';
    ctx.lineWidth = isBeat ? 0.9 : 0.75;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.stroke();
  }

  // 2. Coupling Arcs pulsing radially between interlocked layers!
  for (let i = state.couplingArcs.length - 1; i >= 0; i--) {
    const c = state.couplingArcs[i], p = (nowPerf - c.born) / c.life;
    if (p >= 1) { state.couplingArcs.splice(i, 1); continue; }
    const a = stepAngle(c.step), r1 = geo.rings[c.fromRing], r2 = geo.rings[c.toRing];
    ctx.strokeStyle = mixInk(c.hot ? 1 : 0.35, (1 - p) * 0.72);
    ctx.lineWidth = c.hot ? 1.5 : 1.0;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
  }

  // 3. The 4 Concentric Phase-Coupled Layer Rings
  ctx.font = '8.5px ui-monospace, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (let ri = 0; ri < 4; ri++) {
    const R = geo.rings[ri];
    sCirc(cx, cy, R, `rgba(255,255,255,${ri === 2 ? 0.06 : 0.11})`, 0.85);
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillText(RING_NAMES[ri], cx + 8, cy - R - 7);

    for (let s = 0; s < 16; s++) {
      const a = stepAngle(s), px = cx + Math.cos(a) * R, py = cy + Math.sin(a) * R;
      const val = ri === 0 ? state.bass[s] : ri === 1 ? state.perc[s] : ri === 2 ? state.ghost[s] : (state.melody[s] >= 1 ? 0.92 : 0);
      const fl = state.stepFlash[ri][s], hov = hover.zone === 'ring' && hover.ring === ri && hover.step === s;
      const isNow = state.playing && s === state.visualStep;

      if (val > 0.05) {
        const rad = ri === 0 ? 4.4 : ri === 1 ? 3.2 : ri === 2 ? 2.0 : 3.9;
        const heat = fl > 0.3 && (ri === 0 || ri === 3) ? fl * 0.75 : (hov ? 0.9 : 0);
        if (ri === 1) { // Diamond tick for Percussion
          ctx.save(); ctx.translate(px, py); ctx.rotate(a + Math.PI * 0.25);
          ctx.fillStyle = mixInk(heat, (0.55 + fl * 0.45)); ctx.fillRect(-rad, -rad, rad * 2, rad * 2);
          ctx.restore();
        } else if (ri === 2) { // Soft tiny dot for 50% Ghost Bed
          fCirc(px, py, rad + fl * 1.1, `rgba(255,255,255,${(0.24 + val * 0.45 + fl * 0.35).toFixed(3)})`);
        } else {
          fCirc(px, py, rad + fl * 1.8, mixInk(heat, 0.62 + fl * 0.38));
        }
      } else if (hov || isNow) {
        sCirc(px, py, hov ? 3.8 : 2.2, hov ? '#ff5a1f' : 'rgba(255,255,255,0.35)', 0.85);
      }
    }
  }

  // Live Playhead Radar Hand
  if (state.playing) {
    const a = stepAngle(state.visualStep);
    ctx.strokeStyle = 'rgba(255,90,31,0.52)'; ctx.lineWidth = 1.15;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * (geo.panR + 8), cy + Math.sin(a) * (geo.panR + 8));
    ctx.lineTo(cx + Math.cos(a) * (geo.rings[3] + 10), cy + Math.sin(a) * (geo.rings[3] + 10));
    ctx.stroke();
  }

  // 4. Center Minimalist Handpan Shell (1 physical instrument!)
  // Outer Gu edge ring
  const guHov = hover.zone === 'gu';
  sCirc(cx, cy, geo.panR + 4 + state.guGlow * 3, mixInk(state.guHeat, 0.16 + state.guGlow * 0.65 + (guHov ? 0.3 : 0)), 1.0 + state.guGlow);
  // Rim / Shoulder (Tak zone)
  const takHov = hover.zone === 'tak';
  sCirc(cx, cy, geo.panR, mixInk(state.rimHeat, 0.34 + state.rimGlow * 0.60 + (takHov ? 0.28 : 0)), 1.2 + state.rimGlow * 0.8);

  // Center Ding (Bass root)
  const dHov = hover.zone === 'ding';
  sCirc(cx, cy, geo.dingR + state.toneGlow[0] * 3.5, mixInk(state.toneHeat[0], 0.44 + state.toneGlow[0] * 0.56 + (dHov ? 0.3 : 0)), 1.25);
  ctx.font = '10px ui-monospace, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = mixInk(state.toneHeat[0], 0.72 + state.toneGlow[0] * 0.28);
  ctx.fillText(`${currentChord().sym} · DING`, cx, cy);

  // 8 Circular Tone Fields
  for (let i = 1; i <= 8; i++) {
    const p = tonePos(i), g = state.toneGlow[i], h = state.toneHeat[i], hov = hover.zone === 'melody' && hover.idx === i;
    fCirc(p.x, p.y, geo.fieldPadR, mixInk(h, 0.02 + g * 0.14));
    sCirc(p.x, p.y, geo.fieldPadR, mixInk(h, 0.26 + g * 0.72 + (hov ? 0.35 : 0)), 0.95 + g * 0.7);
    ctx.font = '9.5px ui-monospace, monospace';
    ctx.fillStyle = mixInk(h, 0.42 + g * 0.58 + (hov ? 0.3 : 0));
    ctx.fillText(TONES[i].name, p.x, p.y - 3);
    ctx.font = '8px ui-monospace, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fillText(String(i), p.x, p.y + 8);
  }

  requestAnimationFrame(frame);
}

applyCoupling(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
